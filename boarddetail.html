<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon.svg" />
  <title>가지가지 상세</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@500');
    :root{--line:#eee9f8;--muted:#8b95a1;--brand:#7c3aed;--brand-rgb:124,58,237;--page:#f7f4ff}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#111827;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:500;font-style:normal;font-size:24px;line-height:1;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
    .app{max-width:430px;margin:0 auto;min-height:100vh}
    .hero{position:relative;background:#f3edff}
    .hero img{width:100%;height:300px;object-fit:cover;display:block;background:#f3f4f6}
    .topbtns{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between;color:#fff}
    .icon-link,.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:none;border-radius:999px;background:rgba(17,24,39,.42);color:#fff;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;text-decoration:none}
    .top-actions{display:flex;gap:6px}
    .content{padding:18px 16px 32px;border-top:1px solid var(--line)}
    h1{margin:0;font-size:21px;line-height:1.35;letter-spacing:-.02em;font-weight:600}
    .meta{margin:8px 0 14px;color:var(--muted);font-size:12px;font-weight:600}
    .body{font-size:15px;line-height:1.45;white-space:normal;word-break:break-word}
    .body p{margin:.22em 0}
    .body h1{margin:.7em 0 .34em;font-size:1.16em;line-height:1.35;font-weight:900}
    .body h2{margin:.62em 0 .3em;font-size:1.06em;line-height:1.35;font-weight:900}
    .body h3{margin:.56em 0 .28em;font-size:1em;line-height:1.35;font-weight:800}
    .body ul,.body ol{margin:.28em 0 .28em 1.1em;padding:0}
    .body li{margin:.12em 0}
    .body .md-table-wrap{overflow-x:auto;margin:.5em 0}
    .body .md-table{width:100%;border-collapse:collapse;font-size:13px}
    .body .md-table th,.body .md-table td{border:1px solid #e5e7eb;padding:8px 10px;text-align:left;vertical-align:top}
    .body .md-table th{background:#f8fafc;font-weight:800}
    .comments-panel{padding:16px;background:#fff;border-top:1px solid var(--line);overflow-x:hidden}
    .comments-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .comments-title{font-size:18px;font-weight:950;letter-spacing:-.03em}.comments-count{color:var(--muted);font-size:13px;font-weight:850}
    .comment-list{display:grid;gap:18px;padding-bottom:18px;overflow-x:hidden}.comment-thread{position:relative;min-width:0}.comment-thread.has-replies::before{content:"";position:absolute;left:18px;top:var(--thread-line-top,36px);bottom:var(--thread-line-bottom,15px);border-left:1px solid #d8d5df;z-index:0}.comment-item{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;min-width:0;z-index:1}.comment-item.reply{grid-template-columns:30px minmax(0,1fr);margin-left:46px}.reply-list{position:relative;display:grid;gap:12px;margin-top:12px}.reply-list::before{display:none}.comment-item.reply::before{content:"";position:absolute;left:-28px;top:15px;width:27px;height:0;border-bottom:1px solid #d8d5df}.comment-avatar{width:36px;height:36px;border-radius:999px;background:#f3edff;color:#5b21b6;display:grid;place-items:center;font-size:13px;font-weight:950;overflow:hidden;position:relative;z-index:1}.comment-item.reply .comment-avatar{width:30px;height:30px}.comment-avatar img{width:100%;height:100%;display:block;object-fit:cover}.comment-main{min-width:0;overflow-wrap:anywhere}.comment-meta{display:flex;align-items:center;gap:6px;color:#8b95a1;font-size:12px;font-weight:800;min-width:0}.comment-name{color:#4b5563;font-weight:950;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%}.comment-body{margin-top:4px;color:#111827;font-size:14px;line-height:1.5;word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap}.comment-actions{margin-top:8px;display:flex;align-items:center;gap:12px}.reply-btn,.comment-delete-btn{border:none;background:transparent;color:#6b7280;font-size:12px;font-weight:900;padding:0;cursor:pointer}.comment-delete-btn{color:#dc2626}.comment-empty{padding:20px 0;color:#8b95a1;font-size:14px;text-align:center}.comment-composer{--composer-avatar:none;position:sticky;bottom:0;display:flex;align-items:flex-end;gap:8px;padding:10px 0 0;background:#fff;overflow-x:hidden}.comment-composer:before,.reply-composer:before{content:"";width:30px;height:30px;flex:0 0 auto;border-radius:999px;background:#f3edff var(--composer-avatar) center/cover no-repeat}.comment-input{flex:1;min-height:36px;max-height:118px;padding:9px 12px;border:1px solid #e5e7eb;border-radius:18px;background:#f9fafb;color:#111827;font-size:14px;line-height:1.35;resize:none;outline:none;overflow:hidden}.comment-input.is-scrollable{overflow:auto}.comment-input:focus{border-color:#c4b5fd;background:#fff;box-shadow:0 0 0 3px rgba(var(--brand-rgb),.10)}.comment-send{width:40px;height:40px;flex:0 0 40px;border:none;border-radius:999px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px rgba(124,58,237,.24);position:relative;transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease}.comment-send:before{content:"";width:13px;height:13px;display:block;border-top:3px solid currentColor;border-right:3px solid currentColor;transform:translateX(-1px) rotate(45deg);border-radius:1px}.comment-send:active{transform:scale(.96);box-shadow:0 5px 12px rgba(124,58,237,.2)}.comment-send:disabled{opacity:.38;cursor:not-allowed}.comment-note{margin-top:8px;color:#8b95a1;font-size:12px;line-height:1.4}.comment-note a{color:var(--brand);font-weight:900}.reply-slot{margin:10px 0 0 46px}.reply-composer{--composer-avatar:none;display:flex;align-items:flex-start;gap:8px}.reply-box{flex:1;min-width:0}.reply-actions{margin-top:8px;display:flex;justify-content:flex-end;gap:8px}.reply-cancel,.reply-submit{height:32px;border:none;border-radius:999px;padding:0 12px;font-size:13px;font-weight:900;cursor:pointer}.reply-cancel{background:#f3f4f6;color:#4b5563}.reply-submit{background:#e5e7eb;color:#9ca3af}.reply-submit.ready{background:var(--brand);color:#fff}
    .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(12px);padding:10px 14px;border-radius:999px;background:rgba(17,24,39,.88);color:#fff;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:20}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .sheet-backdrop{position:fixed;inset:0;background:transparent;opacity:0;visibility:hidden;pointer-events:none;z-index:30}
    .sheet-backdrop.show{opacity:1;visibility:visible;pointer-events:auto}
    .action-sheet{position:fixed;top:56px;right:12px;width:168px;max-width:calc(100vw - 24px);visibility:hidden;opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transform-origin:top right;padding:6px;background:#fff;border:1px solid rgba(238,233,248,.95);border-radius:14px;box-shadow:0 14px 34px rgba(17,24,39,.18);transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s;z-index:31}
    .action-sheet.show{visibility:visible;opacity:1;pointer-events:auto;transform:translateY(0) scale(1);transition:opacity .16s ease,transform .16s ease}
    .sheet-btn{width:100%;height:42px;display:flex;align-items:center;justify-content:flex-start;border:none;border-radius:10px;background:transparent;color:#111827;padding:0 12px;font-size:14px;font-weight:900;text-align:left;cursor:pointer}
    .sheet-btn:hover,.sheet-btn:focus-visible{background:#f4f1fb;outline:none}
    .sheet-btn + .sheet-btn{margin-top:2px}
    .sheet-btn.edit{background:transparent;color:var(--brand)}
    .sheet-btn.delete{background:transparent;color:#dc2626}
    #closeSheetBtn{display:none}
    @media (min-width:768px){
      body{background:var(--page)}
      .app{max-width:1280px;display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr) minmax(320px,360px);margin:32px auto;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(17,24,39,.08)}
      .hero img{height:100%;min-height:540px}
      .topbtns{top:16px;left:16px;right:16px}
      .content{border-top:none;border-left:1px solid var(--line);padding:42px 38px}
      .comments-panel{border-top:none;border-left:1px solid var(--line);padding:24px 18px;overflow-y:auto;overflow-x:hidden}
      h1{font-size:26px;font-weight:600}
      .meta{font-size:13px;margin:10px 0 18px}
      .body{font-size:16px;line-height:1.5}
      .action-sheet{width:176px;max-width:176px;margin-bottom:0;border-radius:14px;box-shadow:0 14px 34px rgba(17,24,39,.18)}
    }
    @media (max-width:767px){.comments-panel{display:block;min-height:0;padding:12px 16px 12px}.comments-head{margin-bottom:6px}.comment-list{gap:14px;padding-bottom:8px}.comment-empty{padding:10px 0 8px;font-size:13px}.comment-composer{position:relative;bottom:auto;margin-top:8px;padding-top:8px;padding-bottom:0}.comment-note{display:none}}
  </style>
  <script src="assets/theme.js"></script>
</head>
<body>
  <div class="app">
    <section class="hero">
      <img id="img" alt="게시글 이미지">
      <div class="topbtns">
        <a class="icon-link" href="board.html" aria-label="뒤로가기"><span class="material-symbols-outlined" aria-hidden="true">arrow_back_ios_new</span></a>
        <div class="top-actions">
          <a class="icon-link" href="board.html" aria-label="홈"><span class="material-symbols-outlined" aria-hidden="true">home</span></a>
          <button class="icon-btn" id="shareBtn" type="button" aria-label="공유"><span class="material-symbols-outlined" aria-hidden="true">share</span></button>
          <button class="icon-btn" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="더보기"><span class="material-symbols-outlined" aria-hidden="true">more_vert</span></button>
        </div>
      </div>
    </section>
    <article class="content">
      <h1 id="title">로딩 중...</h1>
      <div class="meta" id="meta"></div>
      <div class="body" id="body"></div>
    </article>

    <aside class="comments-panel" id="commentsPanel" aria-label="댓글">
      <div class="comments-head">
        <div class="comments-title">댓글</div>
        <div class="comments-count" id="commentsCount">0</div>
      </div>
      <div class="comment-list" id="commentList"></div>
      <form class="comment-composer" id="commentForm">
        <textarea class="comment-input" id="commentInput" maxlength="500" rows="1" placeholder="댓글 올리기..." autocomplete="off"></textarea>
        <button class="comment-send" id="commentSend" type="submit" aria-label="댓글 등록"></button>
      </form>
      <div class="comment-note" id="commentNicknameNote"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="action-sheet" id="actionSheet" role="menu" aria-label="게시글 메뉴">
    <button class="sheet-btn edit" id="editBtn" type="button">편집하기</button>
    <button class="sheet-btn delete" id="deleteBtn" type="button">삭제하기</button>
    <button class="sheet-btn" id="closeSheetBtn" type="button">닫기</button>
  </div>

  <script src="assets/text-format.js"></script>
  <script src="assets/time-format.js"></script>
  <script src="assets/anonymous-identity.js?v=20260607"></script>
  <script>
    const BOARD_API = '/api/board-posts';
    const STORAGE_KEY = 'gaji_board_posts_v2';
    const LEGACY_STORAGE_KEY = 'gaji_board_posts_v1';
    const FALLBACK_IMAGE = 'assets/gaji-eggplant.jpg';
    const USER_CACHE_KEY = 'gaji_auth_user_cache_v1';
    const GUEST_KEY = 'gaji_guest_key_v1';
    const COMMENT_API = '/api/deals?action=comments';
    let currentPost = null;
    let currentUser = null;
    let currentComments = [];

    function normalizeBoardCategory(value){
      return ['tips', 'mydeals'].includes(String(value || '').trim()) ? String(value || '').trim() : 'tips';
    }

    function getBoardCategoryFromBody(body){
      return String(body || '').match(/^<!--gaji-category:(tips|mydeals)-->/)?.[1] || 'tips';
    }

    function stripBoardCategoryMarker(body){
      return String(body || '').replace(/^<!--gaji-category:(tips|mydeals)-->/, '').replace(/^\n+/, '');
    }

    function getCategoryLabel(category){
      return normalizeBoardCategory(category) === 'mydeals' ? '내가올린 핫딜' : '여러 가지 팁';
    }

    function normalizePosts(posts){
      return (posts || []).map((post, idx) => ({
        id: String(post.id || `local-${idx}`),
        title: post.title || '제목 없음',
        body: stripBoardCategoryMarker(post.body || ''),
        category: normalizeBoardCategory(post.category || getBoardCategoryFromBody(post.body)),
        img: post.img || '',
        author: post.author || '익명',
        views: Number(post.views || 0),
        createdAt: post.createdAt || post.created_at || new Date().toISOString(),
        updatedAt: post.updatedAt || post.updated_at || '',
      }));
    }

    function readLocalPosts(){
      try{ return normalizePosts(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }catch(_){ return []; }
    }

    function saveLocalPosts(posts){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalizePosts(posts)));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }

    function formatTime(value){
      return window.TimeFormat?.toRelativeKorean(value) || '';
    }

    function showToast(message){
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function renderRichText(text){
      if(window.TextFormat?.markdownToHtml){
        return window.TextFormat.markdownToHtml(text || '');
      }
      return String(text || '');
    }

    function renderPost(post){
      currentPost = post;
      document.getElementById('title').textContent = post.title || '제목 없음';
      document.getElementById('meta').textContent = `${getCategoryLabel(post.category)} · ${post.author || '익명'} · ${formatTime(post.createdAt)}`;
      document.getElementById('body').innerHTML = renderRichText(post.body || '');
      document.getElementById('img').src = post.img || FALLBACK_IMAGE;
    }

    async function loadPost(id){
      const cached = readLocalPosts().find(post => String(post.id) === String(id));
      if(cached){ renderPost(cached); loadComments(cached); }
      try{
        const res = await fetch(`${BOARD_API}/${encodeURIComponent(id)}`, { cache:'no-store' });
        if(res.status === 404){
          saveLocalPosts(readLocalPosts().filter(post => String(post.id) !== String(id)));
          const missing = { id, title:'게시글 없음', body:'게시글을 찾을 수 없습니다.', author:'', img:'', createdAt:'' };
          renderPost(missing);
          loadComments(missing);
          return;
        }
        if(!res.ok) throw new Error('not found');
        const data = await res.json();
        if(data.item){
          const post = normalizePosts([data.item])[0];
          renderPost(post);
          loadComments(post);
          saveLocalPosts([post, ...readLocalPosts().filter(v => String(v.id) !== String(post.id))]);
        }
      }catch(_){
        if(!cached){ const missing = { id, title:'게시글 없음', body:'게시글을 찾을 수 없습니다.', author:'', img:'', createdAt:'' }; renderPost(missing); loadComments(missing); }
      }
    }

    function positionActionMenu(){
      const button = document.getElementById('moreBtn');
      const menu = document.getElementById('actionSheet');
      const rect = button.getBoundingClientRect();
      const gap = 8;
      const margin = 8;
      const menuWidth = menu.offsetWidth || 168;
      const menuHeight = menu.offsetHeight || 132;
      const left = Math.max(margin, Math.min(rect.right - menuWidth, window.innerWidth - menuWidth - margin));
      const top = Math.max(margin, Math.min(rect.bottom + gap, window.innerHeight - menuHeight - margin));
      menu.style.left = `${left}px`;
      menu.style.right = 'auto';
      menu.style.top = `${top}px`;
    }

    function openSheet(){
      positionActionMenu();
      document.getElementById('sheetBackdrop').classList.add('show');
      document.getElementById('actionSheet').classList.add('show');
      document.getElementById('moreBtn').setAttribute('aria-expanded', 'true');
    }

    function closeSheet(){
      document.getElementById('sheetBackdrop').classList.remove('show');
      document.getElementById('actionSheet').classList.remove('show');
      document.getElementById('moreBtn').setAttribute('aria-expanded', 'false');
    }
    async function copyShareUrl(url){
      if(navigator.clipboard?.writeText){
        await navigator.clipboard.writeText(url);
        return;
      }
      const input = document.createElement('input');
      input.value = url;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();
    }

    function getCanonicalShareUrl(){
      return `https://gaji.run${location.pathname}${location.search || ''}`;
    }

    async function shareCurrentPost(){
      const title = currentPost?.title || document.title;
      const url = getCanonicalShareUrl();
      if(window.HotdealAndroid?.share){
        window.HotdealAndroid.share(title, url);
        return;
      }
      if(navigator.share){
        try{
          await navigator.share({ title, text:title, url });
          return;
        }catch(err){
          if(err?.name === 'AbortError') return;
        }
      }
      try{
        await copyShareUrl(url);
        showToast('링크가 복사되었습니다.');
      }catch(_){
        showToast('링크 복사에 실패했습니다.');
      }
    }

    function editCurrentPost(){
      if(!currentPost) return;
      closeSheet();
      location.href = `boardcreate.html?editId=${encodeURIComponent(currentPost.id)}`;
    }

    async function deleteCurrentPost(){
      if(!currentPost) return;
      try{
        const res = await fetch(`${BOARD_API}/${encodeURIComponent(currentPost.id)}`, { method:'DELETE' });
        if(!res.ok) throw new Error('delete failed');
        saveLocalPosts(readLocalPosts().filter(v => String(v.id) !== String(currentPost.id)));
        closeSheet();
        showToast('삭제되었습니다.');
        setTimeout(() => { location.href = 'board.html'; }, 450);
      }catch(_){
        showToast('삭제에 실패했습니다.');
      }
    }


    function getBoardCommentKey(post = currentPost){
      const id = String(post?.id || new URLSearchParams(location.search).get('id') || '').trim();
      return id ? `board:${id}` : '';
    }

    function getGuestKey(){
      let key = localStorage.getItem(GUEST_KEY);
      if(!key){
        key = window.GajiIdentity?.getDeviceId?.() || `guest-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
        localStorage.setItem(GUEST_KEY, key);
      }
      return key;
    }

    function getCurrentUserFromCache(){
      try{
        const cached = JSON.parse(localStorage.getItem(USER_CACHE_KEY) || 'null');
        return cached && typeof cached === 'object' ? cached : null;
      }catch(_){ return null; }
    }

    function getCommentNickname(){
      const identityUser = window.GajiIdentity?.getUser?.();
      if(identityUser?.nickname) return identityUser.nickname;
      const cachedUser = getCurrentUserFromCache();
      if(cachedUser?.nickname) return cachedUser.nickname;
      return window.GajiIdentity?.getNickname?.() || '익명 가지';
    }

    function normalizeComments(comments){
      const seen = new Set();
      return (comments || []).map((comment, idx) => ({
        id: String(comment.id || `local-${idx}`),
        dealKey: comment.dealKey || comment.deal_key || '',
        nickname: comment.nickname || '익명 가지',
        body: comment.body || comment.comment || '',
        createdAt: comment.createdAt || comment.created_at || new Date().toISOString(),
        guestKey: comment.guestKey || comment.guest_key || '',
        parentId: String(comment.parentId || comment.parent_id || '').trim()
      })).filter(comment => {
        if(!comment.body.trim()) return false;
        const key = `${comment.id}|${comment.dealKey}|${comment.parentId}|${comment.body}`;
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function isOwnComment(comment){
      const mine = getGuestKey();
      return Boolean(comment?.guestKey && mine && String(comment.guestKey) === String(mine));
    }

    function escapeHtml(text){
      return String(text || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function commentAvatarUrl(nickname){
      if(window.GajiIdentity?.getAvatarUrl) return window.GajiIdentity.getAvatarUrl(nickname);
      const name = String(nickname || '가지').trim() || '가지';
      let hash = 0;
      for(let i = 0; i < name.length; i += 1) hash = ((hash << 5) - hash + name.charCodeAt(i)) | 0;
      const colors = ['#4c1d95','#312e81','#164e63','#14532d','#7c2d12','#831843','#111827','#1f2937'];
      const bg = colors[Math.abs(hash) % colors.length];
      const initial = escapeHtml(name.replace(/\s+/g, ' ').split(' ').filter(Boolean).map(v => v.charAt(0)).slice(0,2).join('') || '가');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="${bg}"/><text x="48" y="50" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fff">${initial}</text></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function updateComposerAvatar(){
      const form = document.getElementById('commentForm');
      if(form) form.style.setProperty('--composer-avatar', `url("${commentAvatarUrl(getCommentNickname())}")`);
    }

    function formatCommentTime(value){
      return window.TimeFormat?.toRelativeKorean(value) || '';
    }

    function renderComments(comments = currentComments){
      const normalized = normalizeComments(comments).sort((a,b) => Date.parse(b.createdAt || '') - Date.parse(a.createdAt || ''));
      const list = document.getElementById('commentList');
      const count = document.getElementById('commentsCount');
      const note = document.getElementById('commentNicknameNote');
      if(count) count.textContent = normalized.length ? normalized.length.toLocaleString('ko-KR') : '0';
      if(note) note.innerHTML = `${escapeHtml(getCommentNickname())} 닉네임으로 댓글이 등록됩니다.<br>변경은 <a href="nickname.html">닉네임 설정</a>에서 가능합니다.`;
      updateComposerAvatar();
      if(!list) return;
      if(!normalized.length){
        list.innerHTML = '<div class="comment-empty">첫 댓글을 남겨보세요.</div>';
        return;
      }
      const byParent = new Map();
      normalized.forEach(comment => {
        const key = comment.parentId || '';
        if(!byParent.has(key)) byParent.set(key, []);
        byParent.get(key).push(comment);
      });
      const topLevel = (byParent.get('') || []).sort((a,b) => Date.parse(b.createdAt || '') - Date.parse(a.createdAt || ''));
      const renderOne = (comment, isReply = false) => {
        const avatar = escapeHtml(commentAvatarUrl(comment.nickname));
        const canDelete = isOwnComment(comment);
        const actions = [
          isReply ? '' : `<button class="reply-btn" type="button" data-reply-to="${escapeHtml(comment.id)}" data-reply-name="${escapeHtml(comment.nickname)}">답글</button>`,
          canDelete ? `<button class="comment-delete-btn" type="button" data-delete-comment="${escapeHtml(comment.id)}">삭제</button>` : ''
        ].filter(Boolean).join('');
        return `
          <article class="comment-item${isReply ? ' reply' : ''}" data-comment-id="${escapeHtml(comment.id)}">
            <div class="comment-avatar"><img src="${avatar}" alt="" aria-hidden="true"></div>
            <div class="comment-main">
              <div class="comment-meta"><span class="comment-name">${escapeHtml(comment.nickname)}</span><span>${escapeHtml(formatCommentTime(comment.createdAt))}</span></div>
              <div class="comment-body">${escapeHtml(comment.body)}</div>
              ${actions ? `<div class="comment-actions">${actions}</div>` : ''}
            </div>
          </article>
        `;
      };
      list.innerHTML = topLevel.map(comment => {
        const replies = (byParent.get(comment.id) || []).sort((a,b) => Date.parse(a.createdAt || '') - Date.parse(b.createdAt || ''));
        return `
          <section class="comment-thread${replies.length ? ' has-replies' : ''}">
            ${renderOne(comment)}
            ${replies.length ? `<div class="reply-list">${replies.map(reply => renderOne(reply, true)).join('')}</div>` : ''}
            <div class="reply-slot" id="replySlot-${escapeHtml(comment.id)}"></div>
          </section>
        `;
      }).join('');
      requestAnimationFrame(updateReplyConnectors);
    }

    function updateReplyConnectors(){
      document.querySelectorAll('.comment-thread.has-replies').forEach(thread => {
        const parentAvatar = thread.querySelector(':scope > .comment-item:not(.reply) .comment-avatar');
        const replyAvatars = thread.querySelectorAll('.comment-item.reply .comment-avatar');
        const lastReplyAvatar = replyAvatars[replyAvatars.length - 1];
        if(!parentAvatar || !lastReplyAvatar) return;
        const threadRect = thread.getBoundingClientRect();
        const parentRect = parentAvatar.getBoundingClientRect();
        const replyRect = lastReplyAvatar.getBoundingClientRect();
        const top = Math.max(0, parentRect.bottom - threadRect.top - 1);
        const end = replyRect.top + (replyRect.height / 2) - threadRect.top;
        const bottom = Math.max(0, threadRect.bottom - end);
        thread.style.setProperty('--thread-line-top', `${top}px`);
        thread.style.setProperty('--thread-line-bottom', `${bottom}px`);
      });
    }

    async function loadMe(){
      try{
        const res = await fetch(`/api/auth?action=me&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) return null;
        const data = await res.json();
        currentUser = data.user || null;
        if(currentUser) localStorage.setItem(USER_CACHE_KEY, JSON.stringify(currentUser));
        return currentUser;
      }catch(_){
        currentUser = window.GajiIdentity?.getUser?.() || null;
        return currentUser;
      }
    }

    async function loadComments(post = currentPost){
      currentComments = [];
      renderComments([]);
      const key = getBoardCommentKey(post);
      if(!key) return;
      try{
        const res = await fetch(`${COMMENT_API}&dealKey=${encodeURIComponent(key)}`, { cache:'no-store', credentials:'include' });
        if(!res.ok) throw new Error('comments failed');
        const data = await res.json();
        currentComments = normalizeComments(data.items || []);
        renderComments(currentComments);
      }catch(_){
        showToast('댓글을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
        currentComments = [];
        renderComments([]);
      }
    }

    async function postComment(body, parentId = ''){
      if(!currentPost || !body.trim()) return false;
      const comment = {
        dealKey:getBoardCommentKey(currentPost),
        nickname:getCommentNickname(),
        body:body.trim(),
        guestKey:getGuestKey(),
        parentId:String(parentId || '')
      };
      try{
        const res = await fetch(COMMENT_API, {
          method:'POST',
          credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(comment)
        });
        const data = await res.json().catch(() => ({}));
        if(!res.ok || !data.item) throw new Error(data.error || '댓글 저장 실패');
        currentComments = normalizeComments([data.item, ...currentComments]);
        renderComments(currentComments);
        return true;
      }catch(err){
        showToast(err.message || '댓글 저장에 실패했어요.');
        return false;
      }
    }

    async function deleteComment(commentId){
      const id = String(commentId || '').trim();
      if(!id || !currentPost) return;
      const mine = getGuestKey();
      const local = normalizeComments(currentComments);
      const target = local.find(comment => comment.id === id);
      if(!target || !isOwnComment(target)){
        showToast('내 댓글만 삭제할 수 있습니다.');
        return;
      }
      const removeIds = new Set([id]);
      local.forEach(comment => {
        if(comment.parentId === id && isOwnComment(comment)) removeIds.add(comment.id);
      });
      try{
        const res = await fetch(`${COMMENT_API}&id=${encodeURIComponent(id)}&dealKey=${encodeURIComponent(getBoardCommentKey(currentPost))}&guestKey=${encodeURIComponent(mine)}`, {
          method:'DELETE',
          cache:'no-store',
          credentials:'include'
        });
        if(!res.ok) throw new Error('delete failed');
        currentComments = local.filter(comment => !removeIds.has(comment.id));
        renderComments(currentComments);
        showToast('삭제되었습니다.');
      }catch(_){
        showToast('댓글 삭제에 실패했어요.');
      }
    }

    function autoResizeTextarea(el){
      if(!el) return;
      const maxHeight = 118;
      el.style.height = 'auto';
      const nextHeight = Math.min(el.scrollHeight, maxHeight);
      el.style.height = `${nextHeight}px`;
      el.classList.toggle('is-scrollable', el.scrollHeight > maxHeight + 1);
    }

    function bindCommentForm(){
      const form = document.getElementById('commentForm');
      const input = document.getElementById('commentInput');
      const list = document.getElementById('commentList');
      if(!form || !input) return;
      input.addEventListener('input', () => autoResizeTextarea(input));
      autoResizeTextarea(input);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if(!text) return;
        input.value = '';
        autoResizeTextarea(input);
        const ok = await postComment(text);
        if(!ok){ input.value = text; autoResizeTextarea(input); }
      });
      list?.addEventListener('click', (e) => {
        const deleteBtn = e.target.closest('.comment-delete-btn');
        if(deleteBtn){
          deleteComment(deleteBtn.dataset.deleteComment || '');
          return;
        }
        const btn = e.target.closest('.reply-btn');
        if(!btn) return;
        openReplyComposer(btn.dataset.replyTo || '', btn.dataset.replyName || '');
      });
    }

    function openReplyComposer(parentId, parentName){
      document.querySelectorAll('.reply-slot').forEach(slot => { slot.innerHTML = ''; });
      const slot = document.getElementById(`replySlot-${parentId}`);
      if(!slot) return;
      slot.innerHTML = `
        <form class="reply-composer" id="replyForm" style="--composer-avatar:url('${commentAvatarUrl(getCommentNickname())}')">
          <div class="reply-box">
            <textarea class="comment-input" id="replyInput" maxlength="500" rows="1" placeholder="${escapeHtml(parentName)}에게 답글 추가..." autocomplete="off"></textarea>
            <div class="reply-actions">
              <button class="reply-cancel" type="button">취소</button>
              <button class="reply-submit" type="submit" disabled>답글</button>
            </div>
          </div>
        </form>
      `;
      const form = slot.querySelector('form');
      const input = slot.querySelector('textarea');
      const submit = slot.querySelector('.reply-submit');
      slot.querySelector('.reply-cancel')?.addEventListener('click', () => { slot.innerHTML = ''; });
      input?.addEventListener('input', () => {
        autoResizeTextarea(input);
        const ready = Boolean(input.value.trim());
        submit.disabled = !ready;
        submit.classList.toggle('ready', ready);
      });
      autoResizeTextarea(input);
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if(!text) return;
        const ok = await postComment(text, parentId);
        if(ok) slot.innerHTML = '';
      });
      input?.focus();
    }

    function init(){
      const id = new URLSearchParams(location.search).get('id');
      if(!id){
        location.replace('board.html');
        return;
      }
      loadMe().then(() => renderComments(currentComments));
      bindCommentForm();
      loadPost(id);
    }

    document.getElementById('shareBtn').addEventListener('click', shareCurrentPost);
    document.getElementById('moreBtn').addEventListener('click', openSheet);
    document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);
    document.getElementById('closeSheetBtn').addEventListener('click', closeSheet);
    document.getElementById('editBtn').addEventListener('click', editCurrentPost);
    document.getElementById('deleteBtn').addEventListener('click', deleteCurrentPost);
    init();
  </script>
</body>
</html>
