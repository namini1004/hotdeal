<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="가지" />
  <title>관심 키워드</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    :root{--bg:#fff;--page:#f7f4ff;--text:#171325;--muted:#7c8594;--line:#eee9f8;--brand:#7c3aed;--brand-soft:#f3edff;--danger:#ef4444}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding:0 18px 48px;background:#fff}
    .top{height:56px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;margin:0 -18px 14px;padding:0 18px 0 0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
    .back{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;border:1px solid transparent;text-decoration:none;color:#111827;font-size:30px;font-weight:650;line-height:1;transform:translateY(-1px)}
    .back:active{background:#f4f6f8;border-color:#eee9f8}
    .title{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0}
    .sub{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.45}
    .panel{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
    .row{display:flex;gap:8px}
    input[type=text]{flex:1;height:44px;border:1px solid #ddd6fe;border-radius:12px;padding:0 12px;font-size:15px}
    button{height:44px;border:none;background:var(--brand);color:#fff;padding:0 14px;border-radius:12px;font-weight:800;cursor:pointer}
    .hint{margin-top:8px;color:var(--muted);font-size:12px}
    .status{display:none;margin-top:10px;padding:10px;border-radius:10px;background:var(--brand-soft);color:#4c1d95;font-size:13px;font-weight:700}
    .list{margin-top:14px;display:grid;gap:8px}
    .item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
    .term{font-size:15px;font-weight:700}
    .meta{font-size:12px;color:var(--muted)}
    .del{height:32px;background:#fff;border:1px solid #fecaca;color:var(--danger);padding:0 10px;border-radius:999px;font-weight:700}
    .empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 0}
    .push-panel{margin-top:12px}
    .push-panel[hidden]{display:none}
    .push-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .push-copy{min-width:0}
    .push-title{font-size:15px;font-weight:850;letter-spacing:-.02em}
    .push-state{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.38}
    .push-btn{flex:0 0 auto;min-width:74px}
    .push-btn[disabled]{background:#d1d5db;color:#fff;cursor:default}
  </style>
  <script src="assets/theme.js"></script>
</head>
<body>
  <main class="app">
    <div class="top">
      <a class="back" href="my-gaji.html" aria-label="뒤로가기">‹</a>
      <h1 class="title">관심 키워드</h1>
    </div>
    <p class="sub">등록한 키워드가 포함된 딜이 올라오면 푸시로 알려드려요.</p>

    <section class="panel">
      <div class="row">
        <input id="termInput" type="text" placeholder="예) 아이패드, 나이키" maxlength="20" />
        <button id="addBtn" type="button">추가</button>
      </div>
      <div class="hint">2~20자, 최대 20개까지 권장</div>
      <div class="status" id="statusBox"></div>
    </section>

    <section class="panel push-panel" id="webPushPanel" hidden>
      <div class="push-row">
        <div class="push-copy">
          <div class="push-title">브라우저 알림</div>
          <div class="push-state" id="webPushState">이 브라우저에서는 꺼져 있어요.</div>
        </div>
        <button class="push-btn" id="webPushBtn" type="button">켜기</button>
      </div>
    </section>

    <section class="list" id="keywordList"></section>
  </main>

  <script src="assets/anonymous-identity.js?v=20260607"></script>
  <script>
    const listEl = document.getElementById('keywordList');
    const inputEl = document.getElementById('termInput');
    const addBtn = document.getElementById('addBtn');
    const statusBox = document.getElementById('statusBox');
    const webPushPanel = document.getElementById('webPushPanel');
    const webPushBtn = document.getElementById('webPushBtn');
    const webPushState = document.getElementById('webPushState');
    const KEYWORD_CACHE_KEY = 'gaji_keyword_cache_v1';
    let cachedVapidPublicKey = '';

    function showStatus(msg){
      if(!msg){ statusBox.style.display='none'; return; }
      statusBox.textContent = msg;
      statusBox.style.display = 'block';
    }

    function escapeHtml(v){
      return String(v||'').replace(/[&<>'"]/g, (m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[m]));
    }

    function loadCachedKeywords(){
      try{
        const parsed = JSON.parse(localStorage.getItem(KEYWORD_CACHE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      }catch(_){ return []; }
    }

    function saveCachedKeywords(items){
      try{ localStorage.setItem(KEYWORD_CACHE_KEY, JSON.stringify(Array.isArray(items) ? items : [])); }catch(_){ }
    }

    function goGoogleLogin(){
      location.href = `/api/auth?action=start&provider=google&return_to=${encodeURIComponent('keywords.html')}`;
    }

    function canUseWebPush(){
      return Boolean(window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window);
    }

    function shouldTryAndroidBridge(){
      const ua = String(navigator.userAgent || '');
      return document.documentElement.classList.contains('app-webview') || /\bwv\)/i.test(ua) || /Gaji/i.test(ua);
    }

    function setWebPushStatus(message, buttonText = '켜기', disabled = false){
      if(webPushState) webPushState.textContent = message;
      if(webPushBtn){
        webPushBtn.textContent = buttonText;
        webPushBtn.disabled = disabled;
      }
    }

    function urlBase64ToUint8Array(base64String){
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for(let i = 0; i < rawData.length; i += 1) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    async function getServiceWorkerRegistration(){
      const registration = await navigator.serviceWorker.register('/service-worker.js');
      return navigator.serviceWorker.ready.then(() => registration);
    }

    async function fetchVapidPublicKey(){
      if(cachedVapidPublicKey) return cachedVapidPublicKey;
      const res = await fetch('/api/push/register-device?action=vapid-public-key', { credentials:'include', cache:'no-store' });
      const data = await res.json().catch(()=>({}));
      if(!res.ok || !data.enabled || !data.publicKey) throw new Error(data.error || 'web_push_not_configured');
      cachedVapidPublicKey = data.publicKey;
      return cachedVapidPublicKey;
    }

    async function getExistingWebPushSubscription(){
      if(!canUseWebPush()) return null;
      const registration = await getServiceWorkerRegistration();
      return registration.pushManager.getSubscription();
    }

    async function registerWebPushSubscription(subscription){
      const res = await fetch('/api/push/register-device', {
        method:'POST',
        credentials:'include',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          webPushSubscription: subscription.toJSON(),
          appVersion: 'pwa',
          userAgent: navigator.userAgent || '',
          enabled: true
        })
      });
      const data = await res.json().catch(()=>({}));
      if(res.status === 401){
        showStatus('브라우저 알림은 Google 로그인이 필요합니다.');
        setTimeout(goGoogleLogin, 700);
        return false;
      }
      if(!res.ok) throw new Error(data.error || 'web_push_register_failed');
      return true;
    }

    async function refreshWebPushPanel(data){
      if(!webPushPanel) return;
      if(!canUseWebPush()){
        webPushPanel.hidden = true;
        return;
      }

      webPushPanel.hidden = false;
      if(Notification.permission === 'denied'){
        setWebPushStatus('브라우저 설정에서 알림이 차단되어 있어요.', '차단됨', true);
        return;
      }

      try{
        const subscription = await getExistingWebPushSubscription();
        if(subscription){
          setWebPushStatus('이 브라우저 알림 사용중', '갱신', false);
          if(data && data.hasEnabledToken === false) {
            await registerWebPushSubscription(subscription).catch(()=>false);
          }
          return;
        }
        setWebPushStatus('이 브라우저에서는 꺼져 있어요.', '켜기', false);
      }catch(_){
        setWebPushStatus('브라우저 알림 상태를 확인하지 못했어요.', '다시', false);
      }
    }

    async function enableWebPush(){
      if(!canUseWebPush()){
        showStatus('이 브라우저는 PWA 푸시 알림을 지원하지 않아요.');
        return;
      }

      try{
        setWebPushStatus('알림 권한을 확인하고 있어요.', '확인중', true);
        const permission = Notification.permission === 'granted'
          ? 'granted'
          : await Notification.requestPermission();

        if(permission !== 'granted'){
          setWebPushStatus('알림 권한이 꺼져 있어요.', '켜기', false);
          showStatus('알림 권한을 허용해야 브라우저 알림을 받을 수 있어요.');
          return;
        }

        if(!await ensureGoogleLogin()) return;

        const publicKey = await fetchVapidPublicKey();
        const registration = await getServiceWorkerRegistration();
        let subscription = await registration.pushManager.getSubscription();
        if(!subscription){
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey)
          });
        }

        await registerWebPushSubscription(subscription);
        setWebPushStatus('이 브라우저 알림 사용중', '갱신', false);
        showStatus('브라우저 알림을 켰어요.');
        await loadKeywords();
      }catch(error){
        const message = String(error?.message || '');
        if(message.includes('Web Push is not configured') || message.includes('web_push_not_configured')){
          showStatus('서버의 PWA 알림 키 설정이 아직 필요합니다.');
        }else{
          showStatus('브라우저 알림 등록에 실패했어요. 다시 시도해주세요.');
        }
        setWebPushStatus('이 브라우저에서는 꺼져 있어요.', '켜기', false);
      }
    }

    async function ensureGoogleLogin(){
      try{
        const res = await fetch(`/api/auth?action=me&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(res.ok){
          const data = await res.json();
          const user = data.user || null;
          if(user && !user.anonymous && user.provider === 'google') return true;
        }
      }catch(_){ }
      showStatus('관심 키워드 알림은 Google 로그인 후 사용할 수 있어요. 잠시 후 로그인으로 이동합니다.');
      render([]);
      setTimeout(goGoogleLogin, 700);
      return false;
    }

    function render(items){
      if(!Array.isArray(items) || items.length===0){
        listEl.innerHTML = '<div class="empty">등록된 키워드가 없어요.</div>';
        return;
      }
      listEl.innerHTML = items.map(item => `
        <article class="item">
          <div>
            <div class="term">${escapeHtml(item.term || item.termNormalized || '')}</div>
            <div class="meta">알림 사용중</div>
          </div>
          <button class="del" type="button" data-id="${item.id}">삭제</button>
        </article>
      `).join('');

      document.querySelectorAll('.del').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          if(!id) return;
          try{
            const res = await fetch(`/api/push/keywords?id=${encodeURIComponent(id)}`, { method:'DELETE', credentials:'include' });
            if(!res.ok) throw new Error('delete');
            const nextItems = loadCachedKeywords().filter(item => String(item.id) !== String(id));
            saveCachedKeywords(nextItems);
            render(nextItems);
            showStatus('키워드를 삭제했어요.');
            await loadKeywords();
          }catch(_){
            showStatus('삭제에 실패했어요. 다시 시도해주세요.');
          }
        });
      });
    }

    async function ensurePushTokenIfMissingFromKeywordsResponse(data){
      try {
        if (data && data.hasEnabledToken === false) {
          if (canUseWebPush()) {
            showStatus('이 브라우저에서도 알림을 켤 수 있어요.');
            return;
          }
          if (shouldTryAndroidBridge()) {
            showStatus('푸시 토큰이 없어 앱에서 재등록을 시도합니다.');
            window.location.href = 'gaji://push/sync';
            return;
          }
          showStatus('현재 브라우저에서는 푸시 알림을 지원하지 않아요.');
        }
      } catch (_) {
        // ignore
      }
    }

    async function loadKeywords(){
      render(loadCachedKeywords());
      if(!await ensureGoogleLogin()) return;
      const res = await fetch('/api/push/keywords', { credentials:'include', cache:'no-store' });
      if(res.status===401){
        showStatus('관심 키워드 알림은 Google 로그인이 필요합니다.');
        render([]);
        setTimeout(goGoogleLogin, 700);
        return;
      }
      if(!res.ok){
        showStatus('키워드를 불러오지 못했습니다.');
        return;
      }
      const data = await res.json();
      await refreshWebPushPanel(data);
      await ensurePushTokenIfMissingFromKeywordsResponse(data);
      saveCachedKeywords(data.items || []);
      render(data.items || []);
    }

    addBtn.addEventListener('click', async () => {
      const term = (inputEl.value || '').trim();
      if(term.length < 2 || term.length > 20){
        showStatus('키워드는 2~20자로 입력해주세요.');
        return;
      }
      try{
        const res = await fetch('/api/push/keywords', {
          method:'POST',
          credentials:'include',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ term, enabled:true })
        });
        if(res.status===401){
          showStatus('관심 키워드 알림은 Google 로그인이 필요합니다.');
          setTimeout(goGoogleLogin, 700);
          return;
        }
        if(!res.ok){
          const data = await res.json().catch(()=>({}));
          showStatus(data.error || '등록에 실패했어요.');
          return;
        }
        inputEl.value = '';
        showStatus('키워드를 등록했어요.');
        await loadKeywords();
      }catch(_){
        showStatus('네트워크 오류가 발생했어요.');
      }
    });

    webPushBtn?.addEventListener('click', enableWebPush);

    (async () => {
      if(canUseWebPush()) refreshWebPushPanel().catch(()=>undefined);
      loadKeywords();
    })();
  </script>
</body>
</html>
