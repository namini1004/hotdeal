<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오늘의 핫딜 등록</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@500');
    :root{--line:#eee9f8;--muted:#8b95a1;--bg:#f8f5ff;--brand:#7c3aed;--page:#f7f4ff}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#111827;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:500;font-style:normal;font-size:32px;line-height:1;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:96px}

    .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
    .title{font-size:19px;font-weight:800;letter-spacing:-.02em}
    .top-spacer{width:48px;height:48px}
    .back{width:48px;height:48px;display:grid;place-items:center;border-radius:999px;color:#111;text-decoration:none}
    .back:active{background:#f4f6f8}

    .wrap{padding:14px 16px}
    .photo{border:1px solid #e3e7ec;border-radius:12px;width:96px;height:96px;display:grid;place-items:center;color:#7c3aed;font-size:13px;font-weight:700;margin-bottom:16px;background:var(--bg);cursor:pointer;overflow:hidden;text-align:center}
    .photo .material-symbols-outlined{font-size:28px}
    .photo-text{display:grid;gap:4px;place-items:center}
    .photo-preview{width:100%;height:100%;object-fit:cover;display:none}
    .photo.has-image{border-color:#d8c7ff;background:#fff}
    .photo.has-image .photo-text{display:none}
    .photo.has-image .photo-preview{display:block}
    .file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .field{border-top:1px solid var(--line);padding:14px 0}
    .field:first-of-type{border-top:none;padding-top:0}
    label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
    input,textarea,select{width:100%;border:none;outline:none;font:inherit;font-size:16px;color:#111;background:#fff}
    textarea{min-height:120px;line-height:1.6;resize:none}
    .hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}

    .row{display:flex;gap:8px}
    .chip{padding:10px 14px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:14px;font-weight:600;color:#4b5563;cursor:pointer}
    .chip.active{background:#f3edff;color:#5b21b6;border-color:#d8c7ff}

    .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:#fff;border-top:1px solid var(--line)}
    .submit{width:100%;height:50px;border:none;border-radius:14px;background:var(--brand);color:#fff;font-size:17px;font-weight:800}

    @media (min-width:768px){
      body{background:var(--page)}
      .app{max-width:720px;min-height:auto;margin:32px auto 110px;padding-bottom:0;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(17,24,39,.08)}
      .top{position:static;padding:16px 20px}
      .title{font-size:21px}
      .back{width:52px;height:52px}
      .top-spacer{width:52px;height:52px}
      .back .material-symbols-outlined{font-size:34px}
      .wrap{padding:22px 24px}
      .photo{width:112px;height:112px}
      .field{padding:18px 0}
      input,textarea,select{font-size:17px}
      textarea{min-height:160px}
      .bottom{max-width:720px;padding:16px 18px;box-shadow:0 -12px 30px rgba(17,24,39,.06)}
      .submit{height:54px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="back" href="index.html" aria-label="뒤로가기"><span class="material-symbols-outlined" aria-hidden="true">arrow_back_ios_new</span></a>
      <div class="title" id="pageTitle">오늘의 핫딜 작성</div>
      <div class="top-spacer" aria-hidden="true"></div>
    </header>

    <form class="wrap" id="form">
      <button class="photo" id="photoButton" type="button">
        <span class="photo-text"><span class="material-symbols-outlined" aria-hidden="true">add_photo_alternate</span><span>사진 첨부</span></span>
        <img class="photo-preview" id="photoPreview" alt="첨부한 사진 미리보기">
      </button>
      <input class="file-input" id="photoInput" type="file" accept="image/*" />

      <div class="field">
        <label for="title">제목</label>
        <input id="title" maxlength="60" placeholder="제목을 입력해주세요." required />
      </div>

      <div class="field">
        <label for="desc">자세한 설명</label>
        <textarea id="desc" placeholder="상품 상태, 구성품, 거래 조건 등을 자세히 적어주세요."></textarea>
        <div class="hint">서로 믿고 거래할 수 있도록 자세히 적어주세요.<br>허위 과장 정보는 제한될 수 있습니다.</div>
      </div>

      <div class="field">
        <label>카테고리</label>
        <div class="row" id="catRow">
          <button type="button" class="chip active" data-cat="디지털">디지털</button>
          <button type="button" class="chip" data-cat="생활가전">생활가전</button>
          <button type="button" class="chip" data-cat="주방">주방</button>
          <button type="button" class="chip" data-cat="패션">패션</button>
        </div>
      </div>

      <div class="field">
        <label for="price">가격</label>
        <input id="price" inputmode="numeric" placeholder="가격을 입력해주세요. (비워두면 0원)" />
      </div>

      <div class="field">
        <label for="dealUrl">핫딜주소</label>
        <input id="dealUrl" inputmode="url" placeholder="https://..." />
      </div>

    </form>
  </div>

  <div class="bottom">
    <button class="submit" form="form" type="submit">작성 완료</button>
  </div>

  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const LEGACY_STORAGE_KEY = 'hotdeal_items_v2';
    const DEALS_API = '/api/deals';
    let selectedCategory = '디지털';
    let selectedImage = '';
    let sharedImage = '';
    let editItem = null;

    document.getElementById('catRow').addEventListener('click',(e)=>{
      const btn = e.target.closest('.chip');
      if(!btn) return;
      document.querySelectorAll('.chip').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = btn.dataset.cat;
    });

    function formatPrice(value){
      const num = Number(String(value).replace(/[^0-9]/g,''));
      if(!num) return '0원';
      return num.toLocaleString('ko-KR') + '원';
    }

    function normalizeItems(items){
      return (items || []).map((item, idx) => ({
        id: String(item.id ?? idx + 1),
        title: item.title || '',
        area: item.area || '오늘의 핫딜',
        dist: item.dist || '기타',
        time: item.time || item.date || '',
        price: item.price || '0원',
        category: item.category || '디지털',
        desc: item.desc ?? '',
        img: item.img || '',
        sourceLink: item.sourceLink || '',
        buyLink: item.buyLink || '',
        views: Number(item.views || 0),
        comments: Number(item.comments || 0),
        date: item.date || '',
        registeredAt: item.registeredAt || '',
        source: item.source || '',
        edited: Boolean(item.edited)
      }));
    }

    function readStoredItems(key){
      try{
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return normalizeItems(Array.isArray(parsed) ? parsed : parsed.items || parsed.today || parsed.grouped?.today || []);
      }catch(_){
        return [];
      }
    }

    function saveItems(items){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }

    function isHttpUrl(value){
      return /^https?:\/\/\S+/i.test(value || '');
    }

    function getDealKey(item){
      if(item?.sourceLink) return item.sourceLink;
      if(item?.id) return `id:${item.id}:${item.date || ''}`;
      return `title:${item?.title || ''}:${item?.date || ''}`;
    }

    function dedupeItems(items){
      const seen = new Set();
      return (items || []).filter(item => {
        const key = getDealKey(item);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function extractPriceText(text){
      const match = String(text || '').match(/(\d{1,3}(?:,\d{3})+|\d+)\s*원/);
      return match ? match[1].replace(/,/g, '') : '';
    }

    function setPhotoPreview(src){
      if(!src) return;
      sharedImage = src;
      document.getElementById('photoPreview').src = src;
      document.getElementById('photoButton').classList.add('has-image');
    }

    function prefillSharedHotdeal(data){
      if(!data) return;
      const title = document.getElementById('title');
      const desc = document.getElementById('desc');
      const price = document.getElementById('price');
      const dealUrl = document.getElementById('dealUrl');
      if(data.url && !dealUrl.value) dealUrl.value = data.url;
      if(data.title && !title.value) title.value = data.title;
      const description = data.desc || data.description || '';
      if(description && !desc.value) desc.value = description;
      const priceText = data.price || extractPriceText(`${data.title || ''} ${description}`);
      if(priceText && !price.value) price.value = priceText;
      if(data.image && !selectedImage) setPhotoPreview(data.image);
    }

    window.prefillSharedHotdeal = prefillSharedHotdeal;

    const photoInput = document.getElementById('photoInput');
    const photoButton = document.getElementById('photoButton');

    photoButton.addEventListener('click', () => {
      photoInput.click();
    });

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if(!file) return;
      if(!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => {
        selectedImage = String(reader.result || '');
        sharedImage = '';
        document.getElementById('photoPreview').src = selectedImage;
        document.getElementById('photoButton').classList.add('has-image');
      };
      reader.readAsDataURL(file);
    });

    prefillSharedHotdeal({
      url: new URLSearchParams(location.search).get('sharedUrl') || '',
      title: new URLSearchParams(location.search).get('sharedTitle') || '',
      image: new URLSearchParams(location.search).get('sharedImage') || '',
      desc: new URLSearchParams(location.search).get('sharedDesc') || '',
      price: new URLSearchParams(location.search).get('sharedPrice') || ''
    });

    function setActiveCategory(category){
      const target = [...document.querySelectorAll('.chip')].find(btn => btn.dataset.cat === category) || document.querySelector('.chip');
      if(!target) return;
      document.querySelectorAll('.chip').forEach(v=>v.classList.remove('active'));
      target.classList.add('active');
      selectedCategory = target.dataset.cat;
    }

    function fillForm(item){
      editItem = item;
      document.getElementById('pageTitle').textContent = '핫딜 편집';
      document.querySelector('.submit').textContent = '수정 완료';
      document.getElementById('title').value = item.title || '';
      document.getElementById('desc').value = item.desc || '';
      document.getElementById('price').value = String(item.price || '').replace(/[^0-9]/g, '');
      document.getElementById('dealUrl').value = item.buyLink || item.sourceLink || '';
      setActiveCategory(item.category || '디지털');
      if(item.img) setPhotoPreview(item.img);
    }

    async function loadEditItem(){
      const editId = new URLSearchParams(location.search).get('editId');
      if(!editId) return;
      let item = null;
      try{
        const res = await fetch(`${DEALS_API}/${encodeURIComponent(editId)}`, { cache: 'no-store' });
        if(res.ok){
          const data = await res.json();
          item = data.item || null;
        }
      }catch(_){ }

      if(!item){
        const localItems = [...readStoredItems(STORAGE_KEY), ...readStoredItems(LEGACY_STORAGE_KEY)];
        item = localItems.find(v => String(v.id) === String(editId));
      }
      if(item) fillForm(item);
    }

    document.getElementById('form').addEventListener('submit', (e)=>{
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const price = formatPrice(document.getElementById('price').value);
      const dealUrl = document.getElementById('dealUrl').value.trim();
      const img = selectedImage || sharedImage || editItem?.img || 'https://images.unsplash.com/photo-1560393464-5c69a73c5770?auto=format&fit=crop&w=1200&q=80';
      if(!title) return;
      if(dealUrl && !isHttpUrl(dealUrl)){
        alert('핫딜주소는 http 또는 https로 시작해야 합니다.');
        return;
      }

      const now = new Date();
      const newItem = {
        ...(editItem || {}),
        id: editItem?.id || `local-${Date.now()}`,
        title,
        area: editItem?.area || '오늘의 핫딜',
        dist: editItem ? (editItem.dist || '수정됨') : '방금 등록',
        time: editItem ? (editItem.time || '수정됨') : '방금 전',
        price,
        likes: editItem?.likes || 0,
        views: editItem?.views || 0,
        comments: editItem?.comments || 0,
        category:selectedCategory,
        desc,
        img,
        buyLink:dealUrl,
        sourceLink:dealUrl || editItem?.sourceLink || '',
        source:'user',
        edited: Boolean(editItem) || undefined,
        date: editItem?.date || now.toISOString().slice(0, 10),
        registeredAt: editItem?.registeredAt || now.toISOString(),
        updatedAt: now.toISOString()
      };

      const method = editItem ? 'PATCH' : 'POST';
      const targetUrl = editItem ? `${DEALS_API}/${encodeURIComponent(editItem.id)}` : DEALS_API;
      fetch(targetUrl, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newItem)
      })
      .then(async (res) => {
        if(!res.ok) throw new Error('save failed');
        const data = await res.json();
        const savedId = data?.item?.id || newItem.id;
        location.href = editItem ? `detail.html?id=${encodeURIComponent(savedId)}` : 'index.html?posted=1';
      })
      .catch(() => {
        const items = [...readStoredItems(STORAGE_KEY), ...readStoredItems(LEGACY_STORAGE_KEY)];
        const nextItems = [newItem, ...items.filter(item => String(item.id) !== String(newItem.id) && getDealKey(item) !== getDealKey(newItem))];
        saveItems(dedupeItems(nextItems));
        location.href = editItem ? `detail.html?id=${encodeURIComponent(newItem.id)}` : 'index.html?posted=1';
      });
    });

    loadEditItem();
  </script>
</body>
</html>
