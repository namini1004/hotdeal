<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오늘의 핫딜 등록</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@500');
    :root{--line:#eee9f8;--muted:#8b95a1;--bg:#f8f5ff;--brand:#7c3aed;--page:#f7f4ff}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#111827;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:500;font-style:normal;font-size:32px;line-height:1;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:96px}

    .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
    .title{font-size:19px;font-weight:800;letter-spacing:-.02em}
    .top-spacer{width:48px;height:48px}
    .back{width:48px;height:48px;display:grid;place-items:center;border-radius:999px;color:#111;text-decoration:none}
    .back:active{background:#f4f6f8}

    .wrap{padding:14px 16px}
    .photo{border:1px solid #e3e7ec;border-radius:12px;width:96px;height:96px;display:grid;place-items:center;color:#7c3aed;font-size:13px;font-weight:700;margin-bottom:16px;background:var(--bg);cursor:pointer;overflow:hidden;text-align:center}
    .photo .material-symbols-outlined{font-size:28px}
    .photo-text{display:grid;gap:4px;place-items:center}
    .photo-preview{width:100%;height:100%;object-fit:cover;display:none}
    .photo.has-image{border-color:#d8c7ff;background:#fff}
    .photo.has-image .photo-text{display:none}
    .photo.has-image .photo-preview{display:block}
    .file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .field{border-top:1px solid var(--line);padding:14px 0}
    .field:first-of-type{border-top:none;padding-top:0}
    label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
    input,textarea,select{width:100%;border:none;outline:none;font:inherit;font-size:16px;color:#111;background:#fff}
    textarea{min-height:120px;line-height:1.6;resize:none}
    .hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}

    .row{display:flex;gap:8px}
    .chip{padding:10px 14px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:14px;font-weight:600;color:#4b5563;cursor:pointer}
    .chip.active{background:#f3edff;color:#5b21b6;border-color:#d8c7ff}

    .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:#fff;border-top:1px solid var(--line)}
    .submit{width:100%;height:50px;border:none;border-radius:14px;background:var(--brand);color:#fff;font-size:17px;font-weight:800}

    @media (min-width:768px){
      body{background:var(--page)}
      .app{max-width:720px;min-height:auto;margin:32px auto 110px;padding-bottom:0;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(17,24,39,.08)}
      .top{position:static;padding:16px 20px}
      .title{font-size:21px}
      .back{width:52px;height:52px}
      .top-spacer{width:52px;height:52px}
      .back .material-symbols-outlined{font-size:34px}
      .wrap{padding:22px 24px}
      .photo{width:112px;height:112px}
      .field{padding:18px 0}
      input,textarea,select{font-size:17px}
      textarea{min-height:160px}
      .bottom{max-width:720px;padding:16px 18px;box-shadow:0 -12px 30px rgba(17,24,39,.06)}
      .submit{height:54px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="back" href="index.html" aria-label="뒤로가기"><span class="material-symbols-outlined" aria-hidden="true">arrow_back_ios_new</span></a>
      <div class="title">오늘의 핫딜 작성</div>
      <div class="top-spacer" aria-hidden="true"></div>
    </header>

    <form class="wrap" id="form">
      <label class="photo" id="photoButton" for="photoInput">
        <span class="photo-text"><span class="material-symbols-outlined" aria-hidden="true">add_photo_alternate</span><span>사진 첨부</span></span>
        <img class="photo-preview" id="photoPreview" alt="첨부한 사진 미리보기">
      </label>
      <input class="file-input" id="photoInput" type="file" accept="image/*" />

      <div class="field">
        <label for="title">제목</label>
        <input id="title" maxlength="60" placeholder="제목을 입력해주세요." required />
      </div>

      <div class="field">
        <label for="desc">자세한 설명</label>
        <textarea id="desc" placeholder="상품 상태, 구성품, 거래 조건 등을 자세히 적어주세요." required></textarea>
        <div class="hint">서로 믿고 거래할 수 있도록 자세히 적어주세요.<br>허위 과장 정보는 제한될 수 있습니다.</div>
      </div>

      <div class="field">
        <label>카테고리</label>
        <div class="row" id="catRow">
          <button type="button" class="chip active" data-cat="디지털">디지털</button>
          <button type="button" class="chip" data-cat="생활가전">생활가전</button>
          <button type="button" class="chip" data-cat="주방">주방</button>
          <button type="button" class="chip" data-cat="패션">패션</button>
        </div>
      </div>

      <div class="field">
        <label for="price">가격</label>
        <input id="price" inputmode="numeric" placeholder="가격을 입력해주세요. (숫자만)" required />
      </div>

      <div class="field">
        <label for="img">이미지 URL</label>
        <input id="img" placeholder="https://... (비워두면 기본 이미지 사용)" />
      </div>
    </form>
  </div>

  <div class="bottom">
    <button class="submit" form="form" type="submit">작성 완료</button>
  </div>

  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const LEGACY_STORAGE_KEY = 'hotdeal_items_v2';
    let selectedCategory = '디지털';
    let selectedImage = '';

    document.getElementById('catRow').addEventListener('click',(e)=>{
      const btn = e.target.closest('.chip');
      if(!btn) return;
      document.querySelectorAll('.chip').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = btn.dataset.cat;
    });

    function formatPrice(value){
      const num = Number(String(value).replace(/[^0-9]/g,''));
      if(!num) return '';
      return num.toLocaleString('ko-KR') + '원';
    }

    function readStoredItems(key){
      try{
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(parsed) ? parsed : parsed.items || parsed.today || parsed.grouped?.today || [];
      }catch(_){
        return [];
      }
    }

    function saveItems(items){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }

    document.getElementById('photoInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if(!file) return;
      if(!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => {
        selectedImage = String(reader.result || '');
        document.getElementById('photoPreview').src = selectedImage;
        document.getElementById('photoButton').classList.add('has-image');
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('form').addEventListener('submit', (e)=>{
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const price = formatPrice(document.getElementById('price').value);
      const img = selectedImage || document.getElementById('img').value.trim() || 'https://images.unsplash.com/photo-1560393464-5c69a73c5770?auto=format&fit=crop&w=1200&q=80';
      if(!title || !desc || !price) return;

      const items = [...readStoredItems(STORAGE_KEY), ...readStoredItems(LEGACY_STORAGE_KEY)];
      const now = new Date();
      const newItem = {
        id: `local-${Date.now()}`,
        title,
        area:'오늘의 핫딜',
        dist:'방금 등록',
        time:'방금 전',
        price,
        likes:0,
        views:0,
        comments:0,
        category:selectedCategory,
        desc,
        img,
        source:'user',
        date: now.toISOString().slice(0, 10),
        registeredAt: now.toISOString()
      };
      items.unshift(newItem);
      saveItems(items);
      location.href = 'index.html?posted=1';
    });
  </script>
</body>
</html>
