<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오늘의 핫딜</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    :root{--bg:#fff;--text:#111827;--muted:#8b95a1;--line:#eef1f4;--chip:#f4f6f8;--chip-active:#1f2937;--brand:#ff6f0f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:24px}
    .top{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
    .row{display:flex;align-items:center;justify-content:space-between}
    .title-app{font-size:28px;font-weight:800;letter-spacing:-.03em}
    .icon-btn{border:none;background:transparent;color:#6b7280;font-size:20px;cursor:pointer}

    .search-wrap{display:none;margin-top:10px}
    .search-wrap.show{display:block}
    .search-input{width:100%;height:42px;border:1px solid #d9dde3;border-radius:10px;padding:0 12px;font-size:14px}

    .chips{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;-ms-overflow-style:none;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:700;white-space:nowrap;color:#4b5563;border:none}
    .chip.active{background:var(--chip-active);color:#fff}

    .list{padding:0 16px}
    .item{display:grid;grid-template-columns:98px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
    .thumb{width:98px;height:98px;border-radius:12px;object-fit:cover;background:#f3f4f6}
    .item-title{font-size:17px;font-weight:600;line-height:1.35;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .meta{margin-top:5px;color:var(--muted);font-size:13px}
    .price{margin-top:8px;font-size:18px;font-weight:800;letter-spacing:-.02em}
    .empty{padding:40px 8px;color:#6b7280;font-size:14px}

    .fab{position:fixed;right:calc(50% - 196px);bottom:24px;border:none;background:var(--brand);color:#fff;border-radius:999px;padding:12px 18px;font-size:16px;font-weight:700;box-shadow:0 8px 20px rgba(255,111,15,.34);cursor:pointer}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="row">
        <div class="title-app">오늘의 핫딜</div>
        <button class="icon-btn" id="searchToggle" aria-label="검색">⌕</button>
      </div>
      <div class="search-wrap" id="searchWrap">
        <input class="search-input" id="searchInput" type="text" placeholder="오늘/어제 상품 제목 검색" />
      </div>
      <div class="chips">
        <button class="chip active" data-tab="today">오늘의 핫딜</button>
        <button class="chip" data-tab="yesterday">어제의 핫딜</button>
      </div>
    </header>
    <main class="list" id="list"></main>
  </div>

  <button class="fab" id="writeBtn">+ 글쓰기</button>

  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const FEED_PATH = 'assets/ppomppu_hotdeals_2days.json';
    let state = { tab: 'today', grouped: { today: [], yesterday: [] }, keyword: '' };

    function normalizeItems(items){
      return (items || []).map((item, idx) => ({
        id: String(item.id ?? idx + 1),
        title: item.title || '제목 없음',
        area: item.area || '뽐뿌 핫딜',
        dist: item.dist || '기타',
        time: item.time || item.date || '',
        price: item.price || '가격 정보 확인',
        category: item.category || '기타',
        desc: item.desc || '',
        img: item.img || '',
        sourceLink: item.sourceLink || '',
        buyLink: item.buyLink || '',
        date: item.date || ''
      }));
    }

    function getFilteredItems(){
      const tabItems = state.grouped[state.tab] || [];
      const kw = state.keyword.trim().toLowerCase();
      if(!kw) return tabItems;
      return tabItems.filter(i => (i.title || '').toLowerCase().includes(kw));
    }

    function render(){
      const list = document.getElementById('list');
      const items = getFilteredItems();
      if(!items.length){
        list.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
      }
      list.innerHTML = items.map(item => `
        <a class="item" href="detail.html?id=${encodeURIComponent(item.id)}&tab=${state.tab}">
          <img class="thumb" src="${item.img}" alt="${item.title}">
          <div>
            <div class="item-title">${item.title}</div>
            <div class="meta">${item.area} · ${item.dist} · ${item.time}</div>
            <div class="price">${item.price}</div>
          </div>
        </a>
      `).join('');
    }

    function bindTabs(){
      document.querySelectorAll('[data-tab]').forEach(el => {
        el.addEventListener('click', () => {
          state.tab = el.dataset.tab;
          document.querySelectorAll('[data-tab]').forEach(c => c.classList.remove('active'));
          el.classList.add('active');
          render();
        });
      });
    }

    function bindSearch(){
      const wrap = document.getElementById('searchWrap');
      const input = document.getElementById('searchInput');
      document.getElementById('searchToggle').addEventListener('click', () => {
        wrap.classList.toggle('show');
        if(wrap.classList.contains('show')) input.focus();
      });
      input.addEventListener('input', (e) => {
        state.keyword = e.target.value || '';
        render();
      });
    }

    async function init(){
      try{
        const res = await fetch(FEED_PATH, { cache: 'no-store' });
        if(res.ok){
          const data = await res.json();
          const grouped = {
            today: normalizeItems(data.grouped?.today || []),
            yesterday: normalizeItems(data.grouped?.yesterday || [])
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(grouped));
          state.grouped = grouped;
        }
      }catch(_){ }

      if(!state.grouped.today.length && !state.grouped.yesterday.length){
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          try{ state.grouped = JSON.parse(raw); }catch(_){ }
        }
      }

      bindTabs();
      bindSearch();
      render();
    }

    document.getElementById('writeBtn').addEventListener('click',()=>location.href='create.html');
    init();
  </script>
</body>
</html>
