<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오늘의 핫딜</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@500');
    :root{--bg:#fff;--page:#f7f4ff;--text:#171325;--muted:#8b95a1;--line:#eee9f8;--chip:#f3edff;--chip-active:#5b21b6;--brand:#7c3aed;--brand-rgb:124,58,237}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:500;font-style:normal;font-size:32px;line-height:1;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:24px}
    .top{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5;transition:transform .24s ease,opacity .2s ease,box-shadow .2s ease}
    .top.is-hidden{transform:translateY(calc(-100% - 12px));opacity:0;pointer-events:none}
    .row{display:flex;align-items:center;justify-content:space-between}
    .top-actions{display:flex;align-items:center;gap:4px}
    .title-app{display:flex;align-items:baseline;font-size:24px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
    .brand-word{color:var(--brand);font-weight:950;letter-spacing:-.09em}
    .title-rest{color:var(--text);font-weight:800;letter-spacing:-.04em;margin-left:1px}
    .icon-btn{width:48px;height:48px;display:grid;place-items:center;border:none;border-radius:999px;background:transparent;color:#374151;line-height:1;cursor:pointer;text-decoration:none}
    .icon-btn:active{background:#f4f6f8}

    .search-wrap{display:none;margin-top:10px}
    .search-wrap.show{display:block}
    .search-input{width:100%;height:42px;border:1px solid #d9dde3;border-radius:10px;padding:0 12px;font-size:14px}

    .chips{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;-ms-overflow-style:none;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:700;white-space:nowrap;color:#4b5563;border:none}
    .chip.active{background:var(--chip-active);color:#fff}

    .pull-refresh{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:height .18s ease;will-change:height}
    .pull-refresh.show{height:86px}
    .gaji-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#5b21b6;opacity:0;transform:translateY(-8px);transition:opacity .18s ease,transform .18s ease}
    .pull-refresh.show .gaji-loader{opacity:1;transform:translateY(0)}
    .gaji-spinner{width:48px;height:48px;border-radius:999px;background:#f3edff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(var(--brand-rgb),.18)}
    .gaji-spinner .gaji-icon{width:30px;height:30px;display:block;object-fit:contain;animation:gaji-spin 1s linear infinite}
    .gaji-label{font-size:12px;font-weight:800;letter-spacing:-.01em}

    @keyframes gaji-spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    .list{padding:0 16px}
    .item{display:grid;grid-template-columns:98px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
    .item.viewed{background:#f8fafc}
    .thumb-wrap{position:relative}
    .thumb{width:98px;height:98px;border-radius:12px;object-fit:cover;background:#f3f4f6}
    .fav-badge{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:999px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#ef4444;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .item-title{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .meta{margin-top:5px;color:var(--muted);font-size:13px}
    .stats-row{margin-top:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
    .stats{color:#6b7280;font-size:13px;font-weight:600}
    .temperature{font-size:12px;font-weight:800;color:#ef4444;white-space:nowrap}
    .price{margin-top:8px;font-size:16px;font-weight:800;letter-spacing:-.02em}
    .empty{padding:40px 8px;color:#6b7280;font-size:14px}
    .sync-stamp{grid-column:1/-1;padding:8px 0 0;margin:0;color:#9ca3af;font-size:10px;line-height:1.35;text-align:left;letter-spacing:-.01em}

    .fab{position:fixed;right:max(16px,calc((100vw - 430px) / 2 + 16px));bottom:16px;min-width:108px;height:52px;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:var(--brand);color:#fff;border-radius:999px;padding:0 18px;font-size:16px;font-weight:700;box-shadow:0 10px 24px rgba(var(--brand-rgb),.34);cursor:pointer;transition:width .2s ease,min-width .2s ease,height .2s ease,padding .2s ease,border-radius .2s ease,box-shadow .2s ease,transform .2s ease}
    .fab-plus{font-size:22px;line-height:1;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
    .fab-text{white-space:nowrap;transition:opacity .15s ease;font-size:16px;font-weight:700;letter-spacing:-.01em}
    .fab.is-compact{width:56px;min-width:56px;height:56px;padding:0;border-radius:50%;box-shadow:0 10px 24px rgba(var(--brand-rgb),.38);display:flex;align-items:center;justify-content:center;gap:0}
    .fab.is-compact .fab-plus{font-size:30px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;margin:0;transform:none}
    .fab.is-compact .fab-text{display:none}
    .sort-sheet-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.36);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s linear .2s;z-index:40}
    .sort-sheet-backdrop.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s ease}
    .sort-sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(calc(100% + 48px));padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -18px 44px rgba(17,24,39,.18);transition:transform .22s ease,visibility 0s linear .22s;z-index:41}
    .sort-sheet.show{visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);transition:transform .22s ease}
    .sheet-btn{width:100%;height:52px;border:none;border-radius:12px;background:#f4f6f8;color:#111827;font-size:16px;font-weight:800;cursor:pointer}
    .sheet-btn + .sheet-btn{margin-top:8px}
    .sheet-btn.active{background:#ede9fe;color:#5b21b6}

    @media (min-width:768px){
      body{background:var(--page)}
      .app{max-width:1120px;padding:0 28px 48px}
      .top{top:16px;margin:16px 0 18px;padding:18px 20px 14px;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(17,24,39,.06)}
      .title-app{font-size:28px}
      .icon-btn{width:52px;height:52px;background:#f4f6f8}
      .icon-btn .material-symbols-outlined{font-size:34px}
      .search-wrap{display:block;max-width:520px}
      .search-input{height:46px;background:#fafafa}
      .chips{padding-top:14px}
      .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0}
      .item{grid-template-columns:132px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(17,24,39,.04);transition:transform .15s ease,box-shadow .15s ease}
      .item:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(17,24,39,.08)}
      .thumb{width:132px;height:132px;border-radius:14px}
      .item-title{font-size:16px;-webkit-line-clamp:3}
      .meta{font-size:14px}
      .stats{font-size:14px}
      .price{font-size:18px}
      .empty{grid-column:1/-1;padding:72px 16px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px}
      .top.is-hidden{transform:translateY(calc(-100% - 28px))}
      .fab{right:max(28px,calc((100vw - 1120px) / 2 + 28px));bottom:16px;min-width:116px;height:56px;padding:0 20px}
    }

    @media (min-width:1180px){
      .list{grid-template-columns:repeat(3,minmax(0,1fr))}
      .item{grid-template-columns:118px 1fr}
      .thumb{width:118px;height:118px}
      .fab{right:max(28px,calc((100vw - 1120px) / 2 + 28px))}
    }

    @media (max-width:767px){
      .search-wrap.show{display:block}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="row">
        <div class="title-app"><span class="brand-word">가지</span><span class="title-rest">고 싶다</span></div>
        <div class="top-actions">
          <button class="icon-btn" id="sortToggle" aria-label="정렬">
            <span id="sortIconWrap" aria-hidden="true"></span>
          </button>
          <button class="icon-btn" id="searchToggle" aria-label="검색"><span class="material-symbols-outlined" aria-hidden="true">search</span></button>
        </div>
      </div>
      <div class="search-wrap" id="searchWrap">
        <input class="search-input" id="searchInput" type="text" placeholder="최근 48시간 핫딜 검색" />
      </div>
      <div class="chips" id="tabs">
        <button class="chip active" type="button" data-tab="today">뽐딜</button>
        <button class="chip" type="button" data-tab="quasar">퀘딜</button>
        <button class="chip" type="button" data-tab="fmkorea">펨딜</button>
        <button class="chip" type="button" data-tab="ruliweb">루딜</button>
        <button class="chip" type="button" data-tab="namin">남딜</button>
      </div>
    </header>
    <div class="pull-refresh" id="pullRefresh" aria-live="polite">
      <div class="gaji-loader" id="gajiLoader">
        <div class="gaji-spinner"><img class="gaji-icon" src="assets/gaji-eggplant-transparent.png" alt="" aria-hidden="true"></div>
        <div class="gaji-label" id="gajiLabel">당겨서 새로고침</div>
      </div>
    </div>
    <main class="list" id="list"></main>
  </div>

  <button class="fab" id="writeBtn" aria-label="글쓰기"><span class="fab-plus" aria-hidden="true">+</span><span class="fab-text">글쓰기</span></button>
  <div class="sort-sheet-backdrop" id="sortSheetBackdrop"></div>
  <div class="sort-sheet" id="sortSheet" role="dialog" aria-modal="true" aria-label="정렬 선택">
    <button class="sheet-btn" id="sortLatestBtn" type="button">최신순</button>
    <button class="sheet-btn" id="sortTempBtn" type="button">가지온도순</button>
    <button class="sheet-btn" id="sortCloseBtn" type="button">닫기</button>
  </div>

  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const LEGACY_STORAGE_KEY = 'hotdeal_items_v2';
    const DELETED_KEY = 'hotdeal_deleted_keys_v1';
    const READ_KEY = 'hotdeal_read_keys_v1';
    const DEALS_API = '/api/deals';
    const LAST_TAB_KEY = 'hotdeal_last_tab_v1';
    const LAST_SORT_KEY = 'hotdeal_sort_mode_v1';
    const USER_CACHE_KEY = 'gaji_auth_user_cache_v1';
    let state = { allItems: [], feedItems: [], ppomppuItems: [], quasarItems: [], fmkoreaItems: [], ruliwebItems: [], userItems: [], keyword: '', activeTab: 'today', sortMode: 'latest', feedEtag: '', userEtag: '', lastUserSyncAt: '', lastFeedSyncAt: '' };
    let isRefreshing = false;

    function normalizeItems(items){
      return (items || []).map((item, idx) => ({
        id: String(item.id ?? idx + 1),
        title: item.title || '제목 없음',
        area: item.area || '뽐뿌 핫딜',
        dist: item.dist || '기타',
        time: item.time || item.date || '',
        price: item.price || '가격 정보 확인',
        category: item.category || '기타',
        desc: item.desc || '',
        img: item.img || '',
        sourceLink: item.sourceLink || '',
        buyLink: item.buyLink || '',
        views: Number(item.views || 0),
        comments: Number(item.comments || 0),
        date: item.date || '',
        registeredAt: item.registeredAt || '',
        source: item.source || '',
        temperature: Number(item.temperature ?? 0),
        hotScore: Number(item.hotScore ?? 0),
        edited: Boolean(item.edited)
      }));
    }

    function parseStoredItems(key){
      try{
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return normalizeItems(Array.isArray(parsed) ? parsed : parsed.items || parsed.today || parsed.grouped?.today || []);
      }catch(_){
        return [];
      }
    }


    function dedupeItems(items){
      const seen = new Set();
      return (items || []).filter(item => {
        const key = getDealKey(item);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function saveItems(items){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }

    function getDealKey(item){
      if(item?.sourceLink) return item.sourceLink;
      if(item?.id) return `id:${item.id}:${item.date || ''}`;
      return `title:${item?.title || ''}:${item?.date || ''}`;
    }

    function getDeletedKeys(){
      try{
        return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'));
      }catch(_){
        return new Set();
      }
    }

    function filterDeleted(items){
      const deleted = getDeletedKeys();
      return (items || []).filter(item => !deleted.has(getDealKey(item)));
    }

    function getReadKeys(){
      try{ return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); }catch(_){ return new Set(); }
    }

    function markAsRead(item){
      const key = getDealKey(item);
      if(!key) return;
      const keys = getReadKeys();
      keys.add(key);
      localStorage.setItem(READ_KEY, JSON.stringify([...keys]));
    }

    function getCurrentUserId(){
      try{
        const user = JSON.parse(localStorage.getItem(USER_CACHE_KEY) || 'null');
        return user?.id || user?.email || 'guest';
      }catch(_){ return 'guest'; }
    }

    function getFavoriteStorageKey(){
      return `hotdeal_favorites_${getCurrentUserId()}`;
    }

    function getFavoriteKeys(){
      try{ return new Set(JSON.parse(localStorage.getItem(getFavoriteStorageKey()) || '[]')); }catch(_){ return new Set(); }
    }

    function isFavorited(item){
      return getFavoriteKeys().has(getDealKey(item));
    }

    function formatCount(value){
      const num = Number(value || 0);
      return num.toLocaleString('ko-KR');
    }

    function formatSyncTime(iso){
      if(!iso) return '';
      const d = new Date(iso);
      if(Number.isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일 ${pad(d.getHours())}시 ${pad(d.getMinutes())}분 ${pad(d.getSeconds())}초`;
    }

    function renderSyncStamp(){
      const text = formatSyncTime(state.lastFeedSyncAt);
      if(!text) return '';
      return `<div class="sync-stamp">🍆 서버 동기화 ${text}</div>`;
    }

    function applyItems(items){
      const cleaned = filterDeleted(dedupeItems(items));
      state.allItems = cleaned;
      state.feedItems = cleaned.filter(item => item.source !== 'user');
      state.ppomppuItems = state.feedItems.filter(item => item.source === 'ppomppu' || (!item.source || item.source === 'feed'));
      state.quasarItems = state.feedItems.filter(item => item.source === 'quasar' || item.area === '퀘이사딜');
      state.fmkoreaItems = state.feedItems.filter(item => item.source === 'fmkorea' || item.area === '펨딜');
      state.ruliwebItems = state.feedItems.filter(item => item.source === 'ruliweb' || item.area === '루딜');
      state.userItems = cleaned.filter(item => item.source === 'user');
      saveItems(cleaned);
    }

    function getCurrentTabItems(){
      if(state.activeTab === 'namin') return state.userItems;
      if(state.activeTab === 'quasar') return state.quasarItems;
      if(state.activeTab === 'fmkorea') return state.fmkoreaItems;
      if(state.activeTab === 'ruliweb') return state.ruliwebItems;
      return state.ppomppuItems;
    }

    function getFilteredItems(){
      const baseItems = [...getCurrentTabItems()];
      const kw = state.keyword.trim().toLowerCase();
      const filtered = !kw ? baseItems : baseItems.filter(i => (i.title || '').toLowerCase().includes(kw));
      return filtered.sort((a, b) => {
        const da = Date.parse(a.registeredAt || a.date || '') || 0;
        const db = Date.parse(b.registeredAt || b.date || '') || 0;
        const ta = Number(a.temperature || 0);
        const tb = Number(b.temperature || 0);
        if(state.sortMode === 'temperature'){
          if(tb !== ta) return tb - ta;
          return db - da;
        }
        if(db !== da) return db - da;
        return tb - ta;
      });
    }

    const FALLBACK_IMAGE = 'assets/gaji-eggplant.jpg';

    function optimizeImageUrl(src){
      const raw = String(src || '').trim();
      if(!raw) return FALLBACK_IMAGE;
      return raw;
    }

    function hexToRgb(hex){
      const v = String(hex || '').replace('#','');
      const n = parseInt(v, 16);
      return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
    }

    function mixColor(c1, c2, t){
      const clamped = Math.max(0, Math.min(1, Number(t || 0)));
      const a = hexToRgb(c1); const b = hexToRgb(c2);
      const r = Math.round(a.r + (b.r - a.r) * clamped);
      const g = Math.round(a.g + (b.g - a.g) * clamped);
      const b2 = Math.round(a.b + (b.b - a.b) * clamped);
      return `rgb(${r}, ${g}, ${b2})`;
    }

    function temperatureColor(value){
      const t = Math.max(0, Math.min(100, Number(value || 0)));
      if(t <= 50) return mixColor('#9ca3af', '#3b82f6', t / 50);       // 회색 -> 파랑
      return mixColor('#3b82f6', '#4c1d95', (t - 50) / 50);            // 파랑 -> 진한보라
    }

    function render(){
      const list = document.getElementById('list');
      const items = getFilteredItems();
      if(!items.length){
        list.innerHTML = state.activeTab === 'namin'
          ? '<div class="empty">남딜이 아직 없습니다.</div>'
          : state.activeTab === 'quasar'
            ? '<div class="empty">퀘딜이 아직 없습니다.</div>'
            : state.activeTab === 'fmkorea'
              ? '<div class="empty">펨딜이 아직 없습니다.</div>'
              : state.activeTab === 'ruliweb'
                ? '<div class="empty">루딜이 아직 없습니다.</div>'
                : '<div class="empty">뽐딜이 아직 없습니다.</div>';
        list.insertAdjacentHTML('beforeend', renderSyncStamp());
        return;
      }
      const readKeys = getReadKeys();
      list.innerHTML = items.map(item => {
        const dealKey = getDealKey(item);
        const viewedClass = readKeys.has(dealKey) ? 'viewed' : '';
        const favBadge = isFavorited(item) ? '<span class="fav-badge" aria-label="찜됨">♥</span>' : '';
        return `
        <a class="item ${viewedClass}" data-key="${dealKey}" href="indexdetail.html?id=${encodeURIComponent(item.id)}">
          <div class="thumb-wrap">
            <img class="thumb" src="${optimizeImageUrl(item.img)}" alt="${item.title}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'">
            ${favBadge}
          </div>
          <div>
            <div class="item-title">${item.title}</div>
            <div class="meta">${item.area} · ${item.dist} · ${item.time}</div>
            <div class="stats-row">
              <div class="stats">조회 ${formatCount(item.views)} · 댓글 ${formatCount(item.comments)}</div>
              <div class="temperature" style="color:${temperatureColor(item.temperature)}">${Math.max(0, Math.min(100, Number(item.temperature || 0)))}°C</div>
            </div>
            <div class="price">${item.price}</div>
          </div>
        </a>
      `;
      }).join('') + renderSyncStamp();
    }

    function setActiveTabUI(){
      const tabs = document.getElementById('tabs');
      tabs.querySelectorAll('.chip').forEach(chip => chip.classList.toggle('active', chip.dataset.tab === state.activeTab));
    }

    function restoreLastTab(){
      const allowed = new Set(['today','quasar','fmkorea','ruliweb','namin']);
      const saved = localStorage.getItem(LAST_TAB_KEY);
      if(saved && allowed.has(saved)) state.activeTab = saved;
      setActiveTabUI();
    }

    function persistLastTab(){
      localStorage.setItem(LAST_TAB_KEY, state.activeTab || 'today');
    }

    function restoreLastSort(){
      const saved = localStorage.getItem(LAST_SORT_KEY);
      if(saved === 'latest' || saved === 'temperature'){
        state.sortMode = saved;
      }
    }

    function persistLastSort(){
      localStorage.setItem(LAST_SORT_KEY, state.sortMode || 'latest');
    }

    function bindTabs(){
      const tabs = document.getElementById('tabs');
      tabs.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip[data-tab]');
        if(!btn) return;
        state.activeTab = btn.dataset.tab;
        persistLastTab();
        setActiveTabUI();
        render();
      });
    }

    function bindSearch(){
      const wrap = document.getElementById('searchWrap');
      const input = document.getElementById('searchInput');
      document.getElementById('searchToggle').addEventListener('click', () => {
        wrap.classList.toggle('show');
        if(wrap.classList.contains('show')) input.focus();
      });
      input.addEventListener('input', (e) => {
        state.keyword = e.target.value || '';
        render();
      });
    }

    function renderSortIcon(){
      const glyph = state.sortMode === 'temperature' ? 'device_thermostat' : 'schedule';
      document.getElementById('sortIconWrap').innerHTML = `<span class="material-symbols-outlined" aria-hidden="true">${glyph}</span>`;
    }

    function openSortSheet(){
      document.getElementById('sortSheetBackdrop').classList.add('show');
      document.getElementById('sortSheet').classList.add('show');
      document.getElementById('sortLatestBtn').classList.toggle('active', state.sortMode === 'latest');
      document.getElementById('sortTempBtn').classList.toggle('active', state.sortMode === 'temperature');
    }

    function closeSortSheet(){
      document.getElementById('sortSheetBackdrop').classList.remove('show');
      document.getElementById('sortSheet').classList.remove('show');
    }

    function bindSortSheet(){
      document.getElementById('sortToggle').addEventListener('click', openSortSheet);
      document.getElementById('sortSheetBackdrop').addEventListener('click', closeSortSheet);
      document.getElementById('sortCloseBtn').addEventListener('click', closeSortSheet);
      document.getElementById('sortLatestBtn').addEventListener('click', () => {
        state.sortMode = 'latest';
        persistLastSort();
        renderSortIcon();
        render();
        closeSortSheet();
      });
      document.getElementById('sortTempBtn').addEventListener('click', () => {
        state.sortMode = 'temperature';
        persistLastSort();
        renderSortIcon();
        render();
        closeSortSheet();
      });
      renderSortIcon();
    }

    function bindReadTracking(){
      const list = document.getElementById('list');
      list.addEventListener('click', (e) => {
        const a = e.target.closest('a.item');
        if(!a) return;
        const idParam = new URL(a.href, location.href).searchParams.get('id');
        const item = state.allItems.find(v => String(v.id) === String(idParam));
        if(item) markAsRead(item);
      });
    }

    function bindScrollChrome(){
      const top = document.querySelector('.top');
      const fab = document.getElementById('writeBtn');
      let lastY = window.scrollY;
      let ticking = false;

      function setCompact(compact){
        top.classList.toggle('is-hidden', compact);
        fab.classList.toggle('is-compact', compact);
      }

      function update(){
        const currentY = window.scrollY;
        const diff = currentY - lastY;
        if(currentY < 24){
          setCompact(false);
        }else if(diff > 8 && currentY > 80){
          setCompact(true);
        }else if(diff < -8){
          setCompact(false);
        }
        lastY = currentY;
        ticking = false;
      }

      window.addEventListener('scroll', () => {
        if(ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      }, { passive:true });
    }

    function makeFeedFingerprint(items){
      return (items || [])
        .map((item) => [
          item.sourceLink || item.id || '',
          item.views || 0,
          item.comments || 0,
          item.temperature || 0,
          item.img || '',
          item.registeredAt || item.date || ''
        ].join('|'))
        .sort()
        .join('~');
    }

    async function refreshFeed({ silent = false } = {}){
      if(isRefreshing) return;
      isRefreshing = true;
      const wrap = document.getElementById('pullRefresh');
      const label = document.getElementById('gajiLabel');
      try{
        if(!silent){
          wrap.classList.add('show');
          wrap.style.height = '86px';
          label.textContent = '가지 로딩중...';
        }
        const headers = state.feedEtag ? { 'If-None-Match': state.feedEtag } : {};
        const sinceQuery = state.lastFeedSyncAt ? `&since=${encodeURIComponent(state.lastFeedSyncAt)}` : '';
        const res = await fetch(`${DEALS_API}?scope=feed${sinceQuery}`, { cache: 'no-store', headers });
        if(res.status === 304) return;
        if(res.ok){
          state.feedEtag = res.headers.get('etag') || state.feedEtag;
          const data = await res.json();
          const incoming = normalizeItems(data.items || []);
          const prevFingerprint = makeFeedFingerprint(getCurrentTabItems());

          if(data.delta && state.feedItems.length){
            const byKey = new Map(state.feedItems.map((item) => [getDealKey(item), item]));
            incoming.forEach((item) => byKey.set(getDealKey(item), item));
            state.feedItems = [...byKey.values()];
          }else{
            state.feedItems = incoming;
          }

          applyItems([...state.userItems, ...state.feedItems]);
          state.lastFeedSyncAt = data.serverTime || new Date().toISOString();
          const nextFingerprint = makeFeedFingerprint(getCurrentTabItems());
          if(prevFingerprint !== nextFingerprint){
            render();
          }
        }
      }catch(_){
      }finally{
        if(!silent){
          label.textContent = '당겨서 새로고침';
          setTimeout(() => {
            wrap.style.height = '0px';
            wrap.classList.remove('show');
          }, 220);
        }
        isRefreshing = false;
      }
    }

    async function refreshNaminDealsBackground(){
      try{
        const headers = state.userEtag ? { 'If-None-Match': state.userEtag } : {};
        const sinceQuery = state.lastUserSyncAt ? `&since=${encodeURIComponent(state.lastUserSyncAt)}` : '';
        const res = await fetch(`${DEALS_API}?scope=user${sinceQuery}`, { cache: 'no-store', headers });
        if(res.status === 304) return;
        if(!res.ok) return;

        state.userEtag = res.headers.get('etag') || state.userEtag;
        const data = await res.json();
        const incoming = normalizeItems(data.items || []).filter(item => item.source === 'user');

        if(data.delta && state.userItems.length){
          const byId = new Map(state.userItems.map(item => [String(item.id), item]));
          incoming.forEach(item => byId.set(String(item.id), item));
          state.userItems = [...byId.values()];
        }else{
          state.userItems = incoming;
        }

        state.lastUserSyncAt = data.serverTime || new Date().toISOString();
        applyItems([...state.feedItems, ...state.userItems]);
        if(state.activeTab === 'namin') render();
      }catch(_){
      }
    }

    function bindPullToRefresh(){
      const wrap = document.getElementById('pullRefresh');
      const label = document.getElementById('gajiLabel');
      let pulling = false;
      let startY = 0;
      let pullDistance = 0;
      const threshold = 74;

      function setPullHeight(px){
        const height = Math.max(0, Math.min(98, px));
        wrap.style.height = `${height}px`;
        if(height > 8) wrap.classList.add('show');
        else wrap.classList.remove('show');
      }

      window.addEventListener('touchstart', (e) => {
        if(window.scrollY > 0 || isRefreshing) return;
        pulling = true;
        startY = e.touches[0].clientY;
        pullDistance = 0;
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if(!pulling) return;
        const currentY = e.touches[0].clientY;
        const delta = currentY - startY;
        if(delta <= 0){
          setPullHeight(0);
          label.textContent = '당겨서 새로고침';
          return;
        }
        pullDistance = delta * 0.52;
        setPullHeight(pullDistance);
        label.textContent = pullDistance >= threshold ? '놓으면 새로고침' : '당겨서 새로고침';
      }, { passive: true });

      window.addEventListener('touchend', async () => {
        if(!pulling) return;
        pulling = false;
        if(pullDistance >= threshold){
          setPullHeight(86);
          wrap.classList.add('show');
          await refreshFeed();
        }else{
          setPullHeight(0);
          label.textContent = '당겨서 새로고침';
        }
        pullDistance = 0;
      }, { passive: true });
    }

    function bindAutoSync(){
      const intervalMs = 30000;
      setInterval(() => {
        if(document.visibilityState !== 'visible') return;
        refreshFeed({ silent: true });
        refreshNaminDealsBackground();
      }, intervalMs);

      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState !== 'visible') return;
        refreshFeed({ silent: true });
        refreshNaminDealsBackground();
      });

      window.addEventListener('focus', () => {
        refreshFeed({ silent: true });
        refreshNaminDealsBackground();
      });
    }

    async function init(){
      restoreLastTab();
      restoreLastSort();
      const cached = filterDeleted(dedupeItems([...parseStoredItems(STORAGE_KEY), ...parseStoredItems(LEGACY_STORAGE_KEY)]));
      applyItems(cached);
      render();

      await refreshFeed({ silent: true });
      refreshNaminDealsBackground();

      bindTabs();
      bindSearch();
      bindSortSheet();
      bindReadTracking();
      bindScrollChrome();
      bindPullToRefresh();
      bindAutoSync();
      render();
    }

    async function ensureLoggedInForWrite(){
      try{
        const res = await fetch(`/api/auth?action=me&_ts=${Date.now()}`, { credentials: 'include', cache: 'no-store' });
        if(res.ok){
          const data = await res.json();
          if(data?.user) return true;
        }
      }catch(_){ }

      if(window.HotdealAndroid?.requireLogin){
        window.HotdealAndroid.requireLogin();
      }else{
        showLoginToast();
        setTimeout(() => { location.href = 'my-gaji.html'; }, 650);
      }
      return false;
    }

    function showLoginToast(){
      let toast = document.getElementById('loginToast');
      if(!toast){
        toast = document.createElement('div');
        toast.id = 'loginToast';
        toast.setAttribute('role', 'status');
        toast.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(12px);z-index:9999;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:999px;background:rgba(23,19,37,.92);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.01em;box-shadow:0 10px 26px rgba(17,24,39,.22);opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none;white-space:nowrap';
        document.body.appendChild(toast);
      }
      toast.textContent = '로그인을 해주세요';
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
      });
      clearTimeout(window.__loginToastTimer);
      window.__loginToastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(12px)';
      }, 1800);
    }

    document.getElementById('writeBtn').addEventListener('click', async () => {
      const ok = await ensureLoggedInForWrite();
      if(!ok) return;
      location.href='indexcreate.html';
    });
    init();
  </script>
