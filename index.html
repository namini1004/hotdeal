  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    :root{--bg:#fff;--page:#f7f4ff;--text:#171325;--muted:#8b95a1;--line:#eee9f8;--chip:#f3edff;--chip-active:#5b21b6;--brand:#7c3aed;--brand-rgb:124,58,237}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:24px}
    .top{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5;transition:transform .24s ease,opacity .2s ease,box-shadow .2s ease}
    .top.is-hidden{transform:translateY(calc(-100% - 12px));opacity:0;pointer-events:none}
    .row{display:flex;align-items:center;justify-content:space-between}
    .top-actions{display:flex;align-items:center;gap:1px}
    .app-webview .web-tabs{display:none!important}
    .web-toolbar{display:none}
    .web-tabs{display:none;align-items:center;gap:6px}
    .web-tab{height:38px;display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:999px;color:#667085;text-decoration:none;font-size:13px;font-weight:850;letter-spacing:-.01em}
    .web-tab.active{background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(var(--brand-rgb),.2)}
    .web-tab-eggplant{width:17px;height:17px;display:block}
    .mobile-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:12px;padding:4px;border:1px solid var(--line);border-radius:16px;background:#f8f5ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
    .mobile-tab{height:38px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;color:#697386;text-decoration:none;font-size:13px;font-weight:900;letter-spacing:-.01em;transition:background .18s ease,color .18s ease,box-shadow .18s ease}
    .mobile-tab.active{background:#fff;color:var(--brand);box-shadow:0 8px 18px rgba(var(--brand-rgb),.14)}
    .mobile-tab.active::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--brand);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.12)}
    .view-toggle{display:none;align-items:center;gap:4px;flex:0 0 auto;padding:4px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:0 8px 20px rgba(42,25,82,.05)}
    .view-btn{width:34px;height:32px;display:grid;place-items:center;border:none;border-radius:999px;background:transparent;color:#8b95a1;cursor:pointer}
    .view-btn.active{background:#171325;color:#fff;box-shadow:0 8px 18px rgba(17,19,37,.16)}
    .view-icon{width:18px;height:18px;display:block;fill:currentColor}
    .title-app{display:flex;align-items:baseline;font-size:24px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
    .brand-word{color:var(--brand);font-weight:950;letter-spacing:-.09em}
    .title-rest{color:var(--text);font-weight:800;letter-spacing:-.04em;margin-left:1px}
    .icon-btn{width:34px;height:34px;display:grid;place-items:center;border:none;border-radius:999px;background:transparent;color:#374151;line-height:1;cursor:pointer;text-decoration:none}
    .top-icon{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .icon-btn:active{background:#f4f6f8}
    .profile-chip{height:34px;max-width:128px;display:flex;align-items:center;gap:7px;border:none;border-radius:999px;background:#f7f4ff;color:#2d2438;padding:0 9px 0 4px;cursor:pointer}
    .profile-avatar{width:26px;height:26px;border-radius:999px;display:block;object-fit:cover;flex:0 0 auto}.profile-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900;letter-spacing:-.02em}
    .nick-modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.38);display:none;place-items:center;z-index:80;padding:18px}.nick-modal-backdrop.show{display:grid}.nick-modal{width:min(320px,100%);background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 18px 60px rgba(17,24,39,.24);text-align:center}.nick-modal-title{font-size:17px;font-weight:950;letter-spacing:-.03em}.nick-modal-body{margin-top:8px;color:#667085;font-size:14px;line-height:1.45}.nick-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.nick-modal-btn{height:44px;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer}.nick-modal-btn.cancel{background:#f4f6f8;color:#374151}.nick-modal-btn.confirm{background:var(--brand);color:#fff}

    .search-wrap{display:none;margin-top:10px}
    .search-wrap.show{display:block}
    .search-input{width:100%;height:42px;border:1px solid #d9dde3;border-radius:10px;padding:0 12px;font-size:14px}

    .feed-controls{display:flex;align-items:center;gap:10px;padding:12px 0 2px}
    .chips{display:flex;gap:8px;overflow:auto;min-width:0;flex:1;-ms-overflow-style:none;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:700;white-space:nowrap;color:#4b5563;border:none}
    .chip.active{background:var(--chip-active);color:#fff}

    .pull-refresh{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:height .18s ease;will-change:height}
    .pull-refresh.show{height:86px}
    .gaji-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#5b21b6;opacity:0;transform:translateY(-8px);transition:opacity .18s ease,transform .18s ease}
    .pull-refresh.show .gaji-loader{opacity:1;transform:translateY(0)}
    .gaji-spinner{width:48px;height:48px;border-radius:999px;background:#f3edff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(var(--brand-rgb),.18)}
    .gaji-spinner .gaji-icon{width:30px;height:30px;display:block;object-fit:contain;animation:gaji-spin 1s linear infinite}
    .gaji-label{font-size:12px;font-weight:800;letter-spacing:-.01em}

    @keyframes gaji-spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    .list{padding:0;touch-action:pan-y}
    .item{display:grid;grid-template-columns:98px 1fr;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
    .item.viewed{background:#dfe5ec}
    .item.viewed .item-title{color:#4b5563}
    .item.viewed .meta,.item.viewed .stats{color:#6b7280}
    .thumb-wrap{position:relative}
    .thumb{width:98px;height:98px;border-radius:12px;object-fit:cover;background:#f3f4f6}
    .fav-badge{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:999px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#ef4444;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .item-title{font-size:15px;font-weight:500;line-height:1.4;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .meta{margin-top:4px;color:var(--muted);font-size:12px}
    .item-body{min-width:0}
    .item-main-row{min-width:0}
    .meta-list-time,.temp-inline{display:none}
    .meta span + span::before{content:' · '}
    .stats-row{margin-top:5px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
    .stats{color:#6b7280;font-size:12px;font-weight:500}
    .temperature{font-size:11px;font-weight:700;color:#7c3aed;white-space:nowrap}
    .temp-info-btn{display:inline-flex;align-items:center;border:0;background:transparent;padding:2px 0;color:inherit;font:inherit;font-weight:850;cursor:pointer;white-space:nowrap}
    .temp-info-btn:focus-visible{outline:2px solid rgba(var(--brand-rgb),.45);outline-offset:3px;border-radius:6px}
    .price{margin-top:6px;font-size:15px;font-weight:700;letter-spacing:-.015em}
    .empty{padding:40px 8px;color:#6b7280;font-size:14px}
    .sync-stamp{grid-column:1/-1;padding:8px 0 0;margin:0;color:#9ca3af;font-size:10px;line-height:1.35;text-align:left;letter-spacing:-.01em}
    .fab{position:fixed;right:max(16px,calc((100vw - 430px) / 2 + 16px));bottom:16px;min-width:86px;height:47px;display:flex;align-items:center;justify-content:center;gap:5px;border:none;background:var(--brand);color:#fff;border-radius:999px;padding:0 14px;font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(var(--brand-rgb),.34);cursor:pointer;transition:width .2s ease,min-width .2s ease,height .2s ease,padding .2s ease,border-radius .2s ease,box-shadow .2s ease,transform .2s ease}
    .fab-plus{font-size:19px;line-height:1;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
    .fab-text{white-space:nowrap;transition:opacity .15s ease;font-size:13px;font-weight:700;letter-spacing:-.01em}
    .fab.is-compact{width:56px;min-width:56px;height:56px;padding:0;border-radius:50%;box-shadow:0 10px 24px rgba(var(--brand-rgb),.38);display:flex;align-items:center;justify-content:center;gap:0}
    .fab.is-compact .fab-plus{font-size:30px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;margin:0;transform:none}
    .fab.is-compact .fab-text{display:none}
    .sort-sheet-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.36);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s linear .2s;z-index:40}
    .sort-sheet-backdrop.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s ease}
    .sort-sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(calc(100% + 48px));padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -18px 44px rgba(17,24,39,.18);transition:transform .22s ease,visibility 0s linear .22s;z-index:41}
    .sort-sheet.show{visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);transition:transform .22s ease}
    .temp-modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.38);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s linear .2s;z-index:50}
    .temp-modal-backdrop.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s ease}
    .temp-modal{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(calc(100% + 48px));padding:12px 26px calc(env(safe-area-inset-bottom) + 22px);background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -18px 44px rgba(17,24,39,.18);transition:transform .22s ease,visibility 0s linear .22s;z-index:51;text-align:center}
    .temp-modal.show{visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);transition:transform .22s ease}
    .temp-handle{width:42px;height:4px;border-radius:999px;background:#e5e7eb;margin:0 auto 22px}.temp-face{width:116px;height:116px;margin:0 auto 18px;border-radius:32px;background:linear-gradient(145deg,#f5f0ff,#ede9fe);display:grid;place-items:center;box-shadow:0 14px 30px rgba(var(--brand-rgb),.18)}.temp-face img{width:82px;height:82px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(var(--brand-rgb),.18))}
    .temp-gauge{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 28px}.temp-gauge-value{color:var(--brand);font-size:20px;font-weight:950}.temp-gauge-track{width:min(260px,52vw);height:11px;border-radius:999px;background:#edf0f4;overflow:hidden}.temp-gauge-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#a78bfa,#7c3aed)}
    .temp-modal-title{margin:0 0 12px;font-size:27px;line-height:1.2;font-weight:950;letter-spacing:-.05em}.temp-modal-copy{margin:0 auto 28px;max-width:350px;color:#4b5563;font-size:16px;line-height:1.6;letter-spacing:-.015em}.temp-modal-confirm{width:100%;height:56px;border:0;border-radius:16px;background:#1f2933;color:#fff;font-size:18px;font-weight:950;cursor:pointer}
    .sheet-btn{width:100%;height:52px;border:none;border-radius:12px;background:#f4f6f8;color:#111827;font-size:16px;font-weight:800;cursor:pointer}
    .sheet-btn + .sheet-btn{margin-top:8px}
    .sheet-btn.active{background:#ede9fe;color:#5b21b6}

    @media (min-width:768px){
      body{background:var(--page)}
      .app{max-width:1120px;padding:0 28px 48px}
      .top{top:16px;margin:16px 0 18px;padding:16px 20px 14px;border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 34px rgba(17,24,39,.055)}
      .row{display:grid;grid-template-columns:minmax(190px,1fr) auto minmax(190px,1fr);gap:18px;align-items:center}
      .app-webview .row{display:flex;justify-content:space-between;gap:12px}
      .title-app{font-size:28px}
      .web-tabs{display:flex;justify-content:center;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.82);box-shadow:0 10px 28px rgba(42,25,82,.045)}

      .top-actions{justify-content:flex-end;gap:3px}
      .view-toggle{display:flex}
      .icon-btn{width:36px;height:36px;background:#f4f6f8}
      .top-icon{width:23px;height:23px}
      .profile-chip{height:36px;max-width:154px;background:#fff;border:1px solid var(--line);padding-right:11px}.profile-avatar{width:28px;height:28px}
      .search-wrap{max-width:520px;margin-left:auto;margin-right:0}
      .search-input{height:46px;background:#fafafa}
      .feed-controls{padding-top:14px}
      .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0}
      .list.view-list{grid-template-columns:minmax(0,1fr);justify-content:stretch;gap:6px;width:100%}
      .list.view-list .item{grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;min-height:64px;padding:9px 14px;border-radius:12px;box-shadow:none}
      .list.view-list .thumb-wrap{width:44px;height:44px}
      .list.view-list .thumb{width:44px;height:44px;border-radius:9px}
      .list.view-list .fav-badge{display:none}
      .list.view-list .item-body{display:grid;grid-template-rows:auto auto;gap:4px;min-width:0}
      .list.view-list .item-main-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;min-width:0}
      .list.view-list .item-title{display:block;min-width:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:15px;font-weight:550;line-height:1.28;-webkit-line-clamp:unset;-webkit-box-orient:initial}
      .list.view-list .meta{display:none}
      .list.view-list .meta-list-time{display:block;color:var(--muted);font-size:12px;font-weight:550;white-space:nowrap;line-height:1}
      .list.view-list .stats-row{display:none}
      .list.view-list .temp-inline{display:block;font-size:13px;font-weight:850;line-height:1;justify-self:end}
      .list.view-list .price{margin-top:0;color:#111827;font-size:14px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .item{grid-template-columns:132px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(17,24,39,.04);transition:transform .15s ease,box-shadow .15s ease}
      .item:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(17,24,39,.08)}
      .thumb{width:132px;height:132px;border-radius:14px}
      .item-title{font-size:15px;font-weight:500;line-height:1.42;letter-spacing:-.015em;-webkit-line-clamp:3}
      .meta{font-size:13px}
      .stats{font-size:13px}
      .price{font-size:17px}
      .empty{grid-column:1/-1;padding:72px 16px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px}
      .top.is-hidden{transform:translateY(calc(-100% - 28px))}
      .fab{right:max(28px,calc((100vw - 1120px) / 2 + 28px));bottom:16px;min-width:93px;height:50px;padding:0 16px}
    }

    @media (min-width:1180px){
      .list{grid-template-columns:repeat(3,minmax(0,1fr))}
      .list.view-list{grid-template-columns:minmax(0,1fr)}
      .item{grid-template-columns:118px 1fr}
      .thumb{width:118px;height:118px}
      .fab{right:max(28px,calc((100vw - 1120px) / 2 + 28px))}
    }

    @media (max-width:767px){
      .search-wrap.show{display:block}
    }
  </style>
</head>

    <p class="temp-modal-copy">핫딜의 조회수, 추천 반응, 댓글 수와 댓글 내용, 상품성, 가격 매력도, 신선도 등을 AI가 종합해 온도로 보여주는 점수예요.</p>

  <script src="assets/time-format.js"></script>

  <div class="nick-modal-backdrop" id="nickModal" role="dialog" aria-modal="true" aria-labelledby="nickModalTitle">
    <div class="nick-modal">
      <div class="nick-modal-title" id="nickModalTitle">닉네임을 변경할까요?</div>
      <div class="nick-modal-body">내 가지의 닉네임 설정 화면으로 이동합니다.</div>
      <div class="nick-modal-actions">
        <button class="nick-modal-btn cancel" id="nickCancel" type="button">취소</button>
        <button class="nick-modal-btn confirm" id="nickConfirm" type="button">확인</button>

  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const LEGACY_STORAGE_KEY = 'hotdeal_items_v2';
    const DELETED_KEY = 'hotdeal_deleted_keys_v1';
    const READ_KEY = 'hotdeal_read_keys_v1';
    const READ_HIGHLIGHT_TOGGLE_KEY = 'hotdeal_read_highlight_enabled_v1';
    const DEALS_API = '/api/deals';
    const LAST_TAB_KEY = 'hotdeal_last_tab_v1';
    const LAST_SORT_KEY = 'hotdeal_sort_mode_v1';
    const SCROLL_Y_KEY = 'hotdeal_list_scroll_y_v1';
    const SCROLL_RESTORE_PENDING_KEY = 'hotdeal_list_scroll_restore_pending_v1';
    const USER_CACHE_KEY = 'gaji_auth_user_cache_v1';
    const VIEW_MODE_KEY = 'hotdeal_web_view_mode_v1';
    let state = { allItems: [], feedItems: [], ppomppuItems: [], quasarItems: [], fmkoreaItems: [], ruliwebItems: [], userItems: [], keyword: '', activeTab: 'all', sortMode: 'latest', viewMode: 'grid', feedEtag: '', userEtag: '', lastUserSyncAt: '', lastFeedSyncAt: '' };
    let isRefreshing = false;

    function normalizeItems(items){
      return (items || []).map((item, idx) => ({
        id: String(item.id ?? idx + 1),
        title: item.title || '제목 없음',
        area: item.area || '뽐뿌 핫딜',
        dist: item.dist || '기타',
        time: item.time || item.date || '',
        relativeTime: window.TimeFormat?.toRelativeKorean(item.registeredAt || item.date || '') || item.time || item.date || '',
        price: item.price || '가격 정보 확인',
        category: item.category || '기타',
        desc: item.desc || '',
        img: item.img || '',
        detailImg: item.detailImg || item.detail_img || item.img || '',
        sourceLink: item.sourceLink || '',
        buyLink: item.buyLink || '',
        views: Number(item.views || 0),
        comments: Number(item.comments || 0),
        date: item.date || '',
        registeredAt: item.registeredAt || '',
        source: item.source || '',
        temperature: Number(item.temperature ?? 0),
        hotScore: Number(item.hotScore ?? 0),
        edited: Boolean(item.edited)
      }));
    }

    function parseStoredItems(key){
      try{
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return normalizeItems(Array.isArray(parsed) ? parsed : parsed.items || parsed.today || parsed.grouped?.today || []);
      }catch(_){
        return [];
      }
    }


    function dedupeItems(items){
      const seen = new Set();
      return (items || []).filter(item => {
        const key = getDealKey(item);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function saveItems(items){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }

    function getDealKey(item){
      if(item?.sourceLink) return item.sourceLink;
      if(item?.id) return `id:${item.id}:${item.date || ''}`;
      return `title:${item?.title || ''}:${item?.date || ''}`;
    }

    function getDeletedKeys(){
      try{
        return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'));
      }catch(_){
        return new Set();
      }
    }

    function filterDeleted(items){
      const deleted = getDeletedKeys();
      return (items || []).filter(item => !deleted.has(getDealKey(item)));
    }

    function getReadKeys(){
      try{ return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); }catch(_){ return new Set(); }
    }

    function markAsRead(item){
      const key = getDealKey(item);
      if(!key) return;
      const keys = getReadKeys();
      keys.add(key);
      localStorage.setItem(READ_KEY, JSON.stringify([...keys]));
    }

    function isReadHighlightEnabled(){
      const raw = localStorage.getItem(READ_HIGHLIGHT_TOGGLE_KEY);
      return raw === '1';
    }

    function getCurrentUserId(){
      try{
        const user = JSON.parse(localStorage.getItem(USER_CACHE_KEY) || 'null');
        return user?.id || user?.email || 'guest';
      }catch(_){ return 'guest'; }
    }

    function getFavoriteStorageKey(){
      return `hotdeal_favorites_${getCurrentUserId()}`;
    }

    function getFavoriteKeys(){
      try{ return new Set(JSON.parse(localStorage.getItem(getFavoriteStorageKey()) || '[]')); }catch(_){ return new Set(); }
    }

    function isFavorited(item){
      return getFavoriteKeys().has(getDealKey(item));
    }

    function formatCount(value){
      const num = Number(value || 0);
      return num.toLocaleString('ko-KR');
    }

    function formatSyncTime(iso){
      if(!iso) return '';
      const d = new Date(iso);
      if(Number.isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일 ${pad(d.getHours())}시 ${pad(d.getMinutes())}분 ${pad(d.getSeconds())}초`;
    }

    function renderSyncStamp(){
      const text = formatSyncTime(state.lastFeedSyncAt);
      if(!text) return '';
      return `<div class="sync-stamp">🍆 서버 동기화 ${text}</div>`;
    }

    function applyItems(items){
      const cleaned = filterDeleted(dedupeItems(items));
      state.allItems = cleaned;
      state.feedItems = cleaned.filter(item => item.source !== 'user');
      state.ppomppuItems = state.feedItems.filter(item => item.source === 'ppomppu' || (!item.source || item.source === 'feed'));
      state.quasarItems = state.feedItems.filter(item => item.source === 'quasar' || item.area === '퀘이사딜');
      state.fmkoreaItems = state.feedItems.filter(item => item.source === 'fmkorea' || item.area === '펨딜');
      state.ruliwebItems = state.feedItems.filter(item => item.source === 'ruliweb' || item.area === '루딜');
      state.userItems = cleaned.filter(item => item.source === 'user');
      saveItems(cleaned);
    }

    function isWithinHours(item, hours){
      const ms = Date.parse(item.registeredAt || item.date || '');
      if(!Number.isFinite(ms)) return false;
      return Date.now() - ms <= hours * 60 * 60 * 1000;
    }

    function getCurrentTabItems(){
      if(state.activeTab === 'popular') return state.allItems.filter(item => Number(item.temperature || 0) >= 70);
      if(state.activeTab === 'latest') return state.allItems.filter(item => isWithinHours(item, 3));
      if(state.activeTab === 'pick') return state.userItems;
      return state.allItems;
    }

    function getFilteredItems(){
      const baseItems = [...getCurrentTabItems()];
      const kw = state.keyword.trim().toLowerCase();
      const filtered = !kw ? baseItems : baseItems.filter(i => (i.title || '').toLowerCase().includes(kw));
      return filtered.sort((a, b) => {
        const da = Date.parse(a.registeredAt || a.date || '') || 0;
        const db = Date.parse(b.registeredAt || b.date || '') || 0;
        const ta = Number(a.temperature || 0);
        const tb = Number(b.temperature || 0);
        if(state.sortMode === 'temperature'){
          if(tb !== ta) return tb - ta;
          return db - da;
        }
        if(db !== da) return db - da;
        return tb - ta;
      });
    }

    const FALLBACK_IMAGE = 'assets/gaji-eggplant.jpg';

    function optimizeImageUrl(src){
      const raw = String(src || '').trim();
      if(!raw) return FALLBACK_IMAGE;
      // 런타임 이미지 프록시는 원본 사이트 밴 리스크가 있어 사용하지 않는다.
      // 뽐뿌 이미지는 GitHub Actions 동기화 시 Supabase Storage에 미러링된 URL을 우선 저장한다.
      // 기존 원격 URL이 남아 있는 동안은 cdn2 -> cdn3 호스트 보정만 적용하고, 실패 시 fallback으로 내린다.
      return /^https:\/\/cdn2\.ppomppu\.co\.kr\//i.test(raw)
        ? raw.replace(/^https:\/\/cdn2\.ppomppu\.co\.kr\//i, 'https://cdn3.ppomppu.co.kr/')
        : raw;
    }

    function hexToRgb(hex){
      const v = String(hex || '').replace('#','');
      const n = parseInt(v, 16);
      return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
    }

    function mixColor(c1, c2, t){
      const clamped = Math.max(0, Math.min(1, Number(t || 0)));
      const a = hexToRgb(c1); const b = hexToRgb(c2);
      const r = Math.round(a.r + (b.r - a.r) * clamped);
      const g = Math.round(a.g + (b.g - a.g) * clamped);
      const b2 = Math.round(a.b + (b.b - a.b) * clamped);
      return `rgb(${r}, ${g}, ${b2})`;
    }

    function temperatureColor(value){
      const t = Math.max(0, Math.min(100, Number(value || 0)));
      if(t <= 50) return mixColor('#9ca3af', '#7dd3fc', t / 50);       // 0도 회색 -> 50도 하늘색
      if(t <= 70) return mixColor('#7dd3fc', '#7c3aed', (t - 50) / 20); // 70도부터 보라색
      return mixColor('#7c3aed', '#5b21b6', (t - 70) / 30);            // 고온은 더 진한 보라
    }

    function render(){
      const list = document.getElementById('list');
      const items = getFilteredItems();
      if(!items.length){
        list.innerHTML = state.activeTab === 'popular'
          ? '<div class="empty">70°C 이상 인기 딜이 아직 없습니다.</div>'
          : state.activeTab === 'latest'
            ? '<div class="empty">최근 3시간 이내 올라온 딜이 아직 없습니다.</div>'
            : state.activeTab === 'pick'
              ? '<div class="empty">가지픽이 아직 없습니다.</div>'
              : '<div class="empty">딜이 아직 없습니다.</div>';
        list.insertAdjacentHTML('beforeend', renderSyncStamp());
        return;
      }
      const readKeys = getReadKeys();
      const showReadHighlight = isReadHighlightEnabled();
      list.innerHTML = items.map((item, idx) => {
        const dealKey = getDealKey(item);
        const viewedClass = (showReadHighlight && readKeys.has(dealKey)) ? 'viewed' : '';
        const favBadge = isFavorited(item) ? '<span class="fav-badge" aria-label="찜됨">♥</span>' : '';
        const imageLoading = idx < 4 ? 'eager' : 'lazy';
        const imageFetchPriority = idx === 0 ? 'high' : 'auto';
        return `
        <a class="item ${viewedClass}" data-key="${dealKey}" href="indexdetail.html?id=${encodeURIComponent(item.id)}">
          <div class="thumb-wrap">
            <img class="thumb" src="${optimizeImageUrl(item.img)}" alt="${item.title}" loading="${imageLoading}" decoding="async" fetchpriority="${imageFetchPriority}" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'">
            ${favBadge}
          </div>
          <div class="item-body">
            <div class="item-main-row">
              <div class="item-title">${item.title}</div>
              <div class="meta-list-time">${(item.relativeTime || item.time || '')}</div>
              <div class="temperature temp-inline" style="color:${temperatureColor(item.temperature)}"><span class="temp-info-btn" role="button" tabindex="0" data-temp="${Math.max(0, Math.min(100, Number(item.temperature || 0)))}" aria-label="가지온도 설명 보기">${Math.max(0, Math.min(100, Number(item.temperature || 0)))}°C</span></div>
            </div>
            <div class="meta"><span>${item.area}</span><span>${item.dist}</span><span>${(item.relativeTime || item.time || '')}</span></div>
            <div class="stats-row">
              <div class="stats">조회 ${formatCount(item.views)} · 댓글 ${formatCount(item.comments)}</div>
              <div class="temperature temp-stats" style="color:${temperatureColor(item.temperature)}"><span class="temp-info-btn" role="button" tabindex="0" data-temp="${Math.max(0, Math.min(100, Number(item.temperature || 0)))}" aria-label="가지온도 설명 보기">${Math.max(0, Math.min(100, Number(item.temperature || 0)))}°C</span></div>
            </div>
            <div class="price">${item.price}</div>
          </div>
        </a>
      `;
      }).join('') + renderSyncStamp();
    }

    function setActiveTabUI(){
      const tabs = document.getElementById('tabs');
      tabs.querySelectorAll('.chip').forEach(chip => chip.classList.toggle('active', chip.dataset.tab === state.activeTab));
    }

    function restoreLastTab(){
      const allowed = new Set(['all','popular','latest','pick']);
      const saved = localStorage.getItem(LAST_TAB_KEY);
      if(saved && allowed.has(saved)) state.activeTab = saved; else state.activeTab = 'all';
      setActiveTabUI();
    }

    function persistLastTab(){
      localStorage.setItem(LAST_TAB_KEY, state.activeTab || 'all');
    }

    const TAB_ORDER = ['all','popular','latest','pick'];

    function switchTab(nextTab){
      if(!TAB_ORDER.includes(nextTab) || state.activeTab === nextTab) return false;
      state.activeTab = nextTab;
      persistLastTab();
      setActiveTabUI();
      const activeChip = document.querySelector(`#tabs .chip[data-tab="${nextTab}"]`);
      activeChip?.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
      render();
      return true;
    }

    function restoreLastSort(){
      const saved = localStorage.getItem(LAST_SORT_KEY);
      if(saved === 'latest' || saved === 'temperature'){
        state.sortMode = saved;
      }
    }

    function persistLastSort(){
      localStorage.setItem(LAST_SORT_KEY, state.sortMode || 'latest');
    }

    function bindTabs(){
      const tabs = document.getElementById('tabs');
      tabs.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip[data-tab]');
        if(!btn) return;
        switchTab(btn.dataset.tab);
      });
    }

    function bindListSwipeTabs(){
      const list = document.getElementById('list');
      let startX = 0;
      let startY = 0;
      let tracking = false;
      let swiped = false;
      const threshold = 56;
      const verticalTolerance = 42;

      list.addEventListener('touchstart', (e) => {
        if(e.touches.length !== 1) return;
        tracking = true;
        swiped = false;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive:true });

      list.addEventListener('touchmove', (e) => {
        if(!tracking || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > verticalTolerance){
          tracking = false;
        }
      }, { passive:true });

      list.addEventListener('touchend', (e) => {
        if(!tracking) return;
        tracking = false;
        const touch = e.changedTouches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        if(Math.abs(dx) < threshold || Math.abs(dx) < Math.abs(dy) * 1.35) return;
        const currentIndex = TAB_ORDER.indexOf(state.activeTab);
        const nextIndex = dx < 0 ? currentIndex + 1 : currentIndex - 1;
        if(nextIndex < 0 || nextIndex >= TAB_ORDER.length) return;
        swiped = switchTab(TAB_ORDER[nextIndex]);
      }, { passive:true });

      list.addEventListener('click', (e) => {
        if(!swiped) return;
        e.preventDefault();
        e.stopPropagation();
        swiped = false;
      }, true);
    }

    function applyViewMode(){
      const list = document.getElementById('list');
      if(!list) return;
      const mode = state.viewMode === 'list' ? 'list' : 'grid';
      list.classList.toggle('view-list', mode === 'list');
      list.classList.toggle('view-grid', mode === 'grid');
      document.querySelectorAll('.view-btn').forEach(btn => {
        const active = btn.dataset.view === mode;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function restoreViewMode(){
      const saved = localStorage.getItem(VIEW_MODE_KEY);
      state.viewMode = saved === 'list' ? 'list' : 'grid';
      applyViewMode();
    }

    function bindViewToggle(){
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.viewMode = btn.dataset.view === 'list' ? 'list' : 'grid';
          localStorage.setItem(VIEW_MODE_KEY, state.viewMode);
          applyViewMode();
        });
      });
    }

    function bindSearch(){
      const wrap = document.getElementById('searchWrap');
      const input = document.getElementById('searchInput');
      document.getElementById('searchToggle').addEventListener('click', () => {
        wrap.classList.toggle('show');
        if(wrap.classList.contains('show')) input.focus();
      });
      input.addEventListener('input', (e) => {
        state.keyword = e.target.value || '';
        render();
      });
    }

    function bindProfileChip(){
      const chip = document.getElementById('profileChip');
      const avatar = document.getElementById('profileAvatar');
      const name = document.getElementById('profileName');
      const modal = document.getElementById('nickModal');
      const cancel = document.getElementById('nickCancel');
      const confirm = document.getElementById('nickConfirm');
      const user = window.GajiIdentity?.getUser?.();
      const nickname = user?.nickname || window.GajiIdentity?.getNickname?.() || '익명 가지';
      if(name) name.textContent = nickname;
      if(avatar) avatar.src = window.GajiIdentity?.getAvatarUrl?.(nickname) || '';
      chip?.addEventListener('click', () => modal?.classList.add('show'));
      cancel?.addEventListener('click', () => modal?.classList.remove('show'));
      modal?.addEventListener('click', (e) => { if(e.target === modal) modal.classList.remove('show'); });
      confirm?.addEventListener('click', () => { location.href = 'nickname.html'; });
    }

    function renderSortIcon(){
      const wrap = document.getElementById('sortIconWrap');
      const icon = state.sortMode === 'temperature'
        ? '<svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.76V5a2 2 0 1 0-4 0v9.76a4 4 0 1 0 4 0Z"></path><path d="M12 7v8"></path></svg>'
        : '<svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>';
      wrap.innerHTML = icon;
    }

    function openSortSheet(){
      document.getElementById('sortSheetBackdrop').classList.add('show');
      document.getElementById('sortSheet').classList.add('show');
      document.getElementById('sortLatestBtn').classList.toggle('active', state.sortMode === 'latest');
      document.getElementById('sortTempBtn').classList.toggle('active', state.sortMode === 'temperature');
    }

    function closeSortSheet(){
      document.getElementById('sortSheetBackdrop').classList.remove('show');
      document.getElementById('sortSheet').classList.remove('show');
    }

    function bindSortSheet(){
      document.getElementById('sortToggle').addEventListener('click', openSortSheet);
      document.getElementById('sortSheetBackdrop').addEventListener('click', closeSortSheet);
      document.getElementById('sortCloseBtn').addEventListener('click', closeSortSheet);
      document.getElementById('sortLatestBtn').addEventListener('click', () => {
        state.sortMode = 'latest';
        persistLastSort();
        renderSortIcon();
        render();
        closeSortSheet();
      });
      document.getElementById('sortTempBtn').addEventListener('click', () => {
        state.sortMode = 'temperature';
        persistLastSort();
        renderSortIcon();
        render();
        closeSortSheet();
      });
      renderSortIcon();
    }

    function saveListScrollState(){
      sessionStorage.setItem(SCROLL_Y_KEY, String(window.scrollY || 0));
    }

    function restoreListScrollState(){
      const pending = sessionStorage.getItem(SCROLL_RESTORE_PENDING_KEY) === '1';
      if(!pending) return;
      const saved = Number(sessionStorage.getItem(SCROLL_Y_KEY) || '0');
      if(!Number.isFinite(saved)) return;
      requestAnimationFrame(() => {
        window.scrollTo(0, Math.max(0, saved));
        setTimeout(() => window.scrollTo(0, Math.max(0, saved)), 80);
      });
      sessionStorage.removeItem(SCROLL_RESTORE_PENDING_KEY);
    }

    function bindReadTracking(){
      const list = document.getElementById('list');
      list.addEventListener('click', (e) => {
        const a = e.target.closest('a.item');
        if(!a) return;
        saveListScrollState();
        sessionStorage.setItem(SCROLL_RESTORE_PENDING_KEY, '1');
        const idParam = new URL(a.href, location.href).searchParams.get('id');
        const item = state.allItems.find(v => String(v.id) === String(idParam));
        if(item) markAsRead(item);
      });
    }

    function bindScrollChrome(){
      const top = document.querySelector('.top');
      const fab = document.getElementById('writeBtn');
      let lastY = window.scrollY;
      let ticking = false;

      function setCompact(compact){
        top.classList.toggle('is-hidden', compact);
        fab.classList.toggle('is-compact', compact);
      }

      function update(){
        const currentY = window.scrollY;
        const diff = currentY - lastY;
        if(currentY < 24){
          setCompact(false);
        }else if(diff > 8 && currentY > 80){
          setCompact(true);
        }else if(diff < -8){
          setCompact(false);
        }
        lastY = currentY;
        ticking = false;
      }

      window.addEventListener('scroll', () => {
        if(ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      }, { passive:true });
    }

    function makeFeedFingerprint(items){
      return (items || [])
        .map((item) => [
          item.sourceLink || item.id || '',
          item.views || 0,
          item.comments || 0,
          item.temperature || 0,
          item.img || '',
          item.registeredAt || item.date || ''
        ].join('|'))
        .sort()
        .join('~');
    }

    async function refreshFeed({ silent = false } = {}){
      if(isRefreshing) return;
      isRefreshing = true;
      const wrap = document.getElementById('pullRefresh');
      const label = document.getElementById('gajiLabel');
      try{
        if(!silent){
          wrap.classList.add('show');
          wrap.style.height = '86px';
          label.textContent = '가지 로딩중...';
        }
        const headers = state.feedEtag ? { 'If-None-Match': state.feedEtag } : {};
        const sinceQuery = state.lastFeedSyncAt ? `&since=${encodeURIComponent(state.lastFeedSyncAt)}` : '';
        const res = await fetch(`${DEALS_API}?scope=feed${sinceQuery}`, { cache: 'no-store', headers });
        if(res.status === 304) return;
        if(res.ok){
          state.feedEtag = res.headers.get('etag') || state.feedEtag;
          const data = await res.json();
          const incoming = normalizeItems(data.items || []);
          const prevFingerprint = makeFeedFingerprint(getCurrentTabItems());

          if(data.delta && state.feedItems.length){
            const byKey = new Map(state.feedItems.map((item) => [getDealKey(item), item]));
            incoming.forEach((item) => byKey.set(getDealKey(item), item));
            state.feedItems = [...byKey.values()];
          }else{
            state.feedItems = incoming;
          }

          applyItems([...state.userItems, ...state.feedItems]);
          state.lastFeedSyncAt = data.serverTime || new Date().toISOString();
          const nextFingerprint = makeFeedFingerprint(getCurrentTabItems());
          if(prevFingerprint !== nextFingerprint){
            render();
          }
        }
      }catch(_){
      }finally{
        if(!silent){
          label.textContent = '당겨서 새로고침';
          setTimeout(() => {
            wrap.style.height = '0px';
            wrap.classList.remove('show');
          }, 220);
        }
        isRefreshing = false;
      }
    }

    async function refreshNaminDealsBackground(){
      try{
        const headers = state.userEtag ? { 'If-None-Match': state.userEtag } : {};
        const sinceQuery = state.lastUserSyncAt ? `&since=${encodeURIComponent(state.lastUserSyncAt)}` : '';
        const res = await fetch(`${DEALS_API}?scope=user${sinceQuery}`, { cache: 'no-store', headers });
        if(res.status === 304) return;
        if(!res.ok) return;

        state.userEtag = res.headers.get('etag') || state.userEtag;
        const data = await res.json();
        const incoming = normalizeItems(data.items || []).filter(item => item.source === 'user');

        if(data.delta && state.userItems.length){
          const byId = new Map(state.userItems.map(item => [String(item.id), item]));
          incoming.forEach(item => byId.set(String(item.id), item));
          state.userItems = [...byId.values()];
        }else{
          state.userItems = incoming;
        }

        state.lastUserSyncAt = data.serverTime || new Date().toISOString();
        applyItems([...state.feedItems, ...state.userItems]);
        if(state.activeTab === 'namin') render();
      }catch(_){
      }
    }

    function bindPullToRefresh(){
      const wrap = document.getElementById('pullRefresh');
      const label = document.getElementById('gajiLabel');
      let pulling = false;
      let startY = 0;
      let pullDistance = 0;
      const threshold = 74;

      function setPullHeight(px){
        const height = Math.max(0, Math.min(98, px));
        wrap.style.height = `${height}px`;
        if(height > 8) wrap.classList.add('show');
        else wrap.classList.remove('show');
      }

      window.addEventListener('touchstart', (e) => {
        if(window.scrollY > 0 || isRefreshing) return;
        pulling = true;
        startY = e.touches[0].clientY;
        pullDistance = 0;
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if(!pulling) return;
        const currentY = e.touches[0].clientY;
        const delta = currentY - startY;
        if(delta <= 0){
          setPullHeight(0);
          label.textContent = '당겨서 새로고침';
          return;
        }
        pullDistance = delta * 0.52;
        setPullHeight(pullDistance);
        label.textContent = pullDistance >= threshold ? '놓으면 새로고침' : '당겨서 새로고침';
      }, { passive: true });

      window.addEventListener('touchend', async () => {
        if(!pulling) return;
        pulling = false;
        if(pullDistance >= threshold){
          setPullHeight(86);
          wrap.classList.add('show');
          await refreshFeed();
        }else{
          setPullHeight(0);
          label.textContent = '당겨서 새로고침';
        }
        pullDistance = 0;
      }, { passive: true });
    }

    function bindAutoSync(){
      // 무료 사용량 보호: 30초 자동 polling은 제거하고,
      // 앱 진입/init + 화면 복귀 + 사용자의 당겨서 새로고침에서만 갱신한다.
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState !== 'visible') return;
        refreshFeed({ silent: true });
        refreshNaminDealsBackground();
      });
    }

    function openTempModal(rawTemp){
      const temp = Math.max(0, Math.min(100, Number(rawTemp || 0)));
      const value = document.getElementById('tempModalValue');
      const fill = document.getElementById('tempModalFill');
      const modal = document.getElementById('tempModal');
      const backdrop = document.getElementById('tempModalBackdrop');
      if(value) value.textContent = `${temp}°C`;
      if(fill) fill.style.width = `${temp}%`;
      backdrop?.classList.add('show');
      modal?.classList.add('show');
    }

    function closeTempModal(){
      document.getElementById('tempModalBackdrop')?.classList.remove('show');
      document.getElementById('tempModal')?.classList.remove('show');
    }

    function bindTemperatureModal(){
      const list = document.getElementById('list');
      list.addEventListener('click', (event) => {
        const target = event.target.closest('.temp-info-btn');
        if(!target) return;
        event.preventDefault();
        event.stopPropagation();
        openTempModal(target.dataset.temp);
      });
      list.addEventListener('keydown', (event) => {
        if(event.key !== 'Enter' && event.key !== ' ') return;
        const target = event.target.closest('.temp-info-btn');
        if(!target) return;
        event.preventDefault();
        openTempModal(target.dataset.temp);
      });
      document.getElementById('tempModalClose')?.addEventListener('click', closeTempModal);
      document.getElementById('tempModalBackdrop')?.addEventListener('click', closeTempModal);
      document.addEventListener('keydown', (event) => {
        if(event.key === 'Escape') closeTempModal();
      });
    }

    async function init(){
      restoreLastTab();
      restoreLastSort();
      bindProfileChip();
      bindTabs();
      bindListSwipeTabs();
      bindSearch();
      bindSortSheet();
      bindViewToggle();
      restoreViewMode();
      bindReadTracking();
      bindScrollChrome();
      bindPullToRefresh();
      bindAutoSync();
      bindTemperatureModal();

      const cached = filterDeleted(dedupeItems([...parseStoredItems(STORAGE_KEY), ...parseStoredItems(LEGACY_STORAGE_KEY)]));
      applyItems(cached);
      render();
      restoreListScrollState();

      await refreshFeed({ silent: true });
      refreshNaminDealsBackground();

      render();
      restoreListScrollState();
    }

    async function ensureLoggedInForWrite(){
      window.GajiIdentity?.getUser?.();
      return true;
    }

    function showLoginToast(){
      let toast = document.getElementById('loginToast');
      if(!toast){
        toast = document.createElement('div');
        toast.id = 'loginToast';
        toast.setAttribute('role', 'status');
        toast.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(12px);z-index:9999;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:999px;background:rgba(23,19,37,.92);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.01em;box-shadow:0 10px 26px rgba(17,24,39,.22);opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none;white-space:nowrap';
        document.body.appendChild(toast);
      }
      toast.textContent = '로그인을 해주세요';
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
      });
      clearTimeout(window.__loginToastTimer);
      window.__loginToastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(12px)';
      }, 1800);
    }

    document.getElementById('writeBtn').addEventListener('click', async () => {
      const ok = await ensureLoggedInForWrite();
      if(!ok) return;
      location.href='indexcreate.html';
    });

    window.addEventListener('pagehide', saveListScrollState);
    window.addEventListener('beforeunload', saveListScrollState);

    init();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => undefined);
      });
    }
  </script>
