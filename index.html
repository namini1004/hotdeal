<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오늘의 핫딜</title>
  <style>
    :root{--bg:#fff;--text:#111;--muted:#8b8b8b;--line:#f0f0f0;--chip:#f4f5f6;--chip-active:#1f2937;--brand:#ff6f0f}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:88px}
    .top{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
    .row{display:flex;align-items:center;justify-content:space-between}
    .loc{font-size:34px;font-weight:800;letter-spacing:-0.03em}
    .icons{display:flex;gap:14px;font-size:22px}
    .chips{display:flex;gap:10px;overflow:auto;padding:12px 0 2px}
    .chip{padding:10px 16px;border-radius:999px;background:var(--chip);font-weight:700;white-space:nowrap}
    .chip.active{background:var(--chip-active);color:#fff}
    .list{padding:0 16px}
    .item{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
    .thumb{width:110px;height:110px;border-radius:12px;object-fit:cover;background:#eee}
    .title{font-size:28px;font-weight:700;line-height:1.25;letter-spacing:-0.02em}
    .meta{font-size:22px;color:var(--muted);margin-top:6px}
    .price{margin-top:8px;font-size:34px;font-weight:800;letter-spacing:-0.03em}
    .stats{display:flex;justify-content:flex-end;color:#b0b0b0;font-size:21px;margin-top:6px}
    .fab{position:fixed;right:calc(50% - 200px);bottom:98px;background:var(--brand);color:#fff;border:none;border-radius:999px;padding:14px 22px;font-size:24px;font-weight:800;box-shadow:0 8px 18px rgba(255,111,15,.35)}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 0 calc(env(safe-area-inset-bottom) + 8px)}
    .nav div{text-align:center;color:#9ca3af;font-size:18px}
    .nav .on{color:#111;font-weight:700}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="row">
        <div class="loc">망포동 ▾</div>
        <div class="icons">⌕ 🔔 ☰</div>
      </div>
      <div class="chips">
        <div class="chip active">전체</div><div class="chip">수집품</div><div class="chip">태블릿PC</div><div class="chip">방금 전</div><div class="chip">인기</div>
      </div>
    </header>

    <main class="list" id="list"></main>
  </div>

  <button class="fab">+ 글쓰기</button>
  <nav class="nav">
    <div class="on">홈</div><div>커뮤니티</div><div>동네지도</div><div>채팅</div><div>나의 당근</div>
  </nav>

  <script>
    const items = [
      {id:1,title:'NEEKE 핸드폰 태블릿 거치대',area:'영통2동',dist:'2km',time:'3시간 전',price:'12,000원',likes:2,img:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=900&q=80'},
      {id:2,title:'캡슐 커피머신 스타터 세트',area:'망포1동',dist:'1.2km',time:'28분 전',price:'114,000원',likes:11,img:'https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=900&q=80'},
      {id:3,title:'무선 노이즈캔슬링 헤드폰',area:'매탄동',dist:'3.8km',time:'1시간 전',price:'109,000원',likes:4,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=80'},
      {id:4,title:'논스틱 프라이팬 2종 세트',area:'원천동',dist:'4km',time:'2시간 전',price:'39,600원',likes:8,img:'https://images.unsplash.com/photo-1584990347449-ae2f5c79f8c0?auto=format&fit=crop&w=900&q=80'},
      {id:5,title:'방수 데일리 백팩 24L',area:'망포동',dist:'400m',time:'12분 전',price:'54,900원',likes:6,img:'https://images.unsplash.com/photo-1491637639811-60e2756cc1c7?auto=format&fit=crop&w=900&q=80'},
      {id:6,title:'무선 핸디 청소기',area:'인계동',dist:'2.3km',time:'50분 전',price:'59,000원',likes:3,img:'https://images.unsplash.com/photo-1558317374-067fb5f30001?auto=format&fit=crop&w=900&q=80'}
    ];

    const list = document.getElementById('list');
    list.innerHTML = items.map(item => `
      <a class="item" href="detail.html?id=${item.id}">
        <img class="thumb" src="${item.img}" alt="${item.title}">
        <div>
          <div class="title">${item.title}</div>
          <div class="meta">${item.area} · ${item.dist} · ${item.time}</div>
          <div class="price">${item.price}</div>
          <div class="stats">♡ ${item.likes}</div>
        </div>
      </a>
    `).join('');
  </script>
</body>
</html>
