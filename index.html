      .list.view-list{grid-template-columns:minmax(0,1fr);justify-content:stretch;gap:0;width:auto;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}

      .item{grid-template-columns:132px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(17,24,39,.04);transition:transform .15s ease,box-shadow .15s ease}

  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const LEGACY_STORAGE_KEY = 'hotdeal_items_v2';
    const DELETED_KEY = 'hotdeal_deleted_keys_v1';
    const READ_KEY = 'hotdeal_read_keys_v1';
    const READ_HIGHLIGHT_TOGGLE_KEY = 'hotdeal_read_highlight_enabled_v1';
    const DEALS_API = '/api/deals';
    const LAST_TAB_KEY = 'hotdeal_last_tab_v1';
    const SCROLL_Y_KEY = 'hotdeal_list_scroll_y_v1';
    const SCROLL_RESTORE_PENDING_KEY = 'hotdeal_list_scroll_restore_pending_v1';
    const DETAIL_BOOTSTRAP_KEY = 'hotdeal_detail_bootstrap_v1';
    const USER_CACHE_KEY = 'gaji_auth_user_cache_v1';
    const VIEW_MODE_KEY = 'hotdeal_web_view_mode_v1';
    const LAST_FEED_SYNC_KEY = 'hotdeal_last_feed_sync_at_v1';
    const PWA_INSTALL_DISMISSED_KEY = 'gaji_pwa_install_dismissed_at_v1';
    const PWA_INSTALL_DISMISS_MS = 7 * 24 * 60 * 60 * 1000;
    const FULL_REFRESH_INTERVAL_MS = 24 * 60 * 60 * 1000;
    const FEED_PAGE_SIZE = 100;
    const FEED_LOOKBACK_MS = 48 * 60 * 60 * 1000;
    let state = { allItems: [], feedItems: [], ppomppuItems: [], quasarItems: [], fmkoreaItems: [], ruliwebItems: [], userItems: [], keyword: '', activeTab: 'all', viewMode: 'grid', feedEtag: '', userEtag: '', lastUserSyncAt: '', lastFeedSyncAt: '', feedNextOffset: 0, feedHasMore: true, initialFeedLoading: true };
    let isRefreshing = false;
    let isLoadingMoreFeed = false;

    function normalizeItems(items){
      return (items || []).map((item, idx) => {
        const rawTemperature = Number(item.temperature);
        const hasTemperature = item.temperature !== undefined && item.temperature !== null && item.temperature !== '' && Number.isFinite(rawTemperature);
        return ({
        id: String(item.id ?? idx + 1),
        title: item.title || '제목 없음',
        area: item.area || '뽐뿌 핫딜',
        dist: item.dist || '기타',
        time: item.time || item.date || '',
        relativeTime: window.TimeFormat?.toRelativeKorean(item.registeredAt || item.date || item.time || '') || '',
        price: item.price || '가격 정보 확인',
        category: item.category || '기타',
        desc: item.desc || '',
        img: item.img || '',
        detailImg: item.detailImg || item.detail_img || item.img || '',
        sourceLink: item.sourceLink || '',
        buyLink: item.buyLink || '',
        views: Number(item.views || 0),
        comments: Number(item.comments || 0),
        date: item.date || '',
        registeredAt: item.registeredAt || '',
        source: item.source || '',
        temperature: hasTemperature ? rawTemperature : 0,
        hasTemperature,
        hotScore: Number(item.hotScore ?? 0),
        edited: Boolean(item.edited)
      });
      });
    }

    function parseStoredItems(key){
      try{
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return normalizeItems(Array.isArray(parsed) ? parsed : parsed.items || parsed.today || parsed.grouped?.today || []);
      }catch(_){
        return [];
      }
    }


    function dedupeItems(items){
      const seen = new Set();
      return (items || []).filter(item => {
        const key = getDealKey(item);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function saveItems(items){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }

    function restoreLastFeedSyncAt(){
      state.lastFeedSyncAt = localStorage.getItem(LAST_FEED_SYNC_KEY) || '';
    }

    function persistLastFeedSyncAt(value){
      if(!value) return;
      state.lastFeedSyncAt = value;
      localStorage.setItem(LAST_FEED_SYNC_KEY, value);
    }

    function isFeedSyncExpired(){
      if(!state.lastFeedSyncAt) return true;
      const lastMs = Date.parse(state.lastFeedSyncAt);
      if(!Number.isFinite(lastMs)) return true;
      return Date.now() - lastMs >= FULL_REFRESH_INTERVAL_MS;
    }

    function feedTemperatureLooksIncomplete(items = state.feedItems){
      const feed = (items || []).filter(item => item.source !== 'user');
      if(!feed.length) return false;
      const withTemperature = feed.filter(item => Number(item.temperature || 0) > 0).length;
      return withTemperature < Math.min(3, Math.ceil(feed.length * 0.05));
    }

    function shouldUseDeltaRefresh(mode = 'auto'){
      if(!state.lastFeedSyncAt) return false;
      if(feedTemperatureLooksIncomplete()) return false;
      if(mode === 'entry') return false;
      if(mode === 'manual') return false;
      return true;
    }

    function canonicalDealKey(item = {}){
      const source = item?.source || 'feed';
      const sourceLink = String(item?.sourceLink || '').trim();
      if(source === 'ppomppu'){
        const noMatch = sourceLink.match(/[?&]no=(\d+)/);
        if(noMatch) return `${source}::no:${noMatch[1]}`;
      }
      if(source === 'fmkorea'){
        const idMatch = sourceLink.match(/fmkorea\.com\/(\d+)/);
        if(idMatch) return `${source}::doc:${idMatch[1]}`;
      }
      if(source === 'quasar'){
        const idMatch = sourceLink.match(/\/views\/(\d+)/);
        if(idMatch) return `${source}::view:${idMatch[1]}`;
      }
      if(source === 'ruliweb'){
        const idMatch = sourceLink.match(/\/read\/(\d+)/);
        if(idMatch) return `${source}::read:${idMatch[1]}`;
      }
      return sourceLink ? `${source}::${sourceLink}` : '';
    }

    function getDealKey(item){
      const canonicalKey = canonicalDealKey(item);
      if(canonicalKey) return canonicalKey;
      if(item?.id) return `id:${item.id}:${item.date || ''}`;
      return `title:${item?.title || ''}:${item?.date || ''}`;
    }

    function getDeletedKeys(){
      try{
        return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'));
      }catch(_){
        return new Set();
      }
    }

    function filterDeleted(items){
      const deleted = getDeletedKeys();
      return (items || []).filter(item => !deleted.has(getDealKey(item)));
    }

    function itemTimestampMs(item = {}){
      const raw = item.registeredAt || item.date || item.time || item.relativeTime || '';
      const parsed = window.TimeFormat?.parseMs?.(raw) || Date.parse(String(raw || ''));
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function isFreshFeedItem(item = {}, nowMs = Date.now()){
      if(item.source === 'user') return true;
      const ms = itemTimestampMs(item);
      if(!ms) return false;
      return nowMs - ms <= FEED_LOOKBACK_MS;
    }

    function filterStaleFeedItems(items){
      const nowMs = Date.now();
      return (items || []).filter(item => isFreshFeedItem(item, nowMs));
    }

    function getReadKeys(){
      try{ return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); }catch(_){ return new Set(); }
    }

    function markAsRead(item){
      const key = getDealKey(item);
      if(!key) return;
      const keys = getReadKeys();
      keys.add(key);
      localStorage.setItem(READ_KEY, JSON.stringify([...keys]));
    }

    function isReadHighlightEnabled(){
      const raw = localStorage.getItem(READ_HIGHLIGHT_TOGGLE_KEY);
      return raw === '1';
    }

    function getCurrentUserId(){
      try{
        const user = JSON.parse(localStorage.getItem(USER_CACHE_KEY) || 'null');
        return user?.id || user?.email || 'guest';
      }catch(_){ return 'guest'; }
    }

    function getFavoriteStorageKey(){
      return `hotdeal_favorites_${getCurrentUserId()}`;
    }

    function getFavoriteStorageKeys(){
      const current = getFavoriteStorageKey();
      const legacyGuest = 'hotdeal_favorites_guest';
      return current === legacyGuest ? [current] : [current, legacyGuest];
    }

    function getFavoriteKeys(){
      const keys = new Set();
      getFavoriteStorageKeys().forEach(storageKey => {
        try{
          JSON.parse(localStorage.getItem(storageKey) || '[]').forEach(key => keys.add(key));
        }catch(_){ }
      });
      return keys;
    }

    function getFavoriteDealKeys(item){
      return [...new Set([
        getDealKey(item),
        canonicalDealKey(item),
        item?.sourceLink || '',
        item?.id ? `id:${item.id}:${item.date || ''}` : '',
        item?.title ? `title:${item.title}:${item.date || ''}` : ''
      ].filter(Boolean))];
    }

    function isFavorited(item){
      const keys = getFavoriteKeys();
      return getFavoriteDealKeys(item).some(key => keys.has(key));
    }

    function setFavoriteKeys(keys){
      localStorage.setItem(getFavoriteStorageKey(), JSON.stringify([...(keys || [])]));
    }

    async function loadRemoteFavorites(){
      try{
        const res = await fetch(`${DEALS_API}?action=favorites&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) return false;
        const data = await res.json();
        if(Array.isArray(data.keys) && !data.remoteDisabled){
          setFavoriteKeys(data.keys);
          return true;
        }
      }catch(_){ }
      return false;
    }

    function formatCount(value){
      const num = Number(value || 0);
      return num.toLocaleString('ko-KR');
    }

    function formatSyncTime(iso){
      if(!iso) return '';
      const d = new Date(iso);
      if(Number.isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function renderSyncStamp(){
      const text = formatSyncTime(state.lastFeedSyncAt);
      if(!text) return '';
      return `<div class="sync-stamp">🍆 서버 동기화 ${text}</div>`;
    }

    function applyItems(items){
      const cleaned = filterStaleFeedItems(filterDeleted(dedupeItems(items)));
      state.allItems = cleaned;
      state.feedItems = cleaned.filter(item => item.source !== 'user');
      state.ppomppuItems = state.feedItems.filter(item => item.source === 'ppomppu' || (!item.source || item.source === 'feed'));
      state.quasarItems = state.feedItems.filter(item => item.source === 'quasar' || item.area === '퀘이사딜');
      state.fmkoreaItems = state.feedItems.filter(item => item.source === 'fmkorea' || item.area === '펨딜');
      state.ruliwebItems = state.feedItems.filter(item => item.source === 'ruliweb' || item.area === '루딜');
      state.userItems = cleaned.filter(item => item.source === 'user');
      saveItems(cleaned);
    }

    function isWithinHours(item, hours){
      const ms = itemTimestampMs(item);
      if(!ms) return false;
      return Date.now() - ms <= hours * 60 * 60 * 1000;
    }

    function getCurrentTabItems(){
      return state.allItems;
    }

    function getFilteredItems(){
      const baseItems = [...getCurrentTabItems()];
      const kw = state.keyword.trim().toLowerCase();
      const filtered = !kw ? baseItems : baseItems.filter(i => (i.title || '').toLowerCase().includes(kw));
      return filtered.sort((a, b) => {
        const da = itemTimestampMs(a);
        const db = itemTimestampMs(b);
        const ta = Number(a.temperature || 0);
        const tb = Number(b.temperature || 0);
        if(state.activeTab === 'popular'){
          if(tb !== ta) return tb - ta;
          return db - da;
        }
        if(db !== da) return db - da;
        return tb - ta;
      });
    }

    const FALLBACK_IMAGE = 'assets/gaji-eggplant.jpg';

    function optimizeImageUrl(src){
      const raw = String(src || '').trim();
      if(!raw) return FALLBACK_IMAGE;
      // 런타임 이미지 프록시는 원본 사이트 밴 리스크가 있어 사용하지 않는다.
      // 뽐뿌 이미지는 GitHub Actions 동기화 시 Supabase Storage에 미러링된 URL을 우선 저장한다.
      // 기존 원격 URL이 남아 있는 동안은 cdn2 -> cdn3 호스트 보정만 적용하고, 실패 시 fallback으로 내린다.
      return /^https:\/\/cdn2\.ppomppu\.co\.kr\//i.test(raw)
        ? raw.replace(/^https:\/\/cdn2\.ppomppu\.co\.kr\//i, 'https://cdn3.ppomppu.co.kr/')
        : raw;

    function hexToRgb(hex){
      const v = String(hex || '').replace('#','');
      const n = parseInt(v, 16);
      return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
    }

    function mixColor(c1, c2, t){
      const clamped = Math.max(0, Math.min(1, Number(t || 0)));
      const a = hexToRgb(c1); const b = hexToRgb(c2);
      const r = Math.round(a.r + (b.r - a.r) * clamped);
      const g = Math.round(a.g + (b.g - a.g) * clamped);
      const b2 = Math.round(a.b + (b.b - a.b) * clamped);
      return `rgb(${r}, ${g}, ${b2})`;
    }

    function temperatureColor(value){
      const t = Math.max(0, Math.min(100, Number(value || 0)));
      if(t <= 50) return mixColor('#9ca3af', '#7dd3fc', t / 50);       // 0도 회색 -> 50도 하늘색
      if(t <= 70) return mixColor('#7dd3fc', '#7c3aed', (t - 50) / 20); // 70도부터 보라색
      return mixColor('#7c3aed', '#5b21b6', (t - 70) / 30);            // 고온은 더 진한 보라
    }

    function bindListSwipeTabs(){
      const list = document.getElementById('list');
      let startX = 0;
      let startY = 0;
      let tracking = false;
      let swiped = false;
      const threshold = 56;
      const verticalTolerance = 42;

      list.addEventListener('touchstart', (e) => {
        if(e.touches.length !== 1) return;
        tracking = true;
        swiped = false;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive:true });

      list.addEventListener('touchmove', (e) => {
        if(!tracking || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > verticalTolerance){
          tracking = false;
        }
      }, { passive:true });

      list.addEventListener('touchend', (e) => {
        if(!tracking) return;
        tracking = false;
        const touch = e.changedTouches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        if(Math.abs(dx) < threshold || Math.abs(dx) < Math.abs(dy) * 1.35) return;
        const currentIndex = TAB_ORDER.indexOf(state.activeTab);
        const nextIndex = dx < 0 ? currentIndex + 1 : currentIndex - 1;
        if(nextIndex < 0 || nextIndex >= TAB_ORDER.length) return;
        swiped = switchTab(TAB_ORDER[nextIndex]);
      }, { passive:true });

      list.addEventListener('click', (e) => {
        if(!swiped) return;
        e.preventDefault();
        e.stopPropagation();
        swiped = false;
      }, true);
    }

    function bindScrollChrome(){
      const top = document.querySelector('.top');
      const fab = document.getElementById('writeBtn');
      let lastY = window.scrollY;
      let ticking = false;

      function setCompact(compact){
        top.classList.toggle('is-hidden', compact);
        fab.classList.toggle('is-compact', compact);
      }

      function update(){
        const currentY = window.scrollY;
        const diff = currentY - lastY;
        if(currentY < 24){
          setCompact(false);
        }else if(diff > 8 && currentY > 80){
          setCompact(true);
        }else if(diff < -8){
          setCompact(false);
        }
        lastY = currentY;
        ticking = false;
      }

      window.addEventListener('scroll', () => {
        if(ticking) return;
        ticking = true;
        requestAnimationFrame(update);
        if(state.feedHasMore && !isLoadingMoreFeed && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 700){
          loadMoreFeed();
        }
      }, { passive:true });

    async function refreshFeed({ silent = false, mode = 'auto', append = false } = {}){
      if(isRefreshing) return;
      isRefreshing = true;
      const clearInitialLoading = state.initialFeedLoading && !append;
      const wrap = document.getElementById('pullRefresh');
      const label = document.getElementById('gajiLabel');
      try{
        if(!silent){
          wrap.classList.add('show');
          wrap.style.height = '86px';
          label.textContent = '가지 로딩중...';
        }
        const headers = (!append && state.feedEtag) ? { 'If-None-Match': state.feedEtag } : {};
        const sinceQuery = (!append && shouldUseDeltaRefresh(mode) && state.lastFeedSyncAt) ? `&since=${encodeURIComponent(state.lastFeedSyncAt)}` : '';
        const offsetQuery = append ? `&offset=${encodeURIComponent(state.feedNextOffset || 0)}` : '';
        const res = await fetch(`${DEALS_API}?scope=feed&limit=${FEED_PAGE_SIZE}${offsetQuery}${sinceQuery}`, { cache: 'no-store', headers });
        if(res.status === 304) return;
        if(res.ok){
          const data = await res.json();
          if(!append && !data.delta) state.feedEtag = res.headers.get('etag') || state.feedEtag;
          const incoming = normalizeItems(data.items || []);
          const prevFingerprint = makeFeedFingerprint(getCurrentTabItems());

          if(append){
            const byKey = new Map(state.feedItems.map((item) => [getDealKey(item), item]));
            incoming.forEach((item) => byKey.set(getDealKey(item), item));
            state.feedItems = [...byKey.values()];
          }else if(data.delta && state.feedItems.length){
            const byKey = new Map(state.feedItems.map((item) => [getDealKey(item), item]));
            incoming.forEach((item) => byKey.set(getDealKey(item), item));
            state.feedItems = [...byKey.values()];
          }else{
            state.feedItems = incoming;
          }
          if(!data.delta || append){
            state.feedHasMore = Boolean(data.hasMore);
            state.feedNextOffset = Number(data.nextOffset || state.feedItems.length || 0);
          }

          applyItems([...state.userItems, ...state.feedItems]);
          persistLastFeedSyncAt(data.serverTime || new Date().toISOString());
          const nextFingerprint = makeFeedFingerprint(getCurrentTabItems());
          if(prevFingerprint !== nextFingerprint){
            render();
          }
        }
      }catch(_){
      }finally{
        if(!silent){
          label.textContent = '당겨서 새로고침';
          setTimeout(() => {
            wrap.style.height = '0px';
            wrap.classList.remove('show');
          }, 220);
        }
        isRefreshing = false;
        if(clearInitialLoading){
          state.initialFeedLoading = false;
          render();
        }
      }
    }

    async function loadMoreFeed(){
      if(isLoadingMoreFeed || isRefreshing || !state.feedHasMore) return;

      }finally{
        isLoadingMoreFeed = false;

    }

    async function refreshNaminDealsBackground(){

        const res = await fetch(`${DEALS_API}?scope=user${sinceQuery}`, { cache: 'no-store', headers });
        if(res.status === 304) return;
        if(!res.ok) return;

        const data = await res.json();

          incoming.forEach(item => byId.set(String(item.id), item));
          state.userItems = [...byId.values()];
        }else{
          state.userItems = incoming;
        }

        state.lastUserSyncAt = data.serverTime || new Date().toISOString();
        applyItems([...state.feedItems, ...state.userItems]);

      }catch(_){
      }
    }

    function bindPullToRefresh(){
      const wrap = document.getElementById('pullRefresh');
      const label = document.getElementById('gajiLabel');
      let pulling = false;
      let startY = 0;
      let pullDistance = 0;
      const threshold = 74;

      function setPullHeight(px){
        const height = Math.max(0, Math.min(98, px));
        wrap.style.height = `${height}px`;
        if(height > 8) wrap.classList.add('show');
        else wrap.classList.remove('show');
      }

      window.addEventListener('touchstart', (e) => {
        if(window.scrollY > 0 || isRefreshing) return;
        pulling = true;
        startY = e.touches[0].clientY;
        pullDistance = 0;
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if(!pulling) return;
        const currentY = e.touches[0].clientY;
        const delta = currentY - startY;
        if(delta <= 0){
          setPullHeight(0);
          label.textContent = '당겨서 새로고침';
          return;
        }
        pullDistance = delta * 0.52;
        setPullHeight(pullDistance);
        label.textContent = pullDistance >= threshold ? '놓으면 새로고침' : '당겨서 새로고침';
      }, { passive: true });

      window.addEventListener('touchend', async () => {
        if(!pulling) return;
        pulling = false;
        if(pullDistance >= threshold){
          setPullHeight(86);
          wrap.classList.add('show');
          await refreshFeed({ mode: 'manual' });
        }else{
          setPullHeight(0);
          label.textContent = '당겨서 새로고침';
        }
        pullDistance = 0;
      }, { passive: true });
    }

    function bindPwaInstallPrompt(){
      const card = document.getElementById('pwaInstallCard');
      const installBtn = document.getElementById('pwaInstallBtn');
      const closeBtn = document.getElementById('pwaInstallClose');
      const copy = document.getElementById('pwaInstallCopy');
      if(!card || !installBtn || !closeBtn) return;

      let deferredPrompt = null;
      const isStandalone = () => window.matchMedia?.('(display-mode: standalone)')?.matches || window.navigator.standalone === true || document.documentElement.classList.contains('app-webview');
      const isDismissedRecently = () => {
        const last = Number(localStorage.getItem(PWA_INSTALL_DISMISSED_KEY) || 0);
        return last && Date.now() - last < PWA_INSTALL_DISMISS_MS;
      };
      const show = () => {
        if(isStandalone() || isDismissedRecently()) return;
        requestAnimationFrame(() => card.classList.add('show'));
      };
      const hide = () => card.classList.remove('show');
      const dismiss = () => {
        localStorage.setItem(PWA_INSTALL_DISMISSED_KEY, String(Date.now()));
        hide();
      };

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installBtn.textContent = '설치';
        if(copy) copy.textContent = '설치하면 홈 화면에서 바로 열고 전체화면으로 볼 수 있어요.';
        setTimeout(show, 1600);
      });

      window.addEventListener('appinstalled', () => {
        localStorage.setItem(PWA_INSTALL_DISMISSED_KEY, String(Date.now()));
        deferredPrompt = null;
        hide();
      });

      installBtn.addEventListener('click', async () => {
        if(deferredPrompt){
          deferredPrompt.prompt();
          await deferredPrompt.userChoice.catch(() => undefined);
          deferredPrompt = null;
          dismiss();
          return;
        }
        if(copy) copy.textContent = '브라우저 메뉴에서 “홈 화면에 추가”를 선택하면 앱처럼 사용할 수 있어요.';
      });
      closeBtn.addEventListener('click', dismiss);

      const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
      const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent || '');
      if(isiOS && isSafari && !isStandalone()){
        installBtn.textContent = '방법 보기';
        if(copy) copy.textContent = '공유 버튼 → 홈 화면에 추가를 누르면 앱처럼 열 수 있어요.';
        setTimeout(show, 2200);
      }
    }

    }

    function bindTemperatureModal(){
      const list = document.getElementById('list');
      list.addEventListener('click', (event) => {
        const target = event.target.closest('.temp-info-btn');
        if(!target) return;
        event.preventDefault();
        event.stopPropagation();
        openTempModal(target.dataset.temp);
      });
      list.addEventListener('keydown', (event) => {
        if(event.key !== 'Enter' && event.key !== ' ') return;
        const target = event.target.closest('.temp-info-btn');
        if(!target) return;
        event.preventDefault();
        openTempModal(target.dataset.temp);
      });
      document.getElementById('tempModalClose')?.addEventListener('click', closeTempModal);
      document.getElementById('tempModalBackdrop')?.addEventListener('click', closeTempModal);
      document.addEventListener('keydown', (event) => {
        if(event.key === 'Escape') closeTempModal();
      });
    }

    async function init(){
      restoreLastTab();
      bindSettingsSheet();
      bindTabs();
      bindListSwipeTabs();
      bindSearch();
      bindViewToggle();
      restoreViewMode();
      bindReadTracking();
      bindReadHighlightPreferenceSync();
      bindScrollChrome();
      bindPullToRefresh();
      bindAutoSync();
      bindPwaInstallPrompt();
      bindTemperatureModal();

      const cached = filterDeleted(dedupeItems([...parseStoredItems(STORAGE_KEY), ...parseStoredItems(LEGACY_STORAGE_KEY)]));
      restoreLastFeedSyncAt();
      applyItems(cached);
      state.initialFeedLoading = state.allItems.length === 0;
      const needsFreshTemperature = feedTemperatureLooksIncomplete(state.feedItems);
      if(state.initialFeedLoading){
        render();
      }else if(!needsFreshTemperature){
        render();
        restoreListScrollState();
      }

      if(await loadRemoteFavorites()){
        render();
        restoreListScrollState();
      }

      await refreshFeed({ silent: true, mode: needsFreshTemperature ? 'manual' : 'entry' });
      refreshNaminDealsBackground();

      render();
      restoreListScrollState();
    }

    async function ensureLoggedInForWrite(){
      window.GajiIdentity?.getUser?.();
      return true;
    }

    function showLoginToast(){
      let toast = document.getElementById('loginToast');
      if(!toast){
        toast = document.createElement('div');
        toast.id = 'loginToast';
        toast.setAttribute('role', 'status');
        toast.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(12px);z-index:9999;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:999px;background:rgba(23,19,37,.92);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.01em;box-shadow:0 10px 26px rgba(17,24,39,.22);opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none;white-space:nowrap';
        document.body.appendChild(toast);
      }
      toast.textContent = '로그인을 해주세요';
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
      });
      clearTimeout(window.__loginToastTimer);
      window.__loginToastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(12px)';
      }, 1800);
    }

    document.getElementById('writeBtn').addEventListener('click', async () => {
      const ok = await ensureLoggedInForWrite();
      if(!ok) return;
      location.href='indexcreate.html';
    });

    window.addEventListener('pagehide', saveListScrollState);
    window.addEventListener('beforeunload', saveListScrollState);

    init();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => undefined);
      });
    }
  </script>
</body>
</html>
