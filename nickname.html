<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon.svg" />
  <title>닉네임 설정</title>
  <style>
    body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#111827}
    .app{max-width:430px;margin:0 auto;padding:16px}
    .top{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
    .back{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;border:1px solid #eee9f8;text-decoration:none;color:#374151;font-size:22px;font-weight:800;line-height:1}
    .title{font-size:20px;font-weight:700;letter-spacing:-.02em}
    .card{border:1px solid #e5e7eb;border-radius:14px;padding:14px}
    .current{font-size:14px;color:#374151;margin-bottom:10px}
    input{width:100%;height:46px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:15px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    button{height:46px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
    .primary{background:#7c3aed;color:#fff}
    .ghost{background:#f3f4f6;color:#111827}
    .msg{margin-top:12px;font-size:13px;color:#4b5563;min-height:18px}
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><a class="back" href="my-gaji.html" aria-label="뒤로가기">‹</a><div class="title">닉네임 설정</div></div>
    <section class="card">
      <div class="current" id="current">현재 닉네임: -</div>
      <input id="nicknameInput" maxlength="24" placeholder="예) 반짝이는 보라 가지" />
      <div class="row">
        <button class="ghost" id="autoBtn" type="button">자동 생성</button>
        <button class="primary" id="saveBtn" type="button">저장</button>
      </div>
      <div class="msg" id="msg"></div>
    </section>
  </main>

  <script src="assets/anonymous-identity.js?v=20260607"></script>
  <script>
    const input = document.getElementById('nicknameInput');
    const current = document.getElementById('current');
    const msg = document.getElementById('msg');

    function setMsg(text){ msg.textContent = text || ''; }

    function isGoogleUser(user){
      return Boolean(user && user.anonymous === false);
    }

    function applyNickname(nickname, message){
      const value = String(nickname || '').trim();
      current.textContent = `현재 닉네임: ${value || '-'}`;
      if(value) input.value = value;
      if(message) setMsg(message);
    }

    async function callApi(body, method='POST'){
      const res = await fetch('/api/profile-nickname', {
        method,
        credentials:'include',
        headers:{ 'Content-Type':'application/json' },
        body: method === 'POST' ? JSON.stringify(body || {}) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(data.error || '요청 실패');
      return data;
    }

    function toFriendlyMessage(err){
      const text = String(err?.message || '');
      if(/login required/i.test(text) || /로그인/i.test(text)) return '로그인 후 이용해 주세요.';
      return text || '요청 실패';
    }

    async function loadCurrent(){
      const localUser = window.GajiIdentity?.getUser?.();
      const localNickname = localUser?.nickname || window.GajiIdentity?.getNickname?.() || '';
      if(localNickname) applyNickname(localNickname);
      if(!isGoogleUser(localUser)) return;
      try{
        const data = await callApi(null, 'GET');
        if(data.nickname){
          window.GajiIdentity?.setNickname?.(data.nickname);
          applyNickname(data.nickname);
        }
      }catch(err){
        setMsg(toFriendlyMessage(err));
      }
    }

    document.getElementById('autoBtn').addEventListener('click', async () => {
      setMsg('자동 생성 중...');
      const localUser = window.GajiIdentity?.getUser?.();
      if(!isGoogleUser(localUser)){
        const user = window.GajiIdentity?.regenerateNickname?.() || window.GajiIdentity?.setNickname?.(window.GajiIdentity?.generateNickname?.());
        applyNickname(user?.nickname || input.value, '자동 생성 닉네임을 적용했어요.');
        return;
      }
      try{
        const data = await callApi({ mode:'auto' });
        window.GajiIdentity?.setNickname?.(data.nickname || input.value);
        applyNickname(data.nickname || input.value, '자동 생성 닉네임을 적용했어요.');
      }catch(err){
        const user = window.GajiIdentity?.regenerateNickname?.();
        applyNickname(user?.nickname || input.value, `${toFriendlyMessage(err)} 로컬 닉네임으로 적용했어요.`);
      }
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const nickname = input.value.trim();
      if(!nickname){ setMsg('닉네임을 입력해 주세요.'); return; }
      setMsg('저장 중...');
      const localUser = window.GajiIdentity?.getUser?.();
      if(!isGoogleUser(localUser)){
        const user = window.GajiIdentity?.setNickname?.(nickname);
        applyNickname(user?.nickname || nickname, '이 기기 닉네임으로 저장되었습니다.');
        return;
      }
      try{
        const data = await callApi({ mode:'manual', nickname });
        window.GajiIdentity?.setNickname?.(data.nickname || nickname);
        applyNickname(data.nickname || nickname, '저장되었습니다.');
      }catch(err){ setMsg(toFriendlyMessage(err)); }
    });

    loadCurrent();
  </script>
</body>
</html>
