<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon.svg" />
  <title>가지게시판</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@500');
    :root{--bg:#fff;--page:#f7f4ff;--text:#171325;--muted:#8b95a1;--line:#eee9f8;--chip:#f3edff;--brand:#7c3aed;--brand-rgb:124,58,237}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:500;font-style:normal;font-size:24px;line-height:1;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:88px}
    .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px 10px}
    .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .left{display:flex;align-items:center;gap:8px;min-width:0}
    .back,.icon-btn{width:34px;height:34px;place-items:center;border:none;border-radius:999px;background:transparent;color:#111827;text-decoration:none;cursor:pointer}
    .back{display:none}
    .icon-btn{display:grid}
    .back:active,.icon-btn:active{background:#f4f6f8}
    .board-title{display:flex;align-items:baseline;font-size:24px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;min-width:0}
    .brand-word{color:var(--brand);font-weight:950;letter-spacing:-.09em}
    .title-rest{color:var(--text);font-weight:800;letter-spacing:-.04em;margin-left:1px}
    .search-wrap{display:none;margin-top:10px}
    .search-wrap.show{display:block}
    .search-input{width:100%;height:42px;border:1px solid #d9dde3;border-radius:10px;padding:0 12px;font-size:14px;outline:none}
    .web-tabs{display:none;align-items:center;gap:6px}
    .web-tab{height:38px;display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:999px;color:#667085;text-decoration:none;font-size:13px;font-weight:850;letter-spacing:-.01em}
    .web-tab.active{background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(var(--brand-rgb),.2)}
    .web-tab-eggplant{width:17px;height:17px;display:block}
    .mobile-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:12px;padding:4px;border:1px solid var(--line);border-radius:16px;background:#f8f5ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
    .mobile-tab{height:38px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;color:#697386;text-decoration:none;font-size:13px;font-weight:900;letter-spacing:-.01em;transition:background .18s ease,color .18s ease,box-shadow .18s ease}
    .mobile-tab.active{background:#fff;color:var(--brand);box-shadow:0 8px 18px rgba(var(--brand-rgb),.14)}
    .mobile-tab.active::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--brand);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.12)}
    .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:1px}
    .top-icon{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .profile-chip{height:34px;max-width:128px;display:flex;align-items:center;gap:7px;border:none;border-radius:999px;background:#f7f4ff;color:#2d2438;padding:0 9px 0 4px;cursor:pointer}
    .profile-avatar{width:26px;height:26px;border-radius:999px;display:block;object-fit:cover;flex:0 0 auto}.profile-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900;letter-spacing:-.02em}
    .nick-modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.38);display:none;place-items:center;z-index:80;padding:18px}.nick-modal-backdrop.show{display:grid}.nick-modal{width:min(320px,100%);background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 18px 60px rgba(17,24,39,.24);text-align:center}.nick-modal-title{font-size:17px;font-weight:950;letter-spacing:-.03em}.nick-modal-body{margin-top:8px;color:#667085;font-size:14px;line-height:1.45}.nick-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.nick-modal-btn{height:44px;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer}.nick-modal-btn.cancel{background:#f4f6f8;color:#374151}.nick-modal-btn.confirm{background:var(--brand);color:#fff}
    .board-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 16px 8px;background:#fff;position:sticky;top:73px;z-index:4;border-bottom:1px solid var(--line)}
    .board-tab{height:42px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#6b7280;font-size:14px;font-weight:900;letter-spacing:-.015em;cursor:pointer}
    .board-tab.active{border-color:rgba(var(--brand-rgb),.2);background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(var(--brand-rgb),.18)}
    .list{padding:0 16px}
    .post{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
    .thumb{width:82px;height:82px;border-radius:12px;object-fit:cover;background:#f3f4f6}
    .thumb.empty{display:grid;place-items:center;background:var(--chip);color:var(--brand)}
    .post-title{font-size:15px;font-weight:500;line-height:1.38;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .excerpt{margin-top:4px;color:#4b5563;font-size:12px;line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .meta{margin-top:6px;color:var(--muted);font-size:11px;font-weight:500}
    .empty-list{padding:64px 16px;text-align:center;color:#6b7280;font-size:14px;line-height:1.6}
    .fab{position:fixed;right:max(16px,calc((100vw - 430px) / 2 + 16px));bottom:16px;min-width:86px;height:47px;display:flex;align-items:center;justify-content:center;gap:5px;border:none;background:var(--brand);color:#fff;border-radius:999px;padding:0 14px;font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(var(--brand-rgb),.34);cursor:pointer}
    .fab-plus{font-size:19px;line-height:1;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
    .fab-text{white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:-.01em}

    .view{display:none}
    .view.active{display:block}
    .form{padding:14px 16px}
    .photo-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .photo{border:1px solid #e3e7ec;border-radius:12px;width:96px;height:96px;display:grid;place-items:center;color:var(--brand);font-size:13px;font-weight:800;background:var(--chip);cursor:pointer;overflow:hidden;text-align:center}
    .photo .material-symbols-outlined{font-size:28px}
    .photo-text{display:grid;gap:4px;place-items:center}
    .photo-preview{width:100%;height:100%;object-fit:cover;display:none}
    .photo.has-image .photo-text{display:none}
    .photo.has-image .photo-preview{display:block}
    .file-input{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}
    .field{border-top:1px solid var(--line);padding:14px 0}
    .field:first-of-type{border-top:none;padding-top:0}
    label{display:block;font-size:14px;font-weight:800;margin-bottom:8px}
    input,textarea{width:100%;border:none;outline:none;font:inherit;font-size:16px;color:#111827;background:#fff}
    textarea{min-height:180px;line-height:1.65;resize:none}
    .hint{font-size:13px;color:var(--muted);line-height:1.5}
    .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:#fff;border-top:1px solid var(--line)}
    .submit{width:100%;height:50px;border:none;border-radius:14px;background:var(--brand);color:#fff;font-size:17px;font-weight:900}

    .detail-hero img{width:100%;height:300px;object-fit:cover;display:block;background:#f3f4f6}
    .detail{padding:18px 16px 28px}
    h1{margin:0;font-size:23px;line-height:1.35;letter-spacing:-.03em}
    .detail-meta{margin:10px 0 18px;color:var(--muted);font-size:13px;font-weight:700}
    .body{font-size:16px;line-height:1.75;white-space:normal;word-break:break-word}
    .body h1{margin:.76em 0 .36em;font-size:1.16em;line-height:1.36;font-weight:900}
    .body h2{margin:.7em 0 .34em;font-size:1.08em;line-height:1.36;font-weight:900}
    .body h3{margin:.62em 0 .3em;font-size:1em;line-height:1.35;font-weight:800}
    .body .md-table-wrap{overflow-x:auto;margin:.5em 0}
    .body .md-table{width:100%;border-collapse:collapse;font-size:13px}
    .body .md-table th,.body .md-table td{border:1px solid #e5e7eb;padding:8px 10px;text-align:left;vertical-align:top}
    .body .md-table th{background:#f8fafc;font-weight:800}

    @media (min-width:768px){
      body{background:var(--page)}
      .app{max-width:1120px;padding:0 28px 96px}
      .top{top:16px;margin:16px 0 18px;padding:18px 20px 14px;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(17,24,39,.06)}
      .top-row{display:grid;grid-template-columns:minmax(190px,1fr) auto minmax(190px,1fr);gap:18px;align-items:center}
      .web-tabs{display:flex;justify-content:center;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.82);box-shadow:0 10px 28px rgba(42,25,82,.045)}
      .mobile-tabs{display:none}
      .web-tab{height:34px;padding:0 14px;font-size:13px;color:#697386}
      .web-tab.active{background:#171325;color:#fff;box-shadow:0 8px 18px rgba(17,19,37,.14)}
      .board-title{font-size:28px}
      .icon-btn{width:36px;height:36px;background:#f4f6f8}
      .top-icon{width:23px;height:23px}
      .profile-chip{height:36px;max-width:154px;background:#fff;border:1px solid var(--line);padding-right:11px}.profile-avatar{width:28px;height:28px}
      .search-wrap{max-width:520px;margin-left:auto;margin-right:0}
      .search-input{height:46px;background:#fafafa}
      .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0}
      .post{grid-template-columns:118px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(17,24,39,.04)}
      .thumb{width:118px;height:118px;border-radius:14px}
      .post-title{font-size:16px;font-weight:500;line-height:1.4;letter-spacing:-.015em;-webkit-line-clamp:3}
      .excerpt{font-size:13px}
      .empty-list{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:16px}
      .fab{right:max(28px,calc((100vw - 1120px) / 2 + 28px));bottom:16px;min-width:93px;height:50px;padding:0 16px}
      .form{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 50px rgba(17,24,39,.08)}
      .photo{width:112px;height:112px}
      .bottom{max-width:720px;padding:16px 18px;box-shadow:0 -12px 30px rgba(17,24,39,.06)}
      .detail-wrap{display:grid;grid-template-columns:minmax(360px,520px) minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(17,24,39,.08)}
      .detail-hero img{height:100%;min-height:540px}
      .detail{padding:42px 38px}
      h1{font-size:28px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div class="left">
          <a class="back" id="backBtn" href="board.html" aria-label="목록으로"><span class="material-symbols-outlined" aria-hidden="true">arrow_back_ios_new</span></a>
          <div class="board-title"><span class="brand-word">가지</span><span class="title-rest">가지 한다</span></div>
        </div>
        <nav class="web-tabs" aria-label="주요 메뉴">
          <a class="web-tab" href="index.html"><span aria-hidden="true">⌂</span><span>홈</span></a>
          <a class="web-tab active" href="gajigaji.html" aria-current="page"><img class="web-tab-eggplant" src="assets/gaji-outline.svg" alt="" aria-hidden="true"><span>가지가지</span></a>
        </nav>
        <div class="top-actions">
          <button class="profile-chip" id="profileChip" type="button" aria-label="닉네임 변경">
            <img class="profile-avatar" id="profileAvatar" alt="" aria-hidden="true">
            <span class="profile-name" id="profileName"></span>
          </button>
          <button class="icon-btn" id="searchToggle" type="button" aria-label="검색"><svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg></button>
          <a class="icon-btn" href="my-gaji.html" aria-label="내 가지"><svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6l-.09.09a2 2 0 1 1-3.82 0L10 20a1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1l-.09-.09a2 2 0 1 1 0-3.82L4 10a1.65 1.65 0 0 0 .6-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6l.09-.09a2 2 0 1 1 3.82 0L14 4a1.65 1.65 0 0 0 1 .6 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.35.34.68.6 1l.09.09a2 2 0 1 1 0 3.82L20 14c-.26.32-.46.65-.6 1Z"></path></svg></a>
        </div>
      </div>
      <div class="search-wrap" id="searchWrap">
        <input class="search-input" id="searchInput" type="text" placeholder="게시글 검색" />
      </div>
      <nav class="mobile-tabs" aria-label="모바일 주요 메뉴">
        <a class="mobile-tab" href="index.html">홈</a>
        <a class="mobile-tab active" href="board.html" aria-current="page">가지가지</a>
      </nav>
    </header>

    <section class="view active" id="listView">
      <nav class="board-tabs" aria-label="게시판 구분">
        <button class="board-tab active" type="button" data-category="tips">여러 가지 팁</button>
        <button class="board-tab" type="button" data-category="mydeals">내가올린 핫딜</button>
      </nav>
      <main class="list" id="list"></main>
      <button class="fab" id="writeBtn" type="button" aria-label="글쓰기"><span class="fab-plus" aria-hidden="true">+</span><span class="fab-text">글쓰기</span></button>
    </section>

    <section class="view" id="formView">
      <form class="form" id="form">
        <div class="field">
          <label for="dealUrl">핫딜주소</label>
          <input id="dealUrl" inputmode="url" placeholder="https://..." />
          <div class="hint">링크를 입력하면 대표 이미지/제목/내용을 자동으로 채웁니다.</div>
        </div>

        <div class="photo-row">
          <button class="photo" id="photoButton" type="button">
            <span class="photo-text"><span class="material-symbols-outlined" aria-hidden="true">add_photo_alternate</span><span>사진 첨부</span></span>
            <img class="photo-preview" id="photoPreview" alt="첨부한 사진 미리보기">

        <div class="field">
          <label for="title">제목</label>
          <input id="title" maxlength="80" placeholder="제목을 입력해주세요." required />
        </div>

          <label for="body">내용</label>
          <textarea id="body" placeholder="공유하고 싶은 이야기를 적어주세요."></textarea>
          <div class="hint">줄바꿈/링크/마크다운 지원: #/##/### 제목, **굵게**, *기울임*, [텍스트](https://...), 표(|---|)<br>/n 은 줄바꿈으로 처리되지 않으며 Enter(또는 \n)만 줄바꿈으로 적용됩니다.</div>
        </div>
      </form>
      <div class="bottom">
        <button class="submit" form="form" type="submit">작성 완료</button>
      </div>
    </section>

    <section class="view" id="detailView">
      <div class="detail-wrap">
        <div class="detail-hero" id="detailHero"></div>
        <article class="detail">
          <h1 id="detailTitle"></h1>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="body" id="detailBody"></div>
        </article>
      </div>
    </section>
  </div>

  <script src="assets/text-format.js"></script>
  <script src="assets/time-format.js"></script>
  <script src="assets/anonymous-identity.js?v=20260606"></script>
  <div class="nick-modal-backdrop" id="nickModal" role="dialog" aria-modal="true" aria-labelledby="nickModalTitle">
    <div class="nick-modal">
      <div class="nick-modal-title" id="nickModalTitle">닉네임을 변경할까요?</div>
      <div class="nick-modal-body">내 가지의 닉네임 설정 화면으로 이동합니다.</div>
      <div class="nick-modal-actions">
        <button class="nick-modal-btn cancel" id="nickCancel" type="button">취소</button>
        <button class="nick-modal-btn confirm" id="nickConfirm" type="button">확인</button>
      </div>
    </div>
  </div>
  <script>
    const BOARD_API = '/api/board-posts';
    const LINK_PREVIEW_API = '/api/link-preview';
    const STORAGE_KEY = 'gaji_board_posts_v1';
    const FALLBACK_IMAGE = 'assets/gaji-eggplant.jpg';
    let state = { posts: [], keyword: '', category: 'tips', selectedImage: '', previewImage: '', previewUrl: '' };

    function normalizeBoardCategory(value){
      return ['tips', 'mydeals'].includes(String(value || '').trim()) ? String(value || '').trim() : 'tips';
    }

    function getBoardCategoryFromBody(body){
      return String(body || '').match(/^<!--gaji-category:(tips|mydeals)-->/)?.[1] || 'tips';
    }

    function stripBoardCategoryMarker(body){
      return String(body || '').replace(/^<!--gaji-category:(tips|mydeals)-->/, '').replace(/^\n+/, '');
    }

    function getCategoryLabel(category){
      return normalizeBoardCategory(category) === 'mydeals' ? '내가올린 핫딜' : '여러 가지 팁';
    }

    function syncCategoryTabs(){
      document.querySelectorAll('.board-tab').forEach(tab => {
        const active = tab.dataset.category === state.category;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });
    }

    function normalizePosts(posts){
      return (posts || []).map((post, idx) => ({
        id: String(post.id || `local-${idx}`),
        title: post.title || '제목 없음',
        body: stripBoardCategoryMarker(post.body || ''),
        category: normalizeBoardCategory(post.category || getBoardCategoryFromBody(post.body)),
        img: post.img || '',
        author: post.author || '익명',
        views: Number(post.views || 0),
        createdAt: post.createdAt || post.created_at || new Date().toISOString(),
        updatedAt: post.updatedAt || post.updated_at || '',
      }));
    }

    function readLocalPosts(){
      try{
        return normalizePosts(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
      }catch(_){
        return [];
      }
    }

    function saveLocalPosts(posts){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalizePosts(posts)));
    }

    function mergePosts(primary = [], secondary = []){
      const seen = new Set();
      return normalizePosts([...primary, ...secondary]).filter(post => {
        const key = String(post.id || '');
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function formatTime(value){
      return window.TimeFormat?.toRelativeKorean(value) || '';
    }

    function escapeHtml(text){
      if(window.TextFormat?.escapeHtml) return window.TextFormat.escapeHtml(text || '');
      return String(text || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function renderRichText(text){
      if(window.TextFormat?.markdownToHtml){
        return window.TextFormat.markdownToHtml(text || '');
      }
      return escapeHtml(text || '');
    }

    function renderExcerpt(text){
      return escapeHtml(String(text || '').replace(/\r\n?/g, '\n').replace(/\n+/g, ' '));
    }

    function setView(name){
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(`${name}View`).classList.add('active');
      const back = document.getElementById('backBtn');
      document.getElementById('searchToggle').style.display = name === 'list' ? 'grid' : 'none';
      document.getElementById('searchWrap').classList.remove('show');
      if(name === 'list'){
        back.style.display = 'none';
        back.href = 'board.html';
      }else{
        back.style.display = 'grid';
        back.href = 'board.html';
      }
    }

    function getFilteredPosts(){
      const kw = state.keyword.trim().toLowerCase();
      return state.posts.filter(post => {
        if(normalizeBoardCategory(post.category) !== state.category) return false;
        if(!kw) return true;
        return `${post.title} ${post.body} ${post.author}`.toLowerCase().includes(kw);
      });
    }

    function renderList(){
      const list = document.getElementById('list');
      const posts = getFilteredPosts();
      if(!posts.length){
        list.innerHTML = `<div class="empty-list">${getCategoryLabel(state.category)} 게시글이 없습니다.<br>첫 글을 남겨보세요.</div>`;
        return;
      }
      list.innerHTML = posts.map(post => `
        <a class="post" href="boarddetail.html?id=${encodeURIComponent(post.id)}">
          ${post.img ? `<img class="thumb" src="${post.img}" alt="">` : `<div class="thumb empty"><span class="material-symbols-outlined">article</span></div>`}
          <div>
            <div class="post-title">${escapeHtml(post.title)}</div>
            <div class="excerpt">${renderExcerpt(post.body || '내용 없음')}</div>
            <div class="meta">${getCategoryLabel(post.category)} · ${escapeHtml(post.author)} · ${formatTime(post.createdAt)}</div>
          </div>
        </a>
      `).join('');
    }

    async function loadPosts(){
      const local = readLocalPosts();
      state.posts = local;
      renderList();
      try{
        const res = await fetch(`${BOARD_API}?_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) throw new Error('api failed');
        const data = await res.json();
        const remote = normalizePosts(data.items || []);
        state.posts = mergePosts(remote, local);
        saveLocalPosts(state.posts);
        renderList();
      }catch(_){
        state.posts = local;
        renderList();
      }
    }

    async function loadPost(id){
      const cached = readLocalPosts().find(post => String(post.id) === String(id));
      if(cached) renderDetail(cached);
      try{
        const res = await fetch(`${BOARD_API}/${encodeURIComponent(id)}`, { cache:'no-store' });
        if(!res.ok) throw new Error('api failed');
        const data = await res.json();
        if(data.item) renderDetail(normalizePosts([data.item])[0]);
      }catch(_){
        if(!cached) renderDetail({ title:'게시글 없음', body:'게시글을 찾을 수 없습니다.', author:'', img:'', createdAt:'' });
      }
    }

    function renderDetail(post){
      setView('detail');
      document.getElementById('detailHero').innerHTML = post.img ? `<img src="${post.img}" alt="">` : `<img src="${FALLBACK_IMAGE}" alt="">`;
      document.getElementById('detailTitle').textContent = post.title || '제목 없음';
      document.getElementById('detailMeta').textContent = `${post.author || '익명'} · ${formatTime(post.createdAt)}`;
      document.getElementById('detailBody').innerHTML = renderRichText(post.body || '');
    }

    function readFileAsDataURL(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('read failed'));
        reader.readAsDataURL(file);
      });
    }

    function normalizeDealUrl(value){
      const raw = String(value || '').trim();
      if(!raw) return '';
      return /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
    }

    async function fetchLinkPreview(url){
      if(!url || state.previewUrl === url) return;
      state.previewUrl = url;
      try{
        const res = await fetch(`${LINK_PREVIEW_API}?url=${encodeURIComponent(url)}`);
        if(!res.ok) return;
        const data = await res.json();
        if(!data?.ok) return;

        const titleEl = document.getElementById('title');
        const bodyEl = document.getElementById('body');
        const photoPreview = document.getElementById('photoPreview');
        const photoButton = document.getElementById('photoButton');

        if(!titleEl.value.trim() && data.title) titleEl.value = data.title.trim();
        if(!bodyEl.value.trim() && data.description) bodyEl.value = data.description.trim();

        if(!state.selectedImage && !state.previewImage && data.image){
          state.previewImage = data.image;
          photoPreview.src = data.image;
          photoButton.classList.add('has-image');
        }
      }catch(_){ }
    }

    async function compressImageFile(file){
      const rawDataUrl = await readFileAsDataURL(file);
      const img = await new Promise((resolve, reject) => {
        const el = new Image();
        el.onload = () => resolve(el);
        el.onerror = () => reject(new Error('image decode failed'));
        el.src = rawDataUrl;
      });
      let maxSide = 960;
      let quality = 0.76;
      let result = rawDataUrl;
      for(let attempt = 0; attempt < 8; attempt += 1){
        const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
        const width = Math.max(1, Math.round(img.width * ratio));
        const height = Math.max(1, Math.round(img.height * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        result = canvas.toDataURL('image/jpeg', quality);
        if(result.length <= 50000) return result;
        if(quality > 0.42) quality = Math.max(0.42, quality - 0.07);
        else maxSide = Math.max(480, Math.round(maxSide * 0.88));
      }
      return result;
    }

    async function uploadImage(imageData){
      const res = await fetch('/api/upload-image', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ imageData, folder:'board' })
      });
      if(!res.ok) throw new Error('image upload failed');
      const data = await res.json();
      return data.url || '';
    }

    function bindForm(){
      const photoInput = document.getElementById('photoInput');
      const photoButton = document.getElementById('photoButton');
      const dealUrlInput = document.getElementById('dealUrl');
      let previewTimer = null;

      photoButton.addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if(!file || !file.type.startsWith('image/')) return;
        try{
          state.selectedImage = await compressImageFile(file);
          state.previewImage = '';
          document.getElementById('photoPreview').src = state.selectedImage;
          photoButton.classList.add('has-image');
        }catch(_){
          alert('이미지 처리에 실패했습니다.');
        }
      });

      const previewHandler = (delayMs = 1000) => {
        const normalized = normalizeDealUrl(dealUrlInput.value);
        if(!normalized){
          state.previewUrl = '';
          return;
        }
        if(previewTimer) clearTimeout(previewTimer);
        previewTimer = setTimeout(() => fetchLinkPreview(normalized), delayMs);
      };
      dealUrlInput.addEventListener('input', () => previewHandler(1000));
      dealUrlInput.addEventListener('blur', () => previewHandler(0));
      dealUrlInput.addEventListener('change', () => previewHandler(0));

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value.trim();
        const body = document.getElementById('body').value.trim();
        const sourceLink = normalizeDealUrl(dealUrlInput.value);
        if(!title) return;
        const btn = document.querySelector('.submit');
        btn.disabled = true;
        btn.textContent = '등록 중...';
        let img = state.previewImage || '';
        try{
          if(state.selectedImage){
            btn.textContent = '사진 업로드 중...';
            img = await uploadImage(state.selectedImage);
          }
        }catch(_){
          img = state.selectedImage || state.previewImage;
        }

        const post = { id:`local-${Date.now()}`, title, body, category:state.category, img, sourceLink, createdAt:new Date().toISOString() };
        try{
          const res = await fetch(BOARD_API, {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify(post)
          });
          if(!res.ok) throw new Error('api failed');
          const data = await res.json();
          const saved = normalizePosts([data.item || post])[0];
          const next = [saved, ...readLocalPosts().filter(v => String(v.id) !== String(saved.id))];
          saveLocalPosts(next);
          location.href = `boarddetail.html?id=${encodeURIComponent(saved.id)}`;
        }catch(_){
          alert('서버 저장에 실패했습니다. 잠시 후 다시 시도해주세요.');
          btn.disabled = false;
          btn.textContent = '작성 완료';
        }
      });
    }

    async function ensureLoggedInForWrite(){
      window.GajiIdentity?.getUser?.();
      return true;
    }

    function showLoginToast(){
      let toast = document.getElementById('loginToast');
      if(!toast){
        toast = document.createElement('div');
        toast.id = 'loginToast';
        toast.setAttribute('role', 'status');
        toast.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(12px);z-index:9999;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:999px;background:rgba(23,19,37,.92);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.01em;box-shadow:0 10px 26px rgba(17,24,39,.22);opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none;white-space:nowrap';
        document.body.appendChild(toast);
      }
      toast.textContent = '로그인을 해주세요';
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
      });
      clearTimeout(window.__loginToastTimer);
      window.__loginToastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(12px)';
      }, 1800);
    }

    function bindListControls(){
      document.getElementById('writeBtn').addEventListener('click', async () => {
        const ok = await ensureLoggedInForWrite();
        if(!ok) return;
        location.href = `boardcreate.html?category=${encodeURIComponent(state.category)}`;
      });
      document.querySelectorAll('.board-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          state.category = normalizeBoardCategory(tab.dataset.category);
          const params = new URLSearchParams(location.search);
          params.set('category', state.category);
          history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
          syncCategoryTabs();
          renderList();
        });
      });
      document.getElementById('searchToggle').addEventListener('click', () => {
        const wrap = document.getElementById('searchWrap');
        wrap.classList.toggle('show');
        if(wrap.classList.contains('show')) document.getElementById('searchInput').focus();
      });
      document.getElementById('searchInput').addEventListener('input', (e) => {
        state.keyword = e.target.value || '';
        renderList();
      });
    }

    function bindProfileChip(){
      const chip = document.getElementById('profileChip');
      const avatar = document.getElementById('profileAvatar');
      const name = document.getElementById('profileName');
      const modal = document.getElementById('nickModal');
      const cancel = document.getElementById('nickCancel');
      const confirm = document.getElementById('nickConfirm');
      const user = window.GajiIdentity?.getUser?.();
      const nickname = user?.nickname || window.GajiIdentity?.getNickname?.() || '익명 가지';
      if(name) name.textContent = nickname;
      if(avatar) avatar.src = window.GajiIdentity?.getAvatarUrl?.(nickname) || '';
      chip?.addEventListener('click', () => modal?.classList.add('show'));
      cancel?.addEventListener('click', () => modal?.classList.remove('show'));
      modal?.addEventListener('click', (e) => { if(e.target === modal) modal.classList.remove('show'); });
      confirm?.addEventListener('click', () => { location.href = 'nickname.html'; });
    }

    async function init(){
      bindForm();
      bindListControls();
      bindProfileChip();
      const params = new URLSearchParams(location.search);
      state.category = normalizeBoardCategory(params.get('category'));
      syncCategoryTabs();
      const id = params.get('id');
      if(id){
        location.replace(`boarddetail.html?id=${encodeURIComponent(id)}`);
        return;
      }
      setView('list');
      await loadPosts();
    }

    init();
  </script>
</body>
</html>
