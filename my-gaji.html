<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>내 가지</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@500');
    :root{--bg:#fff;--page:#f7f4ff;--text:#171325;--muted:#7c8594;--line:#eee9f8;--brand:#7c3aed;--brand-soft:#f3edff;--kakao:#fee500}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:500;font-style:normal;font-size:24px;line-height:1;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding:18px 18px 92px;background:#fff}
    .title{font-size:24px;font-weight:900;letter-spacing:-.04em;margin:10px 0 4px}
    .brand{color:var(--brand);font-weight:950;letter-spacing:-.08em}
    .lead{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.5;letter-spacing:-.02em}
    .panel{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff;box-shadow:0 10px 26px rgba(17,24,39,.05)}
    .profile{display:none;align-items:center;gap:12px}
    .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);font-weight:900}
    .name{font-size:18px;font-weight:900;letter-spacing:-.03em}
    .email{margin-top:3px;color:var(--muted);font-size:13px}
    .provider{margin-top:6px;color:var(--brand);font-size:12px;font-weight:800}
    .actions{display:grid;gap:10px;margin-top:16px}
    .login-btn,.logout-btn{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:850;letter-spacing:-.02em;text-decoration:none;color:var(--text);background:#fff;cursor:pointer}
    .login-btn.google{background:#fff}
    .login-btn.kakao{background:var(--kakao);border-color:var(--kakao)}
    .login-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
    .logout-btn{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
    .hint{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.5;letter-spacing:-.01em}
    .status{margin-top:14px;padding:12px;border-radius:12px;background:var(--brand-soft);color:#4c1d95;font-size:13px;font-weight:700;line-height:1.45;display:none}
    .section-title{margin:24px 0 10px;font-size:15px;font-weight:900;letter-spacing:-.02em}
    .placeholder{display:grid;gap:8px}
    .placeholder-row{height:48px;border-radius:12px;background:#faf8ff;border:1px solid var(--line);display:flex;align-items:center;padding:0 14px;color:var(--muted);font-size:14px;font-weight:700}
    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;height:64px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #ececf1;z-index:10}
    .bottom-nav-row{height:100%;display:grid;grid-template-columns:repeat(4,1fr)}
    .nav-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9ca3af;text-decoration:none;font-size:12px;font-weight:700}
    .nav-tab .material-symbols-outlined{font-size:24px}
    .nav-tab.active{color:var(--brand)}
    @media (min-width: 760px){
      body{background:var(--page)}
      .app{max-width:760px;margin:24px auto;padding:28px 28px 104px;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(17,24,39,.06)}
      .title{font-size:28px}
      .panel{padding:22px}
      .bottom-nav{max-width:760px;border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0}
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="title"><span class="brand">내 가지</span></h1>
    <p class="lead">웹과 앱에서 같은 계정으로 글쓰기, 알림, 저장한 핫딜을 이어서 사용할 수 있게 준비 중입니다.</p>

    <section class="panel" aria-label="로그인">
      <div id="loggedOut">
        <a class="login-btn kakao" id="kakaoLogin" href="/api/auth?action=start&provider=kakao">
          <span class="material-symbols-outlined" aria-hidden="true">chat_bubble</span>
          카카오톡으로 계속하기
        </a>
        <div style="height:10px"></div>
        <a class="login-btn google" id="googleLogin" href="/api/auth?action=start&provider=google">
          <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
          Google로 계속하기
        </a>
        <p class="hint">로그인은 웹에서 처리하고 Android 앱은 같은 웹 세션을 사용합니다.</p>
      </div>

      <div class="profile" id="loggedIn">
        <div class="avatar" id="avatarFallback">가</div>
        <img class="avatar" id="avatarImg" alt="" style="display:none" />
        <div>
          <div class="name" id="userName">사용자</div>
          <div class="email" id="userEmail"></div>
          <div class="provider" id="userProvider"></div>
        </div>
      </div>

      <div class="actions" id="accountActions" style="display:none">
        <button class="logout-btn" id="logoutBtn" type="button">로그아웃</button>
      </div>

      <div class="status" id="statusBox"></div>
    </section>

    <h2 class="section-title">내 활동</h2>
    <div class="placeholder">
      <div class="placeholder-row">내가 쓴 핫딜</div>
      <div class="placeholder-row">저장한 핫딜</div>
      <div class="placeholder-row">알림 설정</div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="하단 내비게이션">
    <div class="bottom-nav-row">
      <a class="nav-tab" href="index.html"><span class="material-symbols-outlined">home</span><span>홈</span></a>
      <a class="nav-tab" href="gajigaji.html"><span class="material-symbols-outlined">deployed_code</span><span>가지가지</span></a>
      <a class="nav-tab" href="chat.html"><span class="material-symbols-outlined">chat_bubble</span><span>채팅</span></a>
      <a class="nav-tab active" href="my-gaji.html" aria-current="page"><span class="material-symbols-outlined">person</span><span>내 가지</span></a>
    </div>
  </nav>

  <script>
    const statusBox = document.getElementById('statusBox');
    const googleLogin = document.getElementById('googleLogin');
    const kakaoLogin = document.getElementById('kakaoLogin');
    const loggedOut = document.getElementById('loggedOut');
    const loggedIn = document.getElementById('loggedIn');
    const accountActions = document.getElementById('accountActions');
    const logoutBtn = document.getElementById('logoutBtn');

    function showStatus(message){
      if(!message){ statusBox.style.display = 'none'; return; }
      statusBox.textContent = message;
      statusBox.style.display = 'block';
    }

    function disableLogin(anchor, reason){
      anchor.setAttribute('aria-disabled', 'true');
      anchor.addEventListener('click', (event) => {
        event.preventDefault();
        showStatus(reason);
      });
    }

    async function loadConfig(){
      try{
        const res = await fetch('/api/auth?action=config');
        if(!res.ok) throw new Error('config');
        const data = await res.json();
        if(!data.providers?.session){
          disableLogin(googleLogin, 'AUTH_SESSION_SECRET 설정이 필요합니다.');
          disableLogin(kakaoLogin, 'AUTH_SESSION_SECRET 설정이 필요합니다.');
          showStatus('Vercel 환경 변수 설정 후 로그인을 사용할 수 있습니다.');
          return;
        }
        if(!data.providers?.google) disableLogin(googleLogin, 'GOOGLE_CLIENT_ID와 GOOGLE_CLIENT_SECRET 설정이 필요합니다.');
        if(!data.providers?.kakao) disableLogin(kakaoLogin, 'KAKAO_REST_API_KEY 설정이 필요합니다.');
      }catch(_){
        disableLogin(googleLogin, '로컬 정적 서버에서는 API 로그인을 확인할 수 없습니다. Vercel 배포 또는 vercel dev에서 확인해주세요.');
        disableLogin(kakaoLogin, '로컬 정적 서버에서는 API 로그인을 확인할 수 없습니다. Vercel 배포 또는 vercel dev에서 확인해주세요.');
      }
    }

    async function loadMe(){
      try{
        const res = await fetch('/api/auth?action=me');
        if(!res.ok) return;
        const data = await res.json();
        if(!data.user) return;
        loggedOut.style.display = 'none';
        loggedIn.style.display = 'flex';
        accountActions.style.display = 'grid';
        document.getElementById('userName').textContent = data.user.name || '사용자';
        document.getElementById('userEmail').textContent = data.user.email || '';
        document.getElementById('userProvider').textContent = data.user.provider === 'kakao' ? '카카오톡 로그인' : 'Google 로그인';
        if(data.user.avatar){
          const img = document.getElementById('avatarImg');
          img.src = data.user.avatar;
          img.style.display = 'block';
          document.getElementById('avatarFallback').style.display = 'none';
        }
      }catch(_){}
    }

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth?action=logout', { method:'POST' });
      location.href = 'my-gaji.html';
    });

    const params = new URLSearchParams(location.search);
    if(params.get('login_error')) showStatus(`로그인 실패: ${params.get('login_error')}`);
    if(params.get('login') === 'success') showStatus('로그인되었습니다.');

    loadConfig();
    loadMe();
  </script>
</body>
</html>
