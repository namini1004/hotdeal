<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>내 가지</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    :root{--bg:#fff;--page:#f7f4ff;--text:#171325;--muted:#7c8594;--line:#eee9f8;--brand:#7c3aed;--brand-soft:#f3edff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding:22px 18px;background:#fff}
    .title{font-size:24px;font-weight:900;letter-spacing:-.04em;margin:10px 0 18px}
    .brand{color:var(--brand);font-weight:950;letter-spacing:-.08em}
    .panel{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff;box-shadow:0 10px 26px rgba(17,24,39,.05)}
    .profile{display:none;align-items:center;gap:12px}
    .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);font-weight:900}
    .name{font-size:18px;font-weight:900;letter-spacing:-.03em}
    .email{margin-top:3px;color:var(--muted);font-size:13px}
    .provider{margin-top:6px;color:var(--brand);font-size:12px;font-weight:800}
    .actions{display:grid;gap:10px;margin-top:16px}
    .google-btn,.logout-btn{width:100%;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:800;letter-spacing:-.01em;text-decoration:none;cursor:pointer}
    .google-btn{border:1px solid #dadce0;background:#fff;color:#3c4043;box-shadow:0 1px 2px rgba(60,64,67,.08)}
    .google-btn:active{background:#f8fafd}
    .google-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
    .google-icon{width:20px;height:20px;display:block}
    .logout-btn{border:none;background:var(--brand-soft);color:var(--brand)}
    .hint{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.55;letter-spacing:-.01em;text-align:center}
    .status{margin-top:14px;padding:12px;border-radius:12px;background:var(--brand-soft);color:#4c1d95;font-size:13px;font-weight:700;line-height:1.45;display:none}
    .panel.loading #loggedOut,.panel.loading #loggedIn,.panel.loading #accountActions{display:none!important}
    @media (min-width: 760px){
      body{background:var(--page)}
      .app{max-width:760px;margin:24px auto;padding:28px;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(17,24,39,.06)}
      .title{font-size:28px}
      .panel{padding:22px}
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="title"><span class="brand">내 가지</span></h1>

    <section class="panel loading" id="accountPanel" aria-label="Google 로그인">
      <div id="loggedOut">
        <a class="google-btn" id="googleLogin" href="/api/auth?action=start&provider=google">
          <img class="google-icon" src="assets/google-g.svg" alt="" />
          <span>Google로 계속하기</span>
        </a>
        <p class="hint">로그인을 하면 글작성 및 저장, 채팅방 입장이 가능합니다.</p>
      </div>

      <div class="profile" id="loggedIn">
        <div class="avatar" id="avatarFallback">가</div>
        <img class="avatar" id="avatarImg" alt="" style="display:none" />
        <div>
          <div class="name" id="userName">사용자</div>
          <div class="email" id="userEmail"></div>
          <div class="provider" id="userProvider">Google 로그인</div>
        </div>
      </div>

      <div class="actions" id="accountActions" style="display:none">
        <button class="logout-btn" id="logoutBtn" type="button">로그아웃</button>
      </div>

      <div class="status" id="statusBox"></div>
    </section>
  </main>

  <script>
    const USER_CACHE_KEY = 'gaji_auth_user_cache_v1';
    const statusBox = document.getElementById('statusBox');
    const accountPanel = document.getElementById('accountPanel');
    const googleLogin = document.getElementById('googleLogin');
    const loggedOut = document.getElementById('loggedOut');
    const loggedIn = document.getElementById('loggedIn');
    const accountActions = document.getElementById('accountActions');
    const logoutBtn = document.getElementById('logoutBtn');

    function showStatus(message){
      if(!message){ statusBox.style.display = 'none'; return; }
      statusBox.textContent = message;
      statusBox.style.display = 'block';
    }

    function disableLogin(anchor, reason){
      anchor.setAttribute('aria-disabled', 'true');
      anchor.addEventListener('click', (event) => {
        event.preventDefault();
        showStatus(reason);
      });
    }

    function setLoading(loading){
      if(loading){ accountPanel.classList.add('loading'); return; }
      accountPanel.classList.remove('loading');
    }

    function clearAvatar(){
      const img = document.getElementById('avatarImg');
      img.removeAttribute('src');
      img.style.display = 'none';
      document.getElementById('avatarFallback').style.display = 'grid';
    }

    function renderLoggedOut(){
      loggedOut.style.display = 'block';
      loggedIn.style.display = 'none';
      accountActions.style.display = 'none';
      clearAvatar();
      try{ localStorage.removeItem(USER_CACHE_KEY); }catch(_){ }
    }

    function renderLoggedIn(user){
      if(!user) return renderLoggedOut();
      loggedOut.style.display = 'none';
      loggedIn.style.display = 'flex';
      accountActions.style.display = 'grid';
      document.getElementById('userName').textContent = user.name || '사용자';
      document.getElementById('userEmail').textContent = user.email || '';
      document.getElementById('userProvider').textContent = user.provider === 'google' ? 'Google 로그인' : '로그인됨';
      const fallbackText = (user.name || user.email || '가').trim().charAt(0) || '가';
      document.getElementById('avatarFallback').textContent = fallbackText;
      if(user.avatar){
        const img = document.getElementById('avatarImg');
        img.src = user.avatar;
        img.style.display = 'block';
        document.getElementById('avatarFallback').style.display = 'none';
      }else{
        clearAvatar();
      }
      try{ localStorage.setItem(USER_CACHE_KEY, JSON.stringify(user)); }catch(_){ }
    }

    function loadCachedUser(){
      try{
        const cached = JSON.parse(localStorage.getItem(USER_CACHE_KEY) || 'null');
        if(cached && typeof cached === 'object') return cached;
      }catch(_){ }
      return null;
    }

    async function loadConfig(){
      try{
        const res = await fetch('/api/auth?action=config');
        if(!res.ok) throw new Error('config');
        const data = await res.json();
        if(!data.providers?.session){
          disableLogin(googleLogin, 'AUTH_SESSION_SECRET 설정이 필요합니다.');
          showStatus('Vercel 환경 변수 설정 후 Google 로그인을 사용할 수 있습니다.');
          return;
        }
        if(!data.providers?.google) disableLogin(googleLogin, 'GOOGLE_CLIENT_ID와 GOOGLE_CLIENT_SECRET 설정이 필요합니다.');
      }catch(_){
        disableLogin(googleLogin, '정적 로컬 서버에서는 API 로그인을 확인할 수 없습니다. Vercel 배포 또는 vercel dev에서 확인해주세요.');
      }
    }

    async function loadMe(){
      try{
        const res = await fetch(`/api/auth?action=me&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) return false;
        const data = await res.json();
        if(data.user){
          renderLoggedIn(data.user);
          return true;
        }
        renderLoggedOut();
        return false;
      }catch(_){
        return false;
      }finally{
        setLoading(false);
      }
    }

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth?action=logout', { method:'POST', credentials:'include', cache:'no-store' });
      try{ localStorage.removeItem(USER_CACHE_KEY); }catch(_){ }
      location.href = 'my-gaji.html';
    });

    const params = new URLSearchParams(location.search);
    if(params.get('login_error')) showStatus(`로그인 실패: ${params.get('login_error')}`);
    if(params.get('login') === 'success') showStatus('로그인되었습니다.');

    const cachedUser = loadCachedUser();
    if(cachedUser){
      renderLoggedIn(cachedUser);
      setLoading(false);
    }

    loadConfig();
    loadMe();
  </script>
</body>
</html>
