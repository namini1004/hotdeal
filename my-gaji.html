<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta name="apple-mobile-web-app-title" content="가지딜" />
  <title>내 가지</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    :root{--bg:#fff;--page:#fff;--ink:#171325;--muted:#747c8b;--line:#eee9f8;--brand:#7c3aed;--brand-deep:#4c1d95;--brand-soft:#f3edff;--card:#fff;--shadow:0 18px 50px rgba(42,25,82,.09)}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .shell{width:min(720px,100%);min-height:100vh;margin:0 auto;padding:0 16px 48px;background:#fff}
    .topbar{height:56px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 -16px 14px;padding:0 16px 0 0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
    .brandmark{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:950;letter-spacing:-.04em;font-size:24px}

    .brand-icon img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.16))}
    .brand-word{color:var(--brand);letter-spacing:-.08em}.title-rest{color:var(--ink);letter-spacing:-.045em;margin-left:1px}
    .top-actions{display:none}
    .desktop-nav{display:none;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.76);box-shadow:0 10px 30px rgba(42,25,82,.05)}
    .desktop-nav a{height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:999px;color:#667085;text-decoration:none;font-size:13px;font-weight:850;letter-spacing:-.01em}
    .desktop-nav a.active{background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(124,58,237,.22)}
    .nav-ico{font-size:16px;line-height:1}.nav-eggplant{width:17px;height:17px;display:block}
    .profile-chip{height:34px;max-width:128px;display:flex;align-items:center;gap:7px;border:none;border-radius:999px;background:#fff;color:#2d2438;padding:0 9px 0 4px;cursor:pointer;box-shadow:0 8px 22px rgba(42,25,82,.06)}
    .profile-avatar{width:26px;height:26px;border-radius:999px;display:block;object-fit:cover;flex:0 0 auto}.profile-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900;letter-spacing:-.02em}
    .nick-modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.38);display:none;place-items:center;z-index:80;padding:18px}.nick-modal-backdrop.show{display:grid}.nick-modal{width:min(320px,100%);background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 18px 60px rgba(17,24,39,.24);text-align:center}.nick-modal-title{font-size:17px;font-weight:950;letter-spacing:-.03em}.nick-modal-body{margin-top:8px;color:#667085;font-size:14px;line-height:1.45}.nick-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.nick-modal-btn{height:44px;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer}.nick-modal-btn.cancel{background:#f4f6f8;color:#374151}.nick-modal-btn.confirm{background:var(--brand);color:#fff}
    .layout{display:grid;gap:14px}
    .account-card,.menu-card,.setting-card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 34px rgba(42,25,82,.055)}
    .account-card{min-height:242px;padding:24px;background:linear-gradient(135deg,#7c3aed 0%,#4c1d95 100%);color:#fff;border:none;box-shadow:0 22px 54px rgba(76,29,149,.28);display:flex;flex-direction:column;justify-content:center}
    .account-card .card-sub,.account-card .hint{color:rgba(255,255,255,.78)}
    .account-card .status{background:rgba(255,255,255,.14);color:#fff}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .card-title{font-size:17px;font-weight:950;letter-spacing:-.025em}.card-sub{margin-top:4px;color:var(--muted);font-size:13px;font-weight:650;line-height:1.45}
    .profile{display:none;align-items:center;gap:13px;padding:4px 0 2px}
    .avatar{width:58px;height:58px;border-radius:20px;object-fit:cover;background:linear-gradient(135deg,#f3edff,#fff);display:grid;place-items:center;color:var(--brand);font-size:22px;font-weight:950;border:1px solid #eadfff}
    .name{font-size:18px;font-weight:950;letter-spacing:-.025em}.email{margin-top:4px;color:var(--muted);font-size:12px}.provider{margin-top:7px;display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-deep);font-size:11px;font-weight:900}
    .actions{display:grid;gap:10px;margin-top:16px}
    .google-btn,.logout-btn{width:100%;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:950;letter-spacing:-.01em;text-decoration:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
    .google-btn{border:1px solid rgba(255,255,255,.55);background:#fff;color:#4c1d95;box-shadow:0 12px 28px rgba(42,25,82,.18)}
    .google-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(60,64,67,.12)}.google-btn:active{transform:translateY(0);background:#f8fafd}
    .google-btn[aria-disabled="true"]{opacity:.45;pointer-events:none}.google-icon{width:20px;height:20px;display:block}
    .logout-btn{border:none;background:rgba(255,255,255,.16);color:#fff}
    .hint{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.58;letter-spacing:-.01em;text-align:center}
    .status{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--brand-soft);color:var(--brand-deep);font-size:13px;font-weight:850;line-height:1.45;display:none}
    .panel.loading #loggedIn,.panel.loading #accountActions{display:none!important}
    .menu-grid{display:grid;gap:10px}
    .menu-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;text-decoration:none;color:inherit}
    .admin-menu-card{display:none}
    .admin-menu-card.show{display:flex}
    .menu-left{display:flex;align-items:center;gap:12px;min-width:0}.menu-icon{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep);font-size:20px;font-weight:950;flex:0 0 auto}.menu-icon.profile-menu-avatar{object-fit:cover;background:#fff}.menu-copy{min-width:0}
    .fav-card-title,.nickname-card-name{font-size:16px;font-weight:950;letter-spacing:-.02em}.nickname-card-label{font-size:11px;color:#9aa2b1;font-weight:850;letter-spacing:-.01em}.fav-card-desc,.nickname-card-help{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.42}.fav-card-arrow{font-size:24px;color:#a6adba;font-weight:900}
    .setting-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px}.read-toggle-label{font-size:14px;font-weight:900;color:#374151;letter-spacing:-.01em}.read-toggle-help{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.42}.switch{position:relative;width:48px;height:30px;display:inline-block;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;inset:0;background:#d1d5db;border-radius:999px;transition:.2s}.slider:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.switch input:checked + .slider{background:var(--brand)}.switch input:checked + .slider:before{transform:translateX(18px)}
    @media (min-width:768px){.shell{padding:0 20px 56px}.desktop-nav{display:none}.topbar{margin-bottom:22px}.profile-chip{display:none}.profile-avatar{width:28px;height:28px}.layout{grid-template-columns:minmax(340px,420px) minmax(0,1fr);align-items:start}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.account-card,.menu-card,.setting-card{border-radius:26px}.account-card{position:sticky;top:28px;min-height:242px;padding:28px}.menu-card,.setting-card{min-height:116px;padding:18px}}

    .settings-heading{display:flex;align-items:center;gap:10px;min-width:0}
    .settings-heading h1{margin:0;font-size:22px;line-height:1;font-weight:950;letter-spacing:-.04em}
    .back-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;background:#fff;border:1px solid transparent;color:#171325;text-decoration:none;font-size:30px;font-weight:700;line-height:1;transform:translateY(-1px)}.back-btn:active{background:#f4f6f8;border-color:var(--line)}
    .layout{max-width:720px;margin:0 auto}
    .account-card{min-height:124px;padding:16px 18px;border-radius:18px;box-shadow:0 14px 34px rgba(76,29,149,.2)}
    .account-card .card-head{margin-bottom:10px}.account-card .card-title{font-size:16px}.account-card .card-sub,.account-card .hint{display:none}
    .google-btn,.logout-btn{height:44px;border-radius:14px;font-size:14px}.google-icon{width:18px;height:18px}
    .profile{gap:10px}.avatar{width:44px;height:44px;border-radius:15px;font-size:18px}.name{font-size:16px}.email{font-size:11px}.provider{margin-top:5px;padding:4px 8px;font-size:10px}
    .actions{margin-top:10px}.status{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:12px}
    .menu-grid{display:grid;gap:8px}.menu-card,.setting-card{min-height:58px;padding:11px 14px;border-radius:14px;box-shadow:0 8px 22px rgba(42,25,82,.045)}
    .menu-icon{width:34px;height:34px;border-radius:12px;font-size:15px}.menu-left{gap:10px}.fav-card-title,.nickname-card-name,.read-toggle-label{font-size:14px}.nickname-card-label{display:none}.fav-card-desc,.nickname-card-help,.read-toggle-help{display:none}.fav-card-arrow{font-size:20px}.switch{width:42px;height:26px}.slider:before{width:20px;height:20px}.switch input:checked + .slider:before{transform:translateX(16px)}
    @media (min-width:768px){.shell{padding:0 20px 56px}.desktop-nav{display:none}.topbar{margin-bottom:18px}.profile-chip{display:none}.profile-avatar{width:28px;height:28px}.layout{grid-template-columns:1fr;align-items:start}.menu-grid{grid-template-columns:1fr}.account-card{position:static;top:auto;min-height:124px;padding:18px}.menu-card,.setting-card{min-height:58px;padding:12px 14px;border-radius:14px}}
  </style>
  <script src="assets/theme.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="settings-heading"><a class="back-btn" href="index.html" aria-label="뒤로가기">‹</a><h1>설정</h1></div>
    </header>

    <main class="layout">
      <section class="account-card panel loading" id="accountPanel" aria-label="Google 로그인">
        <div class="card-head" id="accountIntro">
          <div>
            <div class="card-title">계정</div>
            <div class="card-sub">게스트 닉네임으로 바로 활동하거나 Google 계정을 연결할 수 있어요.</div>
          </div>
        </div>
        <div id="loggedOut">
          <a class="google-btn" id="googleLogin" href="/api/auth?action=start&provider=google">
            <img class="google-icon" src="assets/google-g.svg" alt="" />
            <span>Google로 계속하기</span>
          </a>
          <p class="hint">웹에서는 별도 앱 탭 대신 이 화면에서 계정 기능을 바로 관리합니다.</p>
        </div>

        <div class="profile" id="loggedIn">
          <div class="avatar" id="avatarFallback">가</div>
          <img class="avatar" id="avatarImg" alt="" style="display:none" />
          <div>
            <div class="name" id="userName">사용자</div>
            <div class="email" id="userEmail"></div>
            <div class="provider" id="userProvider">Google 로그인</div>
          </div>
        </div>

        <div class="actions" id="accountActions" style="display:none">
          <button class="logout-btn" id="logoutBtn" type="button">로그아웃</button>
        </div>

        <div class="status" id="statusBox"></div>
      </section>

      <section class="menu-grid" aria-label="내 가지 메뉴">
        <a class="menu-card" id="nicknameCard" href="nickname.html" aria-label="닉네임 설정">
          <div class="menu-left">
            <img class="menu-icon profile-menu-avatar" id="nicknameMenuAvatar" alt="" aria-hidden="true">
            <div class="menu-copy">
              <div class="fav-card-title">닉네임변경</div>
              <div class="fav-card-desc">닉네임과 프로필을 관리합니다.</div>
            </div>
          </div>
          <span class="fav-card-arrow">›</span>
        </a>

        <a class="menu-card" id="keywordCard" href="keywords.html" aria-label="관심 키워드 관리">
          <div class="menu-left">
            <span class="menu-icon">🔔</span>
            <div class="menu-copy">
              <div class="fav-card-title">관심 키워드 알림</div>
              <div class="fav-card-desc">원하는 단어를 등록하면 딜 업로드 시 푸시로 알려드려요.</div>
            </div>
          </div>
          <span class="fav-card-arrow">›</span>
        </a>

        <a class="menu-card" id="favoritesCard" href="favorites.html" aria-label="내가 찜한 가지 보기">
          <div class="menu-left">
            <span class="menu-icon">♥</span>
            <div class="menu-copy">
              <div class="fav-card-title">내가 찜한 가지</div>
              <div class="fav-card-desc">저장한 딜을 한 번에 모아봐요.</div>
            </div>
          </div>
          <span class="fav-card-arrow">›</span>
        </a>

        <a class="menu-card admin-menu-card" id="adminCard" href="admin.html" aria-label="관리자 페이지로 이동">
          <div class="menu-left">
            <span class="menu-icon">⚙</span>
            <div class="menu-copy">
              <div class="fav-card-title">관리자 메뉴</div>
              <div class="fav-card-desc">게시글, 회원, 댓글, 신고, 공지를 관리합니다.</div>
            </div>
          </div>
          <span class="fav-card-arrow">›</span>
        </a>
      </section>
    </main>
  </div>

  <script src="assets/anonymous-identity.js?v=20260607"></script>
  <div class="nick-modal-backdrop" id="nickModal" role="dialog" aria-modal="true" aria-labelledby="nickModalTitle">
    <div class="nick-modal">
      <div class="nick-modal-title" id="nickModalTitle">닉네임을 변경할까요?</div>
      <div class="nick-modal-body">내 가지의 닉네임 설정 화면으로 이동합니다.</div>
      <div class="nick-modal-actions">
        <button class="nick-modal-btn cancel" id="nickCancel" type="button">취소</button>
        <button class="nick-modal-btn confirm" id="nickConfirm" type="button">확인</button>
      </div>
    </div>
  </div>
  <script>
    const USER_CACHE_KEY = 'gaji_auth_user_cache_v1';
    const READ_HIGHLIGHT_TOGGLE_KEY = 'hotdeal_read_highlight_enabled_v1';
    const ADMIN_EMAIL = 'namini1004@gmail.com';
    const statusBox = document.getElementById('statusBox');
    const accountPanel = document.getElementById('accountPanel');
    const googleLogin = document.getElementById('googleLogin');
    const loggedOut = document.getElementById('loggedOut');
    const loggedIn = document.getElementById('loggedIn');
    const accountActions = document.getElementById('accountActions');
    const accountIntro = document.getElementById('accountIntro');
    const logoutBtn = document.getElementById('logoutBtn');

    function showStatus(message){
      if(!message){ statusBox.style.display = 'none'; return; }
      statusBox.textContent = message;
      statusBox.style.display = 'block';
    }

    function disableLogin(anchor, reason){
      anchor.setAttribute('aria-disabled', 'true');
      anchor.addEventListener('click', (event) => {
        event.preventDefault();
        showStatus(reason);
      });
    }

    function goGoogleLogin(returnTo = 'keywords.html'){
      const target = `/api/auth?action=start&provider=google&return_to=${encodeURIComponent(returnTo)}`;
      location.href = target;
    }

    function bindKeywordLoginGate(){
      const card = document.getElementById('keywordCard');
      if(!card) return;
      card.addEventListener('click', (event) => {
        const user = loadCachedUser() || window.GajiIdentity?.getUser?.();
        if(user && !user.anonymous && user.provider === 'google') return;
        event.preventDefault();
        showStatus('관심 키워드 알림은 푸시 발송을 위해 Google 로그인이 필요합니다.');
        setTimeout(() => goGoogleLogin('keywords.html'), 450);
      });
    }

    function setLoading(loading){
      if(loading){ accountPanel.classList.add('loading'); return; }
      accountPanel.classList.remove('loading');
    }

    function clearAvatar(){
      const img = document.getElementById('avatarImg');
      img.removeAttribute('src');
      img.style.display = 'none';
      document.getElementById('avatarFallback').style.display = 'grid';
    }

    function nicknameForDisplay(){
      return window.GajiIdentity?.getNickname?.() || '익명 가지';
    }

    function updateNicknameSurfaces(user = loadCachedUser()){
      const nickname = nicknameForDisplay();
      const avatarUrl = window.GajiIdentity?.getAvatarUrl?.(nickname) || '';
      const displayAvatar = String(user?.avatar || '').trim() || avatarUrl;
      const profileName = document.getElementById('profileName');
      const profileAvatar = document.getElementById('profileAvatar');
      const nicknameMenuAvatar = document.getElementById('nicknameMenuAvatar');
      if(profileName) profileName.textContent = nickname;
      if(profileAvatar) profileAvatar.src = displayAvatar;
      if(nicknameMenuAvatar) nicknameMenuAvatar.src = displayAvatar;
    }

    function isAdminUser(user){
      return String(user?.email || '').trim().toLowerCase() === ADMIN_EMAIL;
    }

    function updateAdminMenu(user){
      const card = document.getElementById('adminCard');
      if(!card) return;
      card.classList.toggle('show', isAdminUser(user));
    }

    function accountDisplayName(user){
      if(!user || user.anonymous){
        const nickname = String(user?.nickname || window.GajiIdentity?.getNickname?.() || '').trim();
        return nickname || '익명 가지';
      }
      const realName = String(user.name || '').trim();
      if(realName) return realName;
      const emailName = String(user.email || '').split('@')[0].trim();
      return emailName || 'Google 사용자';
    }


    function renderLoggedOut(){
      loggedOut.style.display = 'block';
      loggedIn.style.display = 'none';
      accountActions.style.display = 'none';
      if(accountIntro) accountIntro.style.display = 'block';
      clearAvatar();
      try{ localStorage.removeItem(USER_CACHE_KEY); }catch(_){ }
      updateNicknameSurfaces(window.GajiIdentity?.getUser?.());
      updateAdminMenu(null);
    }

    function renderLoggedIn(user){
      if(!user) return renderLoggedOut();
      loggedOut.style.display = user.anonymous ? 'block' : 'none';
      loggedIn.style.display = user.anonymous ? 'none' : 'flex';
      accountActions.style.display = user.anonymous ? 'none' : 'grid';
      if(accountIntro){
        accountIntro.style.display = user.anonymous ? 'block' : 'none';
        if(!user.anonymous) accountIntro.style.display = 'none';
      }
      const displayName = accountDisplayName(user);
      document.getElementById('userName').textContent = displayName;
      document.getElementById('userEmail').textContent = user.email || '';
      document.getElementById('userProvider').textContent = user.anonymous ? '익명 기기 인증' : (user.provider === 'google' ? 'Google 로그인' : '로그인됨');
      const fallbackText = (displayName || user.email || 'G').trim().charAt(0) || 'G';
      document.getElementById('avatarFallback').textContent = fallbackText;
      const accountAvatar = String(user.avatar || '').trim();
      if(accountAvatar){
        const img = document.getElementById('avatarImg');
        img.src = accountAvatar;
        img.style.display = 'block';
        document.getElementById('avatarFallback').style.display = 'none';
      }else{
        clearAvatar();
      }
      try{ localStorage.setItem(USER_CACHE_KEY, JSON.stringify(user)); }catch(_){ }
      updateNicknameSurfaces(user);
      updateAdminMenu(user);
    }

    function loadCachedUser(){
      try{
        const cached = JSON.parse(localStorage.getItem(USER_CACHE_KEY) || 'null');
        if(cached && typeof cached === 'object') return cached;
      }catch(_){ }
      return null;
    }

    async function loadConfig(){
      try{
        const res = await fetch('/api/auth?action=config');
        if(!res.ok) throw new Error('config');
        const data = await res.json();
        if(!data.providers?.session){
          disableLogin(googleLogin, 'AUTH_SESSION_SECRET 설정이 필요합니다.');
          showStatus('Vercel 환경 변수 설정 후 Google 로그인을 사용할 수 있습니다.');
          return;
        }
        if(!data.providers?.google) disableLogin(googleLogin, 'GOOGLE_CLIENT_ID와 GOOGLE_CLIENT_SECRET 설정이 필요합니다.');
      }catch(_){
        disableLogin(googleLogin, '정적 로컬 서버에서는 API 로그인을 확인할 수 없습니다. Vercel 배포 또는 vercel dev에서 확인해주세요.');
      }
    }

    async function loadMe(){
      try{
        const res = await fetch(`/api/auth?action=me&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) return false;
        const data = await res.json();
        if(data.user){
          renderLoggedIn(data.user);
          return true;
        }
        renderLoggedOut();
        return false;
      }catch(_){
        return false;
      }finally{
        setLoading(false);
      }
    }

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth?action=logout', { method:'POST', credentials:'include', cache:'no-store' });
      try{ localStorage.removeItem(USER_CACHE_KEY); }catch(_){ }
      location.href = 'my-gaji.html';
    });

    const params = new URLSearchParams(location.search);
    if(params.get('login_error')) showStatus(`로그인 실패: ${params.get('login_error')}`);
    if(params.get('login') === 'success') showStatus('로그인되었습니다.');

    function notifyReadHighlightPreferenceChanged(){
      try{
        const channel = new BroadcastChannel('gaji_read_highlight_pref_v1');
        channel.postMessage({ enabled: localStorage.getItem(READ_HIGHLIGHT_TOGGLE_KEY) === '1' });
        channel.close();
      }catch(_){ }
      try{
        window.dispatchEvent(new CustomEvent('gaji:read-highlight-pref', { detail:{ enabled: localStorage.getItem(READ_HIGHLIGHT_TOGGLE_KEY) === '1' } }));
      }catch(_){ }
    }

    function initReadHighlightToggle(){
      const toggle = document.getElementById('readHighlightToggle');
      if(!toggle) return;
      toggle.checked = localStorage.getItem(READ_HIGHLIGHT_TOGGLE_KEY) === '1';
      toggle.addEventListener('change', () => {
        localStorage.setItem(READ_HIGHLIGHT_TOGGLE_KEY, toggle.checked ? '1' : '0');
        notifyReadHighlightPreferenceChanged();
      });
    }

    function initDarkModeToggle(){
      const toggle = document.getElementById('darkModeToggle');
      if(!toggle) return;
      toggle.checked = window.GajiTheme?.getMode?.() === 'dark';
      toggle.addEventListener('change', () => {
        window.GajiTheme?.apply?.(toggle.checked ? 'dark' : 'light');
      });
      window.addEventListener('gaji:theme-change', (event) => {
        toggle.checked = event.detail?.mode === 'dark';
      });
    }

    function bindProfileChip(){
      const chip = document.getElementById('profileChip');
      const modal = document.getElementById('nickModal');
      const cancel = document.getElementById('nickCancel');
      const confirm = document.getElementById('nickConfirm');
      updateNicknameSurfaces(loadCachedUser() || window.GajiIdentity?.getUser?.());
      chip?.addEventListener('click', () => modal?.classList.add('show'));
      cancel?.addEventListener('click', () => modal?.classList.remove('show'));
      modal?.addEventListener('click', (event) => {
        if(event.target === modal) modal.classList.remove('show');
      });
      confirm?.addEventListener('click', () => { location.href = 'nickname.html'; });
    }

    const cachedUser = loadCachedUser();
    if(cachedUser){
      renderLoggedIn(cachedUser);
      setLoading(false);
    }

    loadConfig();
    bindProfileChip();
    bindKeywordLoginGate();
    loadMe();
    window.addEventListener('pageshow', () => loadMe());
    window.addEventListener('focus', () => loadMe());
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => undefined);
      });
    }
  </script>
</body>
</html>
