<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="가지딜" />
  <title>내가 찜한 가지</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    :root{--line:#eee9f8;--brand:#7c3aed;--muted:#8b95a1}
    *{box-sizing:border-box} body{margin:0;font-family:'Pretendard Variable',Pretendard,sans-serif;background:#fff;color:#111827}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding:16px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .back{width:36px;height:36px;border:1px solid #e5e7eb;border-radius:999px;display:grid;place-items:center;text-decoration:none;color:#111827}
    .title{font-size:20px;font-weight:700;letter-spacing:-.02em}
    .item{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
    .thumb-wrap{position:relative}.thumb{width:90px;height:90px;border-radius:12px;object-fit:cover;background:#f3f4f6}
    .fav{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:999px;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#ef4444;font-size:13px}
    .item-title{font-size:15px;font-weight:500;line-height:1.4;letter-spacing:-.015em}
    .meta{margin-top:4px;font-size:11px;color:var(--muted)} .price{margin-top:6px;font-size:15px;font-weight:700}
    .empty{padding:40px 8px;color:#6b7280}
  </style>
  <script src="assets/theme.js"></script>
</head>
<body>
  <main class="app">
    <div class="top"><a class="back" href="my-gaji.html">←</a><div class="title">내가 찜한 가지</div></div>
    <div id="list"></div>
  </main>
  <script src="assets/anonymous-identity.js?v=20260607"></script>
  <script>
    const STORAGE_KEY='hotdeal_items_v3';
    const USER_CACHE_KEY='gaji_auth_user_cache_v1';
    const FALLBACK='assets/gaji-eggplant.jpg';
    function getUser(){ try{return JSON.parse(localStorage.getItem(USER_CACHE_KEY)||'null')}catch(_){return null} }
    function getDealKey(item){ if(item?.sourceLink) return item.sourceLink; if(item?.id) return `id:${item.id}:${item.date||''}`; return `title:${item?.title||''}:${item?.date||''}`; }
    function getFavorites(){ const u=getUser(); const k=`hotdeal_favorites_${u?.id||u?.email||'guest'}`; try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'))}catch(_){return new Set()} }
    function setFavorites(keys){ const u=getUser(); if(!u) return; const k=`hotdeal_favorites_${u?.id||u?.email||'guest'}`; localStorage.setItem(k, JSON.stringify(keys||[])); }
    function getItems(){ try{ const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); return Array.isArray(p)?p:[]; }catch(_){ return []; } }
    async function fetchItems(){ try{ const r=await fetch('/api/deals?scope=all',{credentials:'include',cache:'no-store'}); if(!r.ok) return []; const d=await r.json(); if(Array.isArray(d.items)){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d.items)); return d.items; } }catch(_){ } return []; }
    async function loadMe(){ try{const r=await fetch(`/api/auth?action=me&_ts=${Date.now()}`,{credentials:'include',cache:'no-store'}); if(!r.ok) return null; const d=await r.json(); if(d.user) localStorage.setItem(USER_CACHE_KEY, JSON.stringify(d.user)); return d.user||null;}catch(_){return null;} }
    async function loadFavoriteKeys(){ try{ const r=await fetch(`/api/deals?action=favorites&_ts=${Date.now()}`,{credentials:'include',cache:'no-store'}); if(!r.ok) return null; const d=await r.json(); if(Array.isArray(d.keys) && !d.remoteDisabled){ setFavorites(d.keys); return new Set(d.keys); } }catch(_){ } return null; }
    function render(items){
      if(!items.length){ document.getElementById('list').innerHTML='<div class="empty">찜한 가지가 아직 없어요.</div>'; return; }
      document.getElementById('list').innerHTML = items.map(i => `
        <a class="item" href="indexdetail.html?id=${encodeURIComponent(i.id)}">
          <div class="thumb-wrap"><img class="thumb" src="${i.img||FALLBACK}" onerror="this.src='${FALLBACK}'"><span class="fav">♥</span></div>
          <div><div class="item-title">${i.title||'제목 없음'}</div><div class="meta">${i.area||''} · ${i.time||i.date||''}</div><div class="price">${i.price||'-'}</div></div>
        </a>`).join('');
    }
    async function init(){
      const me = await loadMe() || window.GajiIdentity?.getUser?.();
      const remoteFav = await loadFavoriteKeys();
      const fav = remoteFav || getFavorites();
      let items = getItems();
      let filtered = items.filter(i => fav.has(getDealKey(i)));
      if(!filtered.length){
        items = await fetchItems();
        filtered = items.filter(i => fav.has(getDealKey(i)));
      }
      render(filtered);
    }
    init();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => undefined);
      });
    }
  </script>
</body>
</html>
