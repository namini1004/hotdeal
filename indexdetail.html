  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const LEGACY_STORAGE_KEY = 'hotdeal_items_v2';
    const DELETED_KEY = 'hotdeal_deleted_keys_v1';
    const READ_KEY = 'hotdeal_read_keys_v1';
    const USER_CACHE_KEY = 'gaji_auth_user_cache_v1';
    const DETAIL_CACHE_PREFIX = 'gaji_deal_detail_v1:';
    const DETAIL_BOOTSTRAP_KEY = 'hotdeal_detail_bootstrap_v1';
    const DEALS_API = '/api/deals';
    let currentItem = null;
    let currentUser = null;
    let currentAdmin = null;
    let currentComments = [];

    function normalizeItems(items){
      return (items || []).map((item, idx) => ({
        id: String(item.id ?? idx + 1),
        title: item.title || '제목 없음',
        area: item.area || '뽐뿌 핫딜',
        time: item.time || item.date || '',
        relativeTime: window.TimeFormat?.toRelativeKorean(item.registeredAt || item.date || '') || item.time || item.date || '',
        category: item.category || '핫딜',
        price: item.price || '-',
        desc: item.desc ?? '',
        img: item.img || 'https://images.unsplash.com/photo-1560393464-5c69a73c5770?auto=format&fit=crop&w=1400&q=80',
        detailImg: item.detailImg || item.detail_img || item.img || '',
        buyLink: item.buyLink || '',
        sourceLink: item.sourceLink || '',
        date: item.date || '',
        registeredAt: item.registeredAt || '',
        source: item.source || '',
        edited: Boolean(item.edited)
      }));
    }

    function parseStoredItems(key){
      try{
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return normalizeItems(Array.isArray(parsed) ? parsed : parsed.items || parsed.today || parsed.grouped?.today || []);
      }catch(_){
        return [];
      }
    }

    function dedupeItems(items){
      const seen = new Set();
      return (items || []).filter(item => {
        const key = getDealKey(item);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function canonicalDealKey(item = {}){
      const source = item?.source || 'feed';
      const sourceLink = String(item?.sourceLink || '').trim();
      if(source === 'ppomppu'){
        const noMatch = sourceLink.match(/[?&]no=(\d+)/);
        if(noMatch) return source + '::no:' + noMatch[1];
      }
      if(source === 'fmkorea'){
        const idMatch = sourceLink.match(/fmkorea\.com\/(\d+)/);
        if(idMatch) return source + '::doc:' + idMatch[1];
      }
      if(source === 'quasar'){
        const idMatch = sourceLink.match(/\/views\/(\d+)/);
        if(idMatch) return source + '::view:' + idMatch[1];
      }
      if(source === 'ruliweb'){
        const idMatch = sourceLink.match(/\/read\/(\d+)/);
        if(idMatch) return source + '::read:' + idMatch[1];
      }
      return sourceLink ? source + '::' + sourceLink : '';
    }

    function getDealKey(item){
      const canonicalKey = canonicalDealKey(item);
      if(canonicalKey) return canonicalKey;
      if(item?.id) return 'id:' + item.id + ':' + (item.date || '');
      return 'title:' + (item?.title || '') + ':' + (item?.date || '');
    }

    function getFavoriteDealKeys(item){
      return [...new Set([
        getDealKey(item),
        canonicalDealKey(item),
        item?.sourceLink || '',
        item?.id ? 'id:' + item.id + ':' + (item.date || '') : '',
        item?.title ? 'title:' + item.title + ':' + (item.date || '') : ''
      ].filter(Boolean))];
    }

    const FALLBACK_IMAGE = 'assets/gaji-eggplant.jpg';

    function optimizeImageUrl(src){
      const raw = String(src || '').trim();
      if(!raw) return FALLBACK_IMAGE;
      // 런타임 이미지 프록시는 원본 사이트 밴 리스크가 있어 사용하지 않는다.
      // 뽐뿌 이미지는 GitHub Actions 동기화 시 Supabase Storage에 미러링된 URL을 우선 저장한다.
      // 기존 원격 URL이 남아 있는 동안은 cdn2 -> cdn3 호스트 보정만 적용하고, 실패 시 fallback으로 내린다.
      return /^https:\/\/cdn2\.ppomppu\.co\.kr\//i.test(raw)
        ? raw.replace(/^https:\/\/cdn2\.ppomppu\.co\.kr\//i, 'https://cdn3.ppomppu.co.kr/')
        : raw;
    }

    function makeJpegFallbackUrl(src){
      const raw = String(src || '').trim();
      if(!raw) return '';
      try{
        const resolved = new URL(raw, location.origin);
        if(!/\.webp(?:$|\?)/i.test(resolved.pathname) && !/format=webp/i.test(resolved.search)) return '';
        if(resolved.pathname === '/api/image-proxy'){
          const original = resolved.searchParams.get('url');
          if(!original) return '';
          const originUrl = new URL(original);
          return `https://wsrv.nl/?url=${encodeURIComponent(originUrl.host + originUrl.pathname + originUrl.search)}&output=jpg`;
        }
        return `https://wsrv.nl/?url=${encodeURIComponent(resolved.host + resolved.pathname + resolved.search)}&output=jpg`;
      }catch(_){
        return '';
      }
    }

    function sameImageUrl(a, b){
      const left = String(a || '').trim();
      const right = String(b || '').trim();
      if(!left || !right) return left === right;
      try{
        return new URL(left, location.origin).href === new URL(right, location.origin).href;
      }catch(_){
        return left === right;
      }
    }

    function applyProgressiveDetailImage(imgEl, item){
      const thumbUrl = optimizeImageUrl(item.img);
      const detailUrl = optimizeImageUrl(item.detailImg || item.detail_img || item.img);
      imgEl.src = thumbUrl;
      imgEl.alt = item.title;
      imgEl.dataset.webpRetried = '0';
      imgEl.onerror = () => {
        const next = makeJpegFallbackUrl(imgEl.src);
        if(imgEl.dataset.webpRetried !== '1' && next){
          imgEl.dataset.webpRetried = '1';
          imgEl.src = next;
          return;
        }
        imgEl.onerror = null;
        imgEl.src = FALLBACK_IMAGE;
      };

      if(!detailUrl || sameImageUrl(thumbUrl, detailUrl)) return;
      const highRes = new Image();
      highRes.onload = () => {
        if(currentItem && String(currentItem.id || '') === String(item.id || '')){
          imgEl.dataset.webpRetried = '0';
          imgEl.src = detailUrl;
        }
      };
      highRes.src = detailUrl;
    }

    const COMMENT_STORAGE_PREFIX = 'gaji_deal_comments_v1:';

    function getGuestKey(){
      let key = localStorage.getItem(GUEST_KEY);
      if(!key){
        key = window.GajiIdentity?.getDeviceId?.() || `guest-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;

    function getCommentNickname(){

    function clearLocalComments(item = currentItem){

          localStorage.removeItem(COMMENT_STORAGE_PREFIX + encodeURIComponent(key));

    function normalizeComments(comments){
      const seen = new Set();
      return (comments || []).map((comment, idx) => ({
        id: String(comment.id || `local-${idx}`),
        dealKey: comment.dealKey || comment.deal_key || '',
        nickname: comment.nickname || '익명 가지',
        body: comment.body || comment.comment || '',
        createdAt: comment.createdAt || comment.created_at || new Date().toISOString(),
        guestKey: comment.guestKey || comment.guest_key || '',
        parentId: String(comment.parentId || comment.parent_id || '').trim()
      })).filter(comment => {
        if(!comment.body.trim()) return false;
        const key = `${comment.id}|${comment.dealKey}|${comment.parentId}|${comment.body}`;
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function isOwnComment(comment){
      const mine = getGuestKey();
      return Boolean(comment?.guestKey && mine && String(comment.guestKey) === String(mine));
    }

    function escapeHtml(text){
      return String(text || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function commentAvatarUrl(nickname){
      if(window.GajiIdentity?.getAvatarUrl) return window.GajiIdentity.getAvatarUrl(nickname);
      const name = String(nickname || '가지').trim() || '가지';
      let hash = 0;
      for(let i = 0; i < name.length; i += 1){
        hash = ((hash << 5) - hash + name.charCodeAt(i)) | 0;
      }
      const palettes = [
        ['#4c1d95','#7c3aed'],
        ['#312e81','#6366f1'],
        ['#164e63','#0891b2'],
        ['#14532d','#16a34a'],
        ['#7c2d12','#ea580c'],
        ['#831843','#db2777'],
        ['#111827','#6d28d9'],
        ['#1f2937','#0f766e']
      ];
      const [bg, mid] = palettes[Math.abs(hash) % palettes.length];
      const parts = name.replace(/\s+/g, ' ').split(' ').filter(Boolean);
      const initial = escapeHtml((parts[0]?.charAt(0) || '') + (parts[1]?.charAt(0) || parts[0]?.charAt(1) || ''));
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="${bg}"/><path d="M0 96C25 60 54 43 96 35v61H0Z" fill="${mid}" opacity=".88"/><circle cx="74" cy="20" r="28" fill="${mid}" opacity=".34"/><text x="48" y="58" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" stroke="rgba(0,0,0,.18)" stroke-width="1" paint-order="stroke">${initial || '가'}</text></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function updateComposerAvatar(){
      const form = document.getElementById('commentForm');
      if(form) form.style.setProperty('--composer-avatar', `url("${commentAvatarUrl(getCommentNickname())}")`);

    function formatCommentTime(value){
      return window.TimeFormat?.toRelativeKorean(value) || '';
    }

    function renderComments(comments = currentComments){
      const normalized = normalizeComments(comments).sort((a,b) => Date.parse(b.createdAt || '') - Date.parse(a.createdAt || ''));
      const list = document.getElementById('commentList');
      const count = document.getElementById('commentsCount');
      const note = document.getElementById('commentNicknameNote');
      if(count) count.textContent = normalized.length ? normalized.length.toLocaleString('ko-KR') : '0';
      if(note) note.innerHTML = `${escapeHtml(getCommentNickname())} 닉네임으로 댓글이 등록됩니다.<br>변경은 <a href="nickname.html">닉네임 설정</a>에서 가능합니다.`;
      updateComposerAvatar();
      if(!list) return;
      if(!normalized.length){
        list.innerHTML = '<div class="comment-empty">첫 댓글을 남겨보세요.</div>';
        return;
      }
      const byParent = new Map();
      normalized.forEach(comment => {
        const key = comment.parentId || '';
        if(!byParent.has(key)) byParent.set(key, []);
        byParent.get(key).push(comment);
      });
      const topLevel = (byParent.get('') || []).sort((a,b) => Date.parse(b.createdAt || '') - Date.parse(a.createdAt || ''));
      const renderOne = (comment, isReply = false) => {
        const avatar = escapeHtml(commentAvatarUrl(comment.nickname));
        const canDelete = isOwnComment(comment);
        const actions = [
          isReply ? '' : `<button class="reply-btn" type="button" data-reply-to="${escapeHtml(comment.id)}" data-reply-name="${escapeHtml(comment.nickname)}">답글</button>`,
          canDelete ? `<button class="comment-delete-btn" type="button" data-delete-comment="${escapeHtml(comment.id)}">삭제</button>` : ''
        ].filter(Boolean).join('');
        return `
          <article class="comment-item${isReply ? ' reply' : ''}" data-comment-id="${escapeHtml(comment.id)}">
            <div class="comment-avatar"><img src="${avatar}" alt="" aria-hidden="true"></div>
            <div class="comment-main">
              <div class="comment-meta"><span class="comment-name">${escapeHtml(comment.nickname)}</span><span>${escapeHtml(formatCommentTime(comment.createdAt))}</span></div>
              <div class="comment-body">${escapeHtml(comment.body)}</div>
              ${actions ? `<div class="comment-actions">${actions}</div>` : ''}
            </div>
          </article>
        `;
      };
      list.innerHTML = topLevel.map(comment => {
        const replies = (byParent.get(comment.id) || []).sort((a,b) => Date.parse(a.createdAt || '') - Date.parse(b.createdAt || ''));
        return `
          <section class="comment-thread${replies.length ? ' has-replies' : ''}">
            ${renderOne(comment)}
            ${replies.length ? `<div class="reply-list">${replies.map(reply => renderOne(reply, true)).join('')}</div>` : ''}
            <div class="reply-slot" id="replySlot-${escapeHtml(comment.id)}"></div>
          </section>
        `;
      }).join('');
      requestAnimationFrame(updateReplyConnectors);
    }

    function updateReplyConnectors(){
      document.querySelectorAll('.comment-thread.has-replies').forEach(thread => {
        const parentAvatar = thread.querySelector(':scope > .comment-item:not(.reply) .comment-avatar');
        const replyAvatars = thread.querySelectorAll('.comment-item.reply .comment-avatar');
        const lastReplyAvatar = replyAvatars[replyAvatars.length - 1];
        if(!parentAvatar || !lastReplyAvatar) return;
        const threadRect = thread.getBoundingClientRect();
        const parentRect = parentAvatar.getBoundingClientRect();
        const replyRect = lastReplyAvatar.getBoundingClientRect();
        const top = Math.max(0, parentRect.bottom - threadRect.top - 1);
        const end = replyRect.top + (replyRect.height / 2) - threadRect.top;
        const bottom = Math.max(0, threadRect.bottom - end);
        thread.style.setProperty('--thread-line-top', `${top}px`);
        thread.style.setProperty('--thread-line-bottom', `${bottom}px`);
      });
    }

    async function loadComments(item = currentItem){
      currentComments = [];
      clearLocalComments(item);
      renderComments([]);
      try{
        const dealKeys = getCommentDealKeys(item);
        const res = await fetch(`${COMMENT_API}&dealKeys=${encodeURIComponent(JSON.stringify(dealKeys))}`, { cache:'no-store', credentials:'include' });
        if(!res.ok) throw new Error('comment fetch failed');
        const data = await res.json();
        const remoteItems = Array.isArray(data.items) ? data.items : [];
        currentComments = normalizeComments(remoteItems);
        renderComments(currentComments);
      }catch(_){
        showToast('댓글을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
        currentComments = [];
        renderComments([]);
      }
    }

    async function postComment(body, parentId = ''){
      if(!currentItem || !body.trim()) return false;
      const comment = {
        dealKey:getDealKey(currentItem),
        nickname:getCommentNickname(),
        body:body.trim(),
        guestKey:getGuestKey(),
        parentId:String(parentId || '')
      };
      try{
        const res = await fetch(COMMENT_API, {
          method:'POST',
          credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(comment)
        });
        const data = await res.json().catch(() => ({}));
        if(!res.ok || !data.item) throw new Error(data.error || '댓글 저장 실패');
        currentComments = normalizeComments([data.item, ...currentComments]);
        renderComments(currentComments);
        return true;
      }catch(err){
        showToast(err.message || '댓글 저장에 실패했어요.');
        return false;
      }
    }

    async function deleteComment(commentId){
      const id = String(commentId || '').trim();
      if(!id || !currentItem) return;
      const mine = getGuestKey();
      const local = normalizeComments(currentComments);
      const target = local.find(comment => comment.id === id);
      if(!target || !isOwnComment(target)){
        showToast('내 댓글만 삭제할 수 있습니다.');
        return;
      }
      const removeIds = new Set([id]);
      local.forEach(comment => {
        if(comment.parentId === id && isOwnComment(comment)) removeIds.add(comment.id);
      });
      try{
        const res = await fetch(`${COMMENT_API}&id=${encodeURIComponent(id)}&dealKey=${encodeURIComponent(getDealKey(currentItem))}&guestKey=${encodeURIComponent(mine)}`, {
          method:'DELETE',
          cache:'no-store',
          credentials:'include'
        });
        if(!res.ok) throw new Error('delete failed');
        currentComments = local.filter(comment => !removeIds.has(comment.id));
        renderComments(currentComments);
        showToast('삭제되었습니다.');
      }catch(_){
        showToast('댓글 삭제에 실패했어요.');
      }
    }

    function bindCommentForm(){
      const form = document.getElementById('commentForm');
      const input = document.getElementById('commentInput');
      const list = document.getElementById('commentList');
      if(!form || !input) return;
      input.addEventListener('input', () => autoResizeTextarea(input));
      autoResizeTextarea(input);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if(!text) return;
        input.value = '';
        autoResizeTextarea(input);
        const ok = await postComment(text);
        if(!ok){ input.value = text; autoResizeTextarea(input); }
      });
      list?.addEventListener('click', (e) => {
        const deleteBtn = e.target.closest('.comment-delete-btn');
        if(deleteBtn){
          deleteComment(deleteBtn.dataset.deleteComment || '');
          return;
        }
        const btn = e.target.closest('.reply-btn');
        if(!btn) return;
        openReplyComposer(btn.dataset.replyTo || '', btn.dataset.replyName || '');
      });
    }

    function autoResizeTextarea(el){
      if(!el) return;
      const maxHeight = 118;
      el.style.height = 'auto';
      const nextHeight = Math.min(el.scrollHeight, maxHeight);
      el.style.height = `${nextHeight}px`;
      el.classList.toggle('is-scrollable', el.scrollHeight > maxHeight + 1);

              <button class="reply-submit" type="submit" disabled>답글</button>
            </div>
          </div>
        </form>
      `;
      const form = slot.querySelector('form');
      const input = slot.querySelector('textarea');
      const submit = slot.querySelector('.reply-submit');
      slot.querySelector('.reply-cancel')?.addEventListener('click', () => { slot.innerHTML = ''; });
      input?.addEventListener('input', () => {
        autoResizeTextarea(input);
        const ready = Boolean(input.value.trim());
        submit.disabled = !ready;
        submit.classList.toggle('ready', ready);
      });
      autoResizeTextarea(input);
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if(!text) return;
        const ok = await postComment(text, parentId);
        if(ok) slot.innerHTML = '';
      });
      input?.focus();
    }

    function sameRenderableItem(a, b){
      if(!a || !b) return false;
      return [
        a.title || '',
        a.price || '',
        a.desc || '',
        a.img || '',
        a.detailImg || a.detail_img || '',
        a.views || 0,
        a.comments || 0,
        a.updatedAt || a.registeredAt || a.date || ''
      ].join('|') === [
        b.title || '',
        b.price || '',
        b.desc || '',
        b.img || '',
        b.detailImg || b.detail_img || '',
        b.views || 0,
        b.comments || 0,
        b.updatedAt || b.registeredAt || b.date || ''
      ].join('|');
    }

    async function fetchItemById(id){
      const res = await fetch(`${DEALS_API}?id=${encodeURIComponent(id)}`, { cache: 'no-store' });
      if(!res.ok){
        const error = new Error('fetch failed');
        error.status = res.status;
        throw error;
      }
      const data = await res.json();
      return data.item;
    }

    async function loadMe(){
      try{
        const res = await fetch(`/api/auth?action=me&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) return null;
        const data = await res.json();
        currentUser = data.user || null;
        if(currentUser){
          localStorage.setItem(USER_CACHE_KEY, JSON.stringify(currentUser));
        }
        return currentUser;
      }catch(_){
        currentUser = window.GajiIdentity?.getUser?.() || null;
        return currentUser;
      }
    }

    async function loadAdmin(){
      try{
        const res = await fetch(`/api/auth?action=admin&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) return null;
        const data = await res.json();
        currentAdmin = data.admin || null;
        return currentAdmin;
      }catch(_){
        currentAdmin = null;
        return null;
      }
    }

    function refreshActionMenu(){
      const isAdmin = Boolean(currentAdmin);
      document.querySelectorAll('.admin-only').forEach(el => {
        el.style.display = isAdmin ? 'block' : 'none';
      });
      document.querySelectorAll('.user-only').forEach(el => {
        el.style.display = isAdmin ? 'none' : 'block';
      });
    }

    function showToast(message){
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function positionActionMenu(){
      const button = document.getElementById('moreBtn');
      const menu = document.getElementById('actionSheet');
      const rect = button.getBoundingClientRect();
      const gap = 8;
      const margin = 8;
      const menuWidth = menu.offsetWidth || 168;
      const menuHeight = menu.offsetHeight || 132;
      const left = Math.max(margin, Math.min(rect.right - menuWidth, window.innerWidth - menuWidth - margin));
      const top = Math.max(margin, Math.min(rect.bottom + gap, window.innerHeight - menuHeight - margin));
      menu.style.left = `${left}px`;
      menu.style.right = 'auto';
      menu.style.top = `${top}px`;
    }

    function openSheet(){
      positionActionMenu();
      document.getElementById('sheetBackdrop').classList.add('show');
      document.getElementById('actionSheet').classList.add('show');
      document.getElementById('moreBtn').setAttribute('aria-expanded', 'true');
    }

    function closeSheet(){
      document.getElementById('sheetBackdrop').classList.remove('show');
      document.getElementById('actionSheet').classList.remove('show');
      document.getElementById('moreBtn').setAttribute('aria-expanded', 'false');
    }
    async function deleteCurrentDeal(){
      if(!currentItem) return;
      if(!currentAdmin){
        showToast('관리자만 삭제할 수 있습니다.');
        closeSheet();
        return;
      }
      const key = getDealKey(currentItem);
      if(String(currentItem.id || '').startsWith('user-')){
        try{
          const res = await fetch(`${DEALS_API}/${encodeURIComponent(currentItem.id)}`, { method:'DELETE' });
          if(!res.ok) throw new Error('delete failed');
        }catch(_){
          showToast('삭제에 실패했습니다.');
          closeSheet();
          return;
        }
      }else{
        saveDeletedKey(key);
      }
      removeDeletedFromCache(key);
      closeSheet();
      showToast('삭제되었습니다.');
      setTimeout(() => {
        location.href = 'index.html';
      }, 450);
    }

    function editCurrentDeal(){
      if(!currentItem) return;
      if(!currentAdmin){
        showToast('관리자만 편집할 수 있습니다.');
        closeSheet();
        return;
      }
      closeSheet();
      location.href = `indexcreate.html?editId=${encodeURIComponent(currentItem.id)}`;
    }

    async function reportCurrentDeal(){
      if(!currentItem) return;
      const reportBtn = document.getElementById('reportBtn');
      reportBtn.disabled = true;
      try{
        const res = await fetch(`${DEALS_API}?action=report`, {
          method:'POST',
          credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            targetId:String(currentItem.id || ''),
            reason:'user_report',
            memo:currentItem.title || ''
          })
        });
        const data = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error(data.error || 'report failed');
        closeSheet();
        if(data.deleted){
          saveDeletedKey(getDealKey(currentItem));
          removeDeletedFromCache(getDealKey(currentItem));
          showToast('신고가 접수되어 글이 삭제되었습니다.');
          setTimeout(() => {
            location.href = 'index.html';
          }, 600);
          return;
        }
        showToast('신고가 접수되었습니다.');
      }catch(_){
        showToast('신고 접수에 실패했습니다.');
      }finally{
        reportBtn.disabled = false;
      }
    }

    async function copyShareUrl(url){
      if(navigator.clipboard?.writeText){
        await navigator.clipboard.writeText(url);
        return;
      }
      const input = document.createElement('input');
      input.value = url;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();
    }

    function getCanonicalShareUrl(){
      const id = currentItem?.id || new URLSearchParams(location.search).get('id') || '';
      if(id) return `https://gaji.run/d/${encodeURIComponent(id)}`;
      return `https://gaji.run${location.pathname}${location.search || ''}`;
    }

    function getShareText(){
      if(!currentItem) return '가지에서 핫딜을 확인해보세요.';
      const price = currentItem.price && currentItem.price !== '-' ? ` ${currentItem.price}` : '';
      return `[가지] ${currentItem.title}${price}`;
    }

    async function shareCurrentDeal(){
      const title = getShareText();
      const url = getCanonicalShareUrl();
      if(window.HotdealAndroid?.share){
        window.HotdealAndroid.share(title, url);
        return;
      }
      if(navigator.share){
        try{
          await navigator.share({ title, text: title, url });
          return;
        }catch(err){
          if(err?.name === 'AbortError') return;
        }
      }

      try{
        await copyShareUrl(url);
        showToast('링크가 복사되었습니다.');
      }catch(_){
        showToast('링크 복사에 실패했습니다.');
      }
    }

    async function init(){
      bindCommentForm();
      const id = new URLSearchParams(location.search).get('id');
      const cachedItems = getCachedItems();
      const bootstrapItem = readDetailBootstrap(id);
      const cachedDetail = readCachedDetail(id);
      let item = cachedDetail || bootstrapItem || cachedItems.find(v => String(v.id) === String(id)) || null;
      const isBootstrapOnly = Boolean(!cachedDetail && bootstrapItem && item === bootstrapItem);

      if(item && isDeleted(item)){
        location.replace('index.html');
        return;
      }

      if(item){
        currentItem = item;
        markAsRead(item);
        renderItem(item, { loadComments: false, renderDesc: !isBootstrapOnly, saveCache: !isBootstrapOnly });
        requestAnimationFrame(() => loadComments(item));
        refreshFavoriteUI();
      }else{
        const fallback = {title:'로딩 중...',price:'-',desc:'상품 정보를 불러오는 중입니다.',img:'',category:'핫딜',time:''};
        renderItem(fallback, { loadComments: false });
      }

      const userReady = loadMe()
        .then(() => loadRemoteFavorites())
        .then(() => refreshFavoriteUI())
        .catch(() => refreshFavoriteUI());
      loadAdmin()
        .then(() => refreshActionMenu())
        .catch(() => refreshActionMenu());

      if(!id){
        if(!item){
          const first = cachedItems[0] || {title:'상품 없음',price:'-',desc:'등록된 상품이 없습니다.',img:''};
          currentItem = first;
          renderItem(first);
        }
        await userReady;
        return;
      }

      try{
        const latest = await fetchItemById(id);
        if(latest && !isDeleted(latest)){
          currentItem = latest;
          markAsRead(latest);
          if(!sameRenderableItem(item, latest) || isBootstrapOnly){
            renderItem(latest, { loadComments: false, renderDesc: true });
          }
          if(!item){
            loadComments(latest);
          }
          refreshFavoriteUI();
          // A single-detail response does not carry a feed-wide comparable temperature.
          // Keep it in the detail cache and never rewrite the ordered home feed cache here.
          saveCachedDetail(latest);
        }
      }catch(error){
        if(error?.status === 404){
          if(item) saveDeletedKey(getDealKey(item));
          clearCachedDetail(id);
          removeItemIdFromCache(id);
          sessionStorage.removeItem(DETAIL_BOOTSTRAP_KEY);
          renderNotFound();
          refreshFavoriteUI();
        }
      }
      await userReady;
    }

    document.getElementById('shareBtn').addEventListener('click', shareCurrentDeal);
    document.getElementById('moreBtn').addEventListener('click', openSheet);
    document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);
    document.getElementById('closeSheetBtn').addEventListener('click', closeSheet);
    document.getElementById('deleteBtn').addEventListener('click', deleteCurrentDeal);
    document.getElementById('editBtn').addEventListener('click', editCurrentDeal);
    document.getElementById('reportBtn').addEventListener('click', reportCurrentDeal);
    document.getElementById('favToggleBtn').addEventListener('click', async () => {
      if(!currentItem) return;
      if(!currentUser){
        await loadMe();
      }
      if(!currentUser){
        currentUser = window.GajiIdentity?.getUser?.() || null;
      }
      const next = !isFavorited(currentItem);
      setFavorited(currentItem, next);
      refreshFavoriteUI();
      try{
        await syncFavorite(currentItem, next);
      }catch(_){
      }
      showToast(next ? '찜했어요.' : '찜을 해제했어요.');
    });
    init();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => undefined);
      });
    }
  </script>
