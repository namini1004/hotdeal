  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@500');
    :root{--line:#eee9f8;--muted:#8b95a1;--brand:#7c3aed;--brand-rgb:124,58,237;--page:#f7f4ff}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#111827;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:500;font-style:normal;font-size:24px;line-height:1;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:84px;background:#fff}
    .hero{position:relative}
    .hero img{width:100%;height:320px;object-fit:cover;display:block;background:#f3f4f6}
    .hero-fav-badge{position:absolute;right:14px;bottom:14px;width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.92);display:none;place-items:center;color:#ef4444;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
    .topbtns{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between;color:#fff}
    .icon-link,.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:none;border-radius:999px;background:rgba(17,24,39,.42);color:#fff;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
    .top-actions{display:flex;gap:6px}

    .content{padding:18px 16px;border-top:1px solid var(--line);background:#fff}
    h1{margin:0;font-size:21px;line-height:1.35;letter-spacing:-.02em;font-weight:600}
    .price{margin-top:8px;font-size:24px;font-weight:700;letter-spacing:-.02em}
    .meta{font-size:12px;color:var(--muted);margin:8px 0 14px}
    .desc{font-size:15px;line-height:1.45;letter-spacing:-.005em;white-space:normal}
    .desc p{margin:.22em 0}
    .desc h1{margin:.7em 0 .34em;font-size:1.16em;line-height:1.35;font-weight:900}
    .desc h2{margin:.62em 0 .3em;font-size:1.06em;line-height:1.35;font-weight:900}
    .desc h3{margin:.56em 0 .28em;font-size:1em;line-height:1.35;font-weight:800}
    .desc ul,.desc ol{margin:.28em 0 .28em 1.1em;padding:0}
    .desc li{margin:.12em 0}
    .desc a{color:#2563eb;text-decoration:underline;word-break:break-all}
    .desc .md-table-wrap{overflow-x:auto;margin:.5em 0}
    .desc .md-table{width:100%;border-collapse:collapse;font-size:13px}
    .desc .md-table th,.desc .md-table td{border:1px solid #e5e7eb;padding:8px 10px;text-align:left;vertical-align:top}
    .desc .md-table th{background:#f8fafc;font-weight:800}
    .comments-panel{padding:16px;background:#fff;border-top:1px solid var(--line)}
    .comments-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .comments-title{font-size:18px;font-weight:950;letter-spacing:-.03em}.comments-count{color:var(--muted);font-size:13px;font-weight:850}
    .comment-list{display:grid;gap:16px;padding-bottom:12px}.comment-item{display:grid;grid-template-columns:36px 1fr;gap:10px}.comment-item.reply{grid-template-columns:30px 1fr;margin-left:46px}.comment-avatar{width:36px;height:36px;border-radius:999px;background:#f3edff;color:#5b21b6;display:grid;place-items:center;font-size:13px;font-weight:950;overflow:hidden}.comment-item.reply .comment-avatar{width:30px;height:30px}.comment-avatar img{width:100%;height:100%;display:block;object-fit:cover}.comment-main{min-width:0}.comment-meta{display:flex;align-items:center;gap:6px;color:#8b95a1;font-size:12px;font-weight:800}.comment-name{color:#4b5563;font-weight:950}.comment-body{margin-top:4px;color:#111827;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap}.comment-actions{margin-top:8px;display:flex;align-items:center;gap:12px}.reply-btn{border:none;background:transparent;color:#6b7280;font-size:12px;font-weight:900;padding:0;cursor:pointer}.comment-empty{padding:20px 0;color:#8b95a1;font-size:14px;text-align:center}.comment-composer{--composer-avatar:none;position:sticky;bottom:78px;display:flex;align-items:center;gap:8px;padding:10px 0 0;background:#fff}.comment-composer:before,.reply-composer:before{content:"";width:38px;height:38px;border-radius:999px;flex:0 0 auto;background:#f3edff var(--composer-avatar) center/cover no-repeat}.comment-input{flex:1;height:44px;border:1px solid #e5e7eb;border-radius:999px;background:#f4f4f5;padding:0 14px;font-size:14px;outline:none}.comment-input:focus{border-color:#d8c7ff;background:#fff;box-shadow:0 0 0 3px rgba(124,58,237,.08)}.comment-send{width:44px;height:44px;border:1px solid #eadfff;border-radius:999px;background:#fff;color:#7c3aed;font-size:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(124,58,237,.1);position:relative}.comment-send:before{content:"↵";font-size:23px;line-height:1;font-weight:950;display:block}.comment-send:disabled{opacity:.38;cursor:not-allowed}.reply-composer{--composer-avatar:none;display:flex;align-items:center;gap:8px;margin:10px 0 2px;padding-left:0}.reply-composer .comment-input{height:40px;border-radius:0;border-width:0 0 2px 0;background:#fff;padding:0 2px}.reply-actions{display:flex;align-items:center;gap:8px}.reply-cancel{height:40px;border:none;background:transparent;color:#374151;font-size:13px;font-weight:900;cursor:pointer}.reply-submit{height:40px;border:none;border-radius:999px;background:#f1f1f1;color:#9ca3af;padding:0 15px;font-size:13px;font-weight:900;cursor:pointer}.reply-submit.ready{background:#7c3aed;color:#fff}.comment-note{margin-top:8px;color:#9ca3af;font-size:11px;line-height:1.35}
    .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(12px);padding:10px 14px;border-radius:999px;background:rgba(17,24,39,.88);color:#fff;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:20}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.36);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s linear .2s;z-index:30}
    .sheet-backdrop.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s ease}
    .action-sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(calc(100% + 48px));padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -18px 44px rgba(17,24,39,.18);transition:transform .22s ease,visibility 0s linear .22s;z-index:31}
    .action-sheet.show{visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);transition:transform .22s ease}
    .sheet-btn{width:100%;height:52px;border:none;border-radius:12px;background:#f4f6f8;color:#111827;font-size:16px;font-weight:800;cursor:pointer}
    .sheet-btn + .sheet-btn{margin-top:8px}
    .sheet-btn.edit{background:var(--brand);color:#fff}
    .sheet-btn.delete{background:#fff1f2;color:#dc2626}
    .bottom-cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:8px 16px calc(env(safe-area-inset-bottom) + 8px);background:#fff;border-top:none;z-index:10}
    .cta-row{display:grid;grid-template-columns:54px 1fr 1fr;gap:10px}
    .cta-btn{height:54px;display:flex;align-items:center;justify-content:center;border-radius:14px;text-decoration:none;font-size:16px;font-weight:900}
    .heart-cta{border:none;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center}
    .heart-icon{width:34px;height:34px;display:block}
    .heart-icon path{fill:none;stroke:#9ca3af;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:fill .18s ease,stroke .18s ease}
    .heart-cta.active .heart-icon path{fill:#ef4444;stroke:#ef4444}
    .source-bottom{background:#f3edff;color:#4c1d95;border:1px solid #d8c7ff}
    .buy-bottom{background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(var(--brand-rgb),.32)}


    a{text-decoration:none;color:inherit}

    @media (min-width:768px){
      body{background:#fff}
      .app{max-width:1280px;display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr) minmax(320px,360px);gap:0;height:100vh;min-height:100vh;margin:0 auto;padding:0 0 64px;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden}
      .hero{height:calc(100vh - 64px);min-height:calc(100vh - 64px)}
      .hero img{height:100%;min-height:calc(100vh - 64px)}
      .topbtns{top:16px;left:16px;right:16px}
      .icon-link,.icon-btn{width:36px;height:36px}
      .material-symbols-outlined{font-size:24px}
      .content{border-top:none;border-left:1px solid var(--line);height:calc(100vh - 64px);min-height:calc(100vh - 64px);padding:42px 38px;background:#fff;overflow:auto}
      .comments-panel{height:calc(100vh - 64px);min-height:calc(100vh - 64px);border-top:none;border-left:1px solid var(--line);padding:24px 20px;overflow:auto}
      .comment-composer{bottom:0;padding-bottom:10px}
      h1{font-size:26px;line-height:1.35;font-weight:600}
      .price{font-size:30px;margin-top:14px}
      .meta{font-size:13px;margin:10px 0 18px}
      .desc{font-size:16px;line-height:1.5}
      .toast{bottom:96px}
      .sheet-backdrop{display:grid;place-items:end center}
      .action-sheet{max-width:420px;margin-bottom:24px;border-radius:18px;box-shadow:0 18px 50px rgba(17,24,39,.18)}
      .buy-bottom{height:56px}
      .cta-btn{font-size:17px}
      .bottom-cta{max-width:1080px;padding:8px 20px 0;background:#fff;box-shadow:none;bottom:0}
    }

    @media (min-width:1180px){
      .app{grid-template-columns:520px minmax(0,1fr) 360px}
    }
  </style>

<body>

  <div class="bottom-cta" id="buyBottomWrap" style="display:none">

      <button id="favToggleBtn" class="heart-cta" type="button" aria-label="찜하기" aria-pressed="false">

          <path d="M12.1 21.35 11 20.3C5.14 15.24 2 12.39 2 8.9 2 6.05 4.24 4 7 4c1.74 0 3.41.81 4.5 2.09C12.59 4.81 14.26 4 16 4c2.76 0 5 2.05 5 4.9 0 3.49-3.14 6.34-8.9 11.45z"/>
        </svg>

      <a id="sourceBottom" class="cta-btn source-bottom" href="#" target="_blank" rel="noopener">원본보기</a>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="action-sheet" id="actionSheet" role="dialog" aria-modal="true" aria-label="게시물 메뉴">
    <button class="sheet-btn edit" id="editBtn" type="button">편집하기</button>
    <button class="sheet-btn delete" id="deleteBtn" type="button">삭제하기</button>
    <button class="sheet-btn" id="closeSheetBtn" type="button">닫기</button>
  </div>

  <script src="assets/text-format.js"></script>
  <script src="assets/time-format.js"></script>
  <script src="assets/anonymous-identity.js?v=20260603"></script>
  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const LEGACY_STORAGE_KEY = 'hotdeal_items_v2';
    const DELETED_KEY = 'hotdeal_deleted_keys_v1';
    const READ_KEY = 'hotdeal_read_keys_v1';
    const USER_CACHE_KEY = 'gaji_auth_user_cache_v1';
    const DETAIL_CACHE_PREFIX = 'gaji_deal_detail_v1:';
    const DEALS_API = '/api/deals';
    let currentItem = null;
    let currentUser = null;

    function normalizeItems(items){
      return (items || []).map((item, idx) => ({
        id: String(item.id ?? idx + 1),
        title: item.title || '제목 없음',
        area: item.area || '뽐뿌 핫딜',
        time: item.time || item.date || '',
        relativeTime: window.TimeFormat?.toRelativeKorean(item.registeredAt || item.date || '') || item.time || item.date || '',
        category: item.category || '핫딜',
        price: item.price || '-',
        desc: item.desc ?? '',
        img: item.img || 'https://images.unsplash.com/photo-1560393464-5c69a73c5770?auto=format&fit=crop&w=1400&q=80',
        detailImg: item.detailImg || item.detail_img || item.img || '',
        buyLink: item.buyLink || '',
        sourceLink: item.sourceLink || '',
        date: item.date || '',
        registeredAt: item.registeredAt || '',
        source: item.source || '',
        edited: Boolean(item.edited)
      }));
    }

    function parseStoredItems(key){
      try{
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return normalizeItems(Array.isArray(parsed) ? parsed : parsed.items || parsed.today || parsed.grouped?.today || []);
      }catch(_){
        return [];
      }
    }

    function dedupeItems(items){
      const seen = new Set();
      return (items || []).filter(item => {
        const key = getDealKey(item);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function saveItems(items){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }

    function getDealKey(item){
      if(item?.sourceLink) return item.sourceLink;
      if(item?.id) return `id:${item.id}:${item.date || ''}`;
      return `title:${item?.title || ''}:${item?.date || ''}`;
    }

    function getDeletedKeys(){
      try{
        return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'));
      }catch(_){
        return new Set();
      }
    }

    function saveDeletedKey(key){
      const keys = getDeletedKeys();
      keys.add(key);
      localStorage.setItem(DELETED_KEY, JSON.stringify([...keys]));
    }

    function removeDeletedFromCache(key){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      try{
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed)){
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed.filter(item => getDealKey(item) !== key)));
          return;
        }
        for(const tab of ['today', 'yesterday']){
          parsed[tab] = (parsed[tab] || []).filter(item => getDealKey(item) !== key);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      }catch(_){ }
    }

    function isDeleted(item){
      return getDeletedKeys().has(getDealKey(item));
    }

    function markAsRead(item){
      const key = getDealKey(item);
      if(!key) return;
      try{
        const set = new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));
        set.add(key);
        localStorage.setItem(READ_KEY, JSON.stringify([...set]));
      }catch(_){ }
    }

    function getCurrentUserFromCache(){
      try{ return JSON.parse(localStorage.getItem(USER_CACHE_KEY) || 'null'); }catch(_){ return null; }
    }

    function favoriteStorageKey(){
      const user = currentUser || getCurrentUserFromCache();
      return `hotdeal_favorites_${user?.id || user?.email || 'guest'}`;
    }

    function getFavoriteKeys(){
      try{ return new Set(JSON.parse(localStorage.getItem(favoriteStorageKey()) || '[]')); }catch(_){ return new Set(); }
    }

    function isFavorited(item){
      return getFavoriteKeys().has(getDealKey(item));
    }

    function setFavorited(item, on){
      const key = getDealKey(item);
      if(!key) return;
      const set = getFavoriteKeys();
      if(on) set.add(key); else set.delete(key);
      localStorage.setItem(favoriteStorageKey(), JSON.stringify([...set]));
    }

    async function loadRemoteFavorites(){
      if(!currentUser) return;
      try{
        const res = await fetch(`${DEALS_API}?action=favorites&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) return;
        const data = await res.json();
        if(Array.isArray(data.keys)){
          localStorage.setItem(favoriteStorageKey(), JSON.stringify(data.keys));
        }
      }catch(_){ }
    }

    async function syncFavorite(item, on){
      const key = getDealKey(item);
      if(!key) return;
      const res = await fetch(`${DEALS_API}?action=favorite`, {
        method: on ? 'POST' : 'DELETE',
        credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ dealKey: key })
      });
      if(!res.ok) throw new Error('favorite sync failed');
    }

    function refreshFavoriteUI(){
      const btn = document.getElementById('favToggleBtn');
      const badge = document.getElementById('heroFavBadge');
      if(!btn || !badge || !currentItem) return;
      const on = isFavorited(currentItem);
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      badge.style.display = on ? 'grid' : 'none';
    }

    const FALLBACK_IMAGE = 'assets/gaji-eggplant.jpg';

    function optimizeImageUrl(src){
      const raw = String(src || '').trim();
      if(!raw) return FALLBACK_IMAGE;
      // 런타임 이미지 프록시는 원본 사이트 밴 리스크가 있어 사용하지 않는다.
      // 뽐뿌 이미지는 GitHub Actions 동기화 시 Supabase Storage에 미러링된 URL을 우선 저장한다.
      // 기존 원격 URL이 남아 있는 동안은 cdn2 -> cdn3 호스트 보정만 적용하고, 실패 시 fallback으로 내린다.
      return /^https:\/\/cdn2\.ppomppu\.co\.kr\//i.test(raw)
        ? raw.replace(/^https:\/\/cdn2\.ppomppu\.co\.kr\//i, 'https://cdn3.ppomppu.co.kr/')
        : raw;
    }

    function makeJpegFallbackUrl(src){
      const raw = String(src || '').trim();
      if(!raw) return '';
      try{
        const resolved = new URL(raw, location.origin);
        if(!/\.webp(?:$|\?)/i.test(resolved.pathname) && !/format=webp/i.test(resolved.search)) return '';
        if(resolved.pathname === '/api/image-proxy'){
          const original = resolved.searchParams.get('url');
          if(!original) return '';
          const originUrl = new URL(original);
          return `https://wsrv.nl/?url=${encodeURIComponent(originUrl.host + originUrl.pathname + originUrl.search)}&output=jpg`;
        }
        return `https://wsrv.nl/?url=${encodeURIComponent(resolved.host + resolved.pathname + resolved.search)}&output=jpg`;
      }catch(_){
        return '';
      }
    }

    function sameImageUrl(a, b){
      const left = String(a || '').trim();
      const right = String(b || '').trim();
      if(!left || !right) return left === right;
      try{
        return new URL(left, location.origin).href === new URL(right, location.origin).href;
      }catch(_){
        return left === right;
      }
    }

    function applyProgressiveDetailImage(imgEl, item){
      const thumbUrl = optimizeImageUrl(item.img);
      const detailUrl = optimizeImageUrl(item.detailImg || item.detail_img || item.img);
      imgEl.src = thumbUrl;
      imgEl.alt = item.title;
      imgEl.dataset.webpRetried = '0';
      imgEl.onerror = () => {
        const next = makeJpegFallbackUrl(imgEl.src);
        if(imgEl.dataset.webpRetried !== '1' && next){
          imgEl.dataset.webpRetried = '1';
          imgEl.src = next;
          return;
        }
        imgEl.onerror = null;
        imgEl.src = FALLBACK_IMAGE;
      };

      if(!detailUrl || sameImageUrl(thumbUrl, detailUrl)) return;
      const highRes = new Image();
      highRes.onload = () => {
        if(currentItem && String(currentItem.id || '') === String(item.id || '')){
          imgEl.dataset.webpRetried = '0';
          imgEl.src = detailUrl;
        }
      };
      highRes.src = detailUrl;
    }

    function getCachedItems(){
      return dedupeItems([...parseStoredItems(STORAGE_KEY), ...parseStoredItems(LEGACY_STORAGE_KEY)]);
    }

    function detailCacheKey(id){
      return DETAIL_CACHE_PREFIX + encodeURIComponent(String(id || ''));
    }

    function readCachedDetail(id){
      try{
        const item = JSON.parse(localStorage.getItem(detailCacheKey(id)) || 'null');
        return item ? normalizeItems([item])[0] : null;
      }catch(_){
        return null;
      }
    }

    function saveCachedDetail(item){
      if(!item?.id) return;
      localStorage.setItem(detailCacheKey(item.id), JSON.stringify(item));
    }

    function renderRichText(text){
      if(window.TextFormat?.markdownToHtml){
        return window.TextFormat.markdownToHtml(text || '');
      }
      return String(text || '');
    }

    function shouldUseSingleSourceCta(item){
      if(!item) return true;
      if(item.source === 'ruliweb') return true;
      if(!item.buyLink) return true;
      return Boolean(item.sourceLink && item.buyLink === item.sourceLink);
    }

    function renderItem(item){
      if(item?.id) saveCachedDetail(item);
      document.title = item?.title ? `${item.title} - 가지딜` : '가지딜 - 핫딜 상세';
      document.getElementById('title').textContent = item.title;
      document.getElementById('price').textContent = item.price;
      document.getElementById('meta').textContent = `${item.category || '핫딜'} · ${item.relativeTime || item.time || '날짜 없음'}`;
      const imgEl = document.getElementById('img');
      applyProgressiveDetailImage(imgEl, item);
      document.getElementById('desc').innerHTML = renderRichText(item.desc);

      const sourceBottom = document.getElementById('sourceBottom');
      const buyBottom = document.getElementById('buyBottom');
      const buyBottomWrap = document.getElementById('buyBottomWrap');
      buyBottomWrap.style.display = 'none';
      sourceBottom.style.gridColumn = '';
      sourceBottom.textContent = '원본보기';
      buyBottom.textContent = '사러가기';
      buyBottom.style.display = 'flex';
      sourceBottom.href = '#';
      buyBottom.href = '#';

      loadComments(item);

      if(item.sourceLink || item.buyLink){
        const singleSourceCta = shouldUseSingleSourceCta(item);
        sourceBottom.href = item.sourceLink || item.buyLink || '#';
        if(singleSourceCta){
          sourceBottom.style.gridColumn = '2 / 4';
          buyBottom.style.display = 'none';
        }else{
          buyBottom.href = item.buyLink;
        }
        buyBottomWrap.style.display = 'block';
      }
    }


    const COMMENT_STORAGE_PREFIX = 'gaji_deal_comments_v1:';
    const GUEST_NICKNAME_KEY = 'gaji_guest_nickname_v1';
    const GUEST_KEY = 'gaji_guest_key_v1';
    const COMMENT_API = '/api/deals?action=comments';

    const NICK_ADJECTIVES = ['빠른','상냥한','반짝이는','차분한','야무진','든든한','귀여운','날카로운','포근한','신나는'];
    const NICK_NOUNS = ['가지','딜냥이','알림이','장바구니','고래','펭귄','여우','별빛','구름','파도'];

    function randomPick(list){ return list[Math.floor(Math.random() * list.length)]; }

    function getGuestKey(){
      let key = localStorage.getItem(GUEST_KEY);
      if(!key){
        key = `guest-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
        localStorage.setItem(GUEST_KEY, key);
      }
      return key;
    }

    function getCommentNickname(){
      const cachedUser = getCurrentUserFromCache();
      if(cachedUser?.nickname) return cachedUser.nickname;
      let nickname = localStorage.getItem(GUEST_NICKNAME_KEY);
      if(!nickname){
        nickname = `${randomPick(NICK_ADJECTIVES)} ${randomPick(NICK_NOUNS)}${Math.floor(10 + Math.random() * 90)}`;
        localStorage.setItem(GUEST_NICKNAME_KEY, nickname);
      }
      return nickname;
    }

    function commentStorageKey(item = currentItem){
      return COMMENT_STORAGE_PREFIX + encodeURIComponent(getDealKey(item));
    }

    function readLocalComments(item = currentItem){
      try{
        const parsed = JSON.parse(localStorage.getItem(commentStorageKey(item)) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      }catch(_){ return []; }
    }

    function saveLocalComments(comments, item = currentItem){
      localStorage.setItem(commentStorageKey(item), JSON.stringify(comments));
    }

    function normalizeComments(comments){
      return (comments || []).map((comment, idx) => ({
        id: String(comment.id || `local-${idx}`),
        dealKey: comment.dealKey || comment.deal_key || '',
        nickname: comment.nickname || '익명 가지',
        body: comment.body || comment.comment || '',
        createdAt: comment.createdAt || comment.created_at || new Date().toISOString(),
        guestKey: comment.guestKey || comment.guest_key || '',
        parentId: String(comment.parentId || comment.parent_id || '').trim()
      })).filter(comment => comment.body.trim());
    }

    function escapeHtml(text){
      return String(text || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function commentAvatarUrl(nickname){
      if(window.GajiIdentity?.getAvatarUrl) return window.GajiIdentity.getAvatarUrl(nickname);
      const name = String(nickname || '가지').trim() || '가지';
      let hash = 0;
      for(let i = 0; i < name.length; i += 1){
        hash = ((hash << 5) - hash + name.charCodeAt(i)) | 0;
      }
      const palettes = [
        ['#f3edff','#7c3aed','#4c1d95'],
        ['#eef2ff','#6366f1','#312e81'],
        ['#ecfeff','#0891b2','#164e63'],
        ['#f0fdf4','#16a34a','#14532d'],
        ['#fff7ed','#ea580c','#7c2d12'],
        ['#fdf2f8','#db2777','#831843']
      ];
      const [bg, mid, ink] = palettes[Math.abs(hash) % palettes.length];
      const initial = escapeHtml(name.charAt(0));
      const tilt = (Math.abs(hash) % 17) - 8;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="${bg}"/><circle cx="66" cy="28" r="18" fill="${mid}" opacity=".18"/><circle cx="29" cy="72" r="24" fill="${mid}" opacity=".12"/><g transform="translate(48 49) rotate(${tilt})"><ellipse cx="0" cy="6" rx="16" ry="22" fill="${mid}"/><path d="M6-16c8-6 16-6 22-1-7 1-14 5-18 12" fill="${ink}"/></g><text x="48" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#fff">${initial}</text></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function updateComposerAvatar(){
      const form = document.getElementById('commentForm');
      if(form) form.style.setProperty('--composer-avatar', `url("${commentAvatarUrl(getCommentNickname())}")`);
    }

    function formatCommentTime(value){
      return window.TimeFormat?.toRelativeKorean(value) || '';
    }

    function renderComments(comments = readLocalComments()){
      const normalized = normalizeComments(comments).sort((a,b) => Date.parse(b.createdAt || '') - Date.parse(a.createdAt || ''));
      const list = document.getElementById('commentList');
      const count = document.getElementById('commentsCount');
      const note = document.getElementById('commentNicknameNote');
      if(count) count.textContent = normalized.length ? normalized.length.toLocaleString('ko-KR') : '0';
      if(note) note.textContent = `${getCommentNickname()} 닉네임으로 댓글이 등록됩니다. 변경은 내 가지에서 로그인 후 가능합니다.`;
      updateComposerAvatar();
      if(!list) return;
      if(!normalized.length){
        list.innerHTML = '<div class="comment-empty">첫 댓글을 남겨보세요.</div>';
        return;
      }
      const byParent = new Map();
      normalized.forEach(comment => {
        const key = comment.parentId || '';
        if(!byParent.has(key)) byParent.set(key, []);
        byParent.get(key).push(comment);
      });
      const topLevel = (byParent.get('') || []).sort((a,b) => Date.parse(b.createdAt || '') - Date.parse(a.createdAt || ''));
      const renderOne = (comment, isReply = false) => {
        const avatar = escapeHtml(commentAvatarUrl(comment.nickname));
        return `
          <article class="comment-item${isReply ? ' reply' : ''}" data-comment-id="${escapeHtml(comment.id)}">
            <div class="comment-avatar"><img src="${avatar}" alt="" aria-hidden="true"></div>
            <div class="comment-main">
              <div class="comment-meta"><span class="comment-name">${escapeHtml(comment.nickname)}</span><span>${escapeHtml(formatCommentTime(comment.createdAt))}</span></div>
              <div class="comment-body">${escapeHtml(comment.body)}</div>
              ${isReply ? '' : `<div class="comment-actions"><button class="reply-btn" type="button" data-reply-to="${escapeHtml(comment.id)}" data-reply-name="${escapeHtml(comment.nickname)}">답글</button></div><div class="reply-slot" id="replySlot-${escapeHtml(comment.id)}"></div>`}
            </div>
          </article>
        `;
      };
      list.innerHTML = topLevel.map(comment => {
        const replies = (byParent.get(comment.id) || []).sort((a,b) => Date.parse(a.createdAt || '') - Date.parse(b.createdAt || ''));
        return renderOne(comment) + replies.map(reply => renderOne(reply, true)).join('');
      }).join('');
    }

    async function loadComments(item = currentItem){
      const local = readLocalComments(item);
      renderComments(local);
      try{
        const res = await fetch(`${COMMENT_API}?dealKey=${encodeURIComponent(getDealKey(item))}`, { cache:'no-store' });
        if(!res.ok) return;
        const data = await res.json();
        const remote = normalizeComments(data.items || []);
        if(remote.length){
          saveLocalComments(remote, item);
          renderComments(remote);
        }
      }catch(_){ }
    }

    async function postComment(body, parentId = ''){
      if(!currentItem || !body.trim()) return;
      const comment = {
        id:`local-${Date.now()}`,
        dealKey:getDealKey(currentItem),
        nickname:getCommentNickname(),
        body:body.trim(),
        createdAt:new Date().toISOString(),
        guestKey:getGuestKey(),
        parentId:String(parentId || '')
      };
      const next = [comment, ...readLocalComments(currentItem)];
      saveLocalComments(next, currentItem);
      renderComments(next);
      try{
        const res = await fetch(COMMENT_API, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(comment)
        });
        if(res.ok){
          const data = await res.json();
          if(data.item){
            const merged = [normalizeComments([data.item])[0], ...next.filter(v => v.id !== comment.id)];
            saveLocalComments(merged, currentItem);
            renderComments(merged);
          }
        }
      }catch(_){ }
    }

    function bindCommentForm(){
      const form = document.getElementById('commentForm');
      const input = document.getElementById('commentInput');
      const list = document.getElementById('commentList');
      if(!form || !input) return;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if(!text) return;
        input.value = '';
        await postComment(text);
      });
      list?.addEventListener('click', (e) => {
        const btn = e.target.closest('.reply-btn');
        if(!btn) return;
        openReplyComposer(btn.dataset.replyTo || '', btn.dataset.replyName || '');
      });
    }

    function openReplyComposer(parentId, parentName){
      document.querySelectorAll('.reply-slot').forEach(slot => { slot.innerHTML = ''; });
      const slot = document.getElementById(`replySlot-${parentId}`);
      if(!slot) return;
      slot.innerHTML = `
        <form class="reply-composer" id="replyForm" style="--composer-avatar:url('${commentAvatarUrl(getCommentNickname())}')">
          <input class="comment-input" id="replyInput" maxlength="500" placeholder="${escapeHtml(parentName)}에게 답글 추가..." autocomplete="off" />
          <div class="reply-actions">
            <button class="reply-cancel" type="button">취소</button>
            <button class="reply-submit" type="submit" disabled>답글</button>
          </div>
        </form>
      `;
      const form = slot.querySelector('form');
      const input = slot.querySelector('input');
      const submit = slot.querySelector('.reply-submit');
      slot.querySelector('.reply-cancel')?.addEventListener('click', () => { slot.innerHTML = ''; });
      input?.addEventListener('input', () => {
        const ready = Boolean(input.value.trim());
        submit.disabled = !ready;
        submit.classList.toggle('ready', ready);
      });
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if(!text) return;
        slot.innerHTML = '';
        await postComment(text, parentId);
      });
      input?.focus();
    }

    function sameRenderableItem(a, b){
      if(!a || !b) return false;
      return [
        a.title || '',
        a.price || '',
        a.desc || '',
        a.img || '',
        a.detailImg || a.detail_img || '',
        a.views || 0,
        a.comments || 0,
        a.updatedAt || a.registeredAt || a.date || ''
      ].join('|') === [
        b.title || '',
        b.price || '',
        b.desc || '',
        b.img || '',
        b.detailImg || b.detail_img || '',
        b.views || 0,
        b.comments || 0,
        b.updatedAt || b.registeredAt || b.date || ''
      ].join('|');
    }

    async function fetchItemById(id){
      const res = await fetch(`${DEALS_API}?id=${encodeURIComponent(id)}`, { cache: 'no-store' });
      if(!res.ok) throw new Error('fetch failed');
      const data = await res.json();
      return data.item;
    }

    async function loadMe(){
      try{
        const res = await fetch(`/api/auth?action=me&_ts=${Date.now()}`, { credentials:'include', cache:'no-store' });
        if(!res.ok) return null;
        const data = await res.json();
        currentUser = data.user || null;
        if(currentUser){
          localStorage.setItem(USER_CACHE_KEY, JSON.stringify(currentUser));
        }
        return currentUser;
      }catch(_){
        currentUser = window.GajiIdentity?.getUser?.() || null;
        return currentUser;
      }
    }

    function showToast(message){
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function openSheet(){
      document.getElementById('sheetBackdrop').classList.add('show');
      document.getElementById('actionSheet').classList.add('show');
    }

    function closeSheet(){
      document.getElementById('sheetBackdrop').classList.remove('show');
      document.getElementById('actionSheet').classList.remove('show');
    }

    async function deleteCurrentDeal(){
      if(!currentItem) return;
      const key = getDealKey(currentItem);
      if(String(currentItem.id || '').startsWith('user-')){
        try{
          const res = await fetch(`${DEALS_API}/${encodeURIComponent(currentItem.id)}`, { method:'DELETE' });
          if(!res.ok) throw new Error('delete failed');
        }catch(_){
          showToast('삭제에 실패했습니다.');
          closeSheet();
          return;
        }
      }else{
        saveDeletedKey(key);
      }
      removeDeletedFromCache(key);
      closeSheet();
      showToast('삭제되었습니다.');
      setTimeout(() => {
        location.href = 'index.html';
      }, 450);
    }

    function editCurrentDeal(){
      if(!currentItem) return;
      closeSheet();
      location.href = `indexcreate.html?editId=${encodeURIComponent(currentItem.id)}`;
    }

    async function copyShareUrl(url){
      if(navigator.clipboard?.writeText){
        await navigator.clipboard.writeText(url);
        return;
      }
      const input = document.createElement('input');
      input.value = url;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();
    }

    function getCanonicalShareUrl(){
      const id = currentItem?.id || new URLSearchParams(location.search).get('id') || '';
      if(id) return `https://gaji.run/d/${encodeURIComponent(id)}`;
      return `https://gaji.run${location.pathname}${location.search || ''}`;
    }

    function getShareText(){
      if(!currentItem) return '가지딜에서 핫딜을 확인해보세요.';
      const price = currentItem.price && currentItem.price !== '-' ? ` ${currentItem.price}` : '';
      return `[가지딜] ${currentItem.title}${price}`;
    }

    async function shareCurrentDeal(){
      const title = getShareText();
      const url = getCanonicalShareUrl();
      if(window.HotdealAndroid?.share){
        window.HotdealAndroid.share(title, url);
        return;
      }
      if(navigator.share){
        try{
          await navigator.share({ title, text: title, url });
          return;
        }catch(err){
          if(err?.name === 'AbortError') return;
        }
      }

      try{
        await copyShareUrl(url);
        showToast('링크가 복사되었습니다.');
      }catch(_){
        showToast('링크 복사에 실패했습니다.');
      }
    }

    async function init(){
      bindCommentForm();
      await loadMe();
      await loadRemoteFavorites();
      const id = new URLSearchParams(location.search).get('id');
      const cachedItems = getCachedItems();
      let item = readCachedDetail(id) || cachedItems.find(v => String(v.id) === String(id)) || null;

      if(item && isDeleted(item)){
        location.replace('index.html');
        return;
      }

      if(item){
        currentItem = item;
        markAsRead(item);
        renderItem(item);
        refreshFavoriteUI();
      }else{
        const fallback = {title:'로딩 중...',price:'-',desc:'상품 정보를 불러오는 중입니다.',img:'',category:'핫딜',time:''};
        renderItem(fallback);
      }

      if(!id){
        if(!item){
          const first = cachedItems[0] || {title:'상품 없음',price:'-',desc:'등록된 상품이 없습니다.',img:''};
          currentItem = first;
          renderItem(first);
        }
        return;
      }

      if(item){
        return;
      }

      try{
        const latest = await fetchItemById(id);
        if(latest && !isDeleted(latest)){
          currentItem = latest;
          markAsRead(latest);
          if(!sameRenderableItem(item, latest)){
            renderItem(latest);
          }
          refreshFavoriteUI();
          const existingIdx = cachedItems.findIndex(v => String(v.id) === String(latest.id));
          const next = [...cachedItems];
          if(existingIdx >= 0){
            next[existingIdx] = { ...next[existingIdx], ...latest };
          }else{
            next.push(latest);
          }
          saveItems(dedupeItems(next));
        }
      }catch(_){
      }
    }

    document.getElementById('shareBtn').addEventListener('click', shareCurrentDeal);
    document.getElementById('moreBtn').addEventListener('click', openSheet);
    document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);
    document.getElementById('closeSheetBtn').addEventListener('click', closeSheet);
    document.getElementById('deleteBtn').addEventListener('click', deleteCurrentDeal);
    document.getElementById('editBtn').addEventListener('click', editCurrentDeal);
    document.getElementById('favToggleBtn').addEventListener('click', async () => {
      if(!currentItem) return;
      if(!currentUser){
        await loadMe();
      }
      if(!currentUser){
        currentUser = window.GajiIdentity?.getUser?.() || null;
      }
      const next = !isFavorited(currentItem);
      setFavorited(currentItem, next);
      refreshFavoriteUI();
      try{
        await syncFavorite(currentItem, next);
        showToast(next ? '찜했어요.' : '찜을 해제했어요.');
      }catch(_){
        setFavorited(currentItem, !next);
        refreshFavoriteUI();
        showToast('찜 저장에 실패했습니다. 다시 시도해주세요.');
      }
    });
    init();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => undefined);
      });
    }
  </script>
