<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>핫딜 상세</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    :root{--line:#eef1f4;--muted:#8b95a1;--brand:#ff6f0f}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#111827;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:92px}
    .hero{position:relative}
    .hero img{width:100%;height:320px;object-fit:cover;display:block;background:#f3f4f6}
    .topbtns{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;color:#fff;font-size:24px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45)}

    .content{padding:18px 16px;border-top:1px solid var(--line)}
    h1{margin:0;font-size:22px;line-height:1.35;letter-spacing:-.03em}
    .price{margin-top:10px;font-size:28px;font-weight:900;letter-spacing:-.03em}
    .meta{font-size:13px;color:var(--muted);margin:10px 0 16px}
    .desc{font-size:16px;line-height:1.65;letter-spacing:-.01em;white-space:pre-line}
    .buy-top{display:inline-flex;align-items:center;justify-content:center;margin:12px 0 14px;padding:10px 14px;border-radius:10px;background:#111827;color:#fff;text-decoration:none;font-size:14px;font-weight:700}

    a{text-decoration:none;color:inherit}
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <img id="img" alt="상품 이미지">
      <div class="topbtns"><a href="index.html">‹</a><div>⌂  ⤴  ⋮</div></div>
    </section>

    <section class="content">
      <h1 id="title"></h1>
      <a id="buyTop" class="buy-top" href="#" target="_blank" rel="noopener" style="display:none">사러가기</a>
      <div class="price" id="price"></div>
      <div class="meta" id="meta"></div>
      <div class="desc" id="desc"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'hotdeal_items_v3';
    const FEED_PATH = 'assets/ppomppu_hotdeals_2days.json';

    function normalizeItems(items){
      return (items || []).map((item, idx) => ({
        id: String(item.id ?? idx + 1),
        title: item.title || '제목 없음',
        area: item.area || '뽐뿌 핫딜',
        time: item.time || item.date || '',
        category: item.category || '핫딜',
        price: item.price || '-',
        desc: item.desc || '상품 설명이 아직 등록되지 않았습니다.',
        img: item.img || 'https://images.unsplash.com/photo-1560393464-5c69a73c5770?auto=format&fit=crop&w=1400&q=80',
        buyLink: item.buyLink || '',
        date: item.date || ''
      }));
    }

    async function getItems(){
      try{
        const res = await fetch(FEED_PATH, { cache: 'no-store' });
        if(res.ok){
          const data = await res.json();
          const all = normalizeItems([...(data.grouped?.today || []), ...(data.grouped?.yesterday || [])]);
          localStorage.setItem(STORAGE_KEY, JSON.stringify({today:data.grouped?.today||[], yesterday:data.grouped?.yesterday||[]}));
          return all;
        }
      }catch(_){ }

      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        try{
          const parsed = JSON.parse(raw);
          return normalizeItems([...(parsed.today || []), ...(parsed.yesterday || [])]);
        }catch(_){ }
      }
      return [];
    }

    async function init(){
      const items = await getItems();
      const id = new URLSearchParams(location.search).get('id');
      const item = items.find(v => String(v.id) === String(id)) || items[0] || {title:'상품 없음',price:'-',desc:'등록된 상품이 없습니다.',img:''};

      document.getElementById('title').textContent = item.title;
      document.getElementById('price').textContent = item.price;
      document.getElementById('meta').textContent = `${item.category || '핫딜'} · ${item.time || '날짜 없음'}`;
      document.getElementById('img').src = item.img;
      document.getElementById('img').alt = item.title;
      document.getElementById('desc').textContent = item.desc;

      if(item.buyLink){
        const top = document.getElementById('buyTop');
        top.href = item.buyLink;
        top.style.display = 'inline-flex';
      }
    }

    init();
  </script>
</body>
</html>
