name: hotdeal-refresh-watchdog

on:
  schedule:
    # 본 refresh와 다른 offset에서 사이트 최신성을 확인해 GitHub 내부에서 보조 dispatch
    - cron: "22,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: hotdeal-refresh-watchdog
  cancel-in-progress: true

env:
  FEED_URL: https://gaji.run/api/deals?scope=feed
  STALE_THRESHOLD_MINUTES: "75"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production feed freshness
        id: freshness
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone

          url = os.environ["FEED_URL"] + "&watchdog_ts=" + str(int(time.time()))
          threshold = float(os.environ.get("STALE_THRESHOLD_MINUTES", "35"))
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "Cache-Control": "no-cache",
                  "User-Agent": "gaji-github-watchdog",
              },
          )

          latest = None
          count = 0
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  payload = json.load(response)
              items = payload.get("items") or []
              count = len(items)
              timestamps = [item.get("updatedAt") for item in items if item.get("updatedAt")]
              if timestamps:
                  latest = max(timestamps)
          except Exception as exc:
              print(f"WATCHDOG_FETCH_FAILED {exc}")

          stale = True
          age_minutes = 999999.0
          if latest:
              dt = datetime.fromisoformat(latest.replace("Z", "+00:00"))
              age_minutes = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 60
              stale = age_minutes > threshold

          print(f"WATCHDOG_FEED count={count} latest_update={latest} age_min={age_minutes:.1f} threshold={threshold} stale={stale}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stale={str(stale).lower()}\n")
              output.write(f"age_minutes={age_minutes:.1f}\n")
              output.write(f"latest_update={latest or ''}\n")
          PY

      - name: Dispatch refresh workflow when stale
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Production feed is stale for ${{ steps.freshness.outputs.age_minutes }} minutes; dispatching refresh."
          gh workflow run hotdeal-refresh-supabase.yml --ref "${GITHUB_REF_NAME}"
