name: hotdeal-refresh-supabase

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh feeds
        run: |
          python scripts/update_ppomppu_feed.py
          python scripts/update_quasar_feed.py
          python scripts/update_fmkorea_feed.py
          python scripts/update_ruliweb_feed.py

      - name: Upsert feeds to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_hotdeals_to_supabase.py
