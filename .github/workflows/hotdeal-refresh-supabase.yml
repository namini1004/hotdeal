name: hotdeal-refresh-supabase

on:
  schedule:
    # GitHub Actions의 정각/15/30/45분 혼잡 구간을 피해서 15분 간격 유지
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: hotdeal-refresh-supabase
  cancel-in-progress: false

jobs:
  refresh-ppomppu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh ppomppu feed
        run: timeout 8m python scripts/update_ppomppu_feed.py

      - name: Upload ppomppu feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-ppomppu
          path: assets/ppomppu_hotdeals_2days.json
          if-no-files-found: error
          retention-days: 1

  refresh-quasar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh quasar feed
        run: timeout 8m python scripts/update_quasar_feed.py

      - name: Upload quasar feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-quasar
          path: assets/quasar_hotdeals_2days.json
          if-no-files-found: error
          retention-days: 1

  refresh-fmkorea:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh fmkorea feed
        env:
          FMKOREA_DIAGNOSTIC_DIR: .artifacts/fmkorea-diagnostics
        run: timeout 8m python scripts/update_fmkorea_feed.py

      - name: Upload fmkorea feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-fmkorea
          path: assets/fmkorea_hotdeals_2days.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload fmkorea diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmkorea-diagnostics
          path: .artifacts/fmkorea-diagnostics/
          if-no-files-found: ignore
          retention-days: 3

  refresh-ruliweb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh ruliweb feed
        run: timeout 8m python scripts/update_ruliweb_feed.py

      - name: Upload ruliweb feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-ruliweb
          path: assets/ruliweb_hotdeals_1day.json
          if-no-files-found: error
          retention-days: 1

  upsert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - refresh-ppomppu
      - refresh-quasar
      - refresh-fmkorea
      - refresh-ruliweb
    if: ${{ always() && (needs.refresh-ppomppu.result == 'success' || needs.refresh-quasar.result == 'success' || needs.refresh-fmkorea.result == 'success' || needs.refresh-ruliweb.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Remove checkout feed snapshots before artifact merge
        run: |
          rm -f assets/ppomppu_hotdeals_2days.json \
                assets/quasar_hotdeals_2days.json \
                assets/fmkorea_hotdeals_2days.json \
                assets/ruliweb_hotdeals_1day.json

      - name: Download refreshed feed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          path: .downloaded-feeds
          merge-multiple: true

      - name: Copy downloaded feed artifacts into assets
        run: |
          mkdir -p assets
          cp .downloaded-feeds/*hotdeals*.json assets/

      - name: List merged feed artifacts
        run: |
          for file in assets/*hotdeals*.json; do
            [ -f "$file" ] || continue
            python - "$file" <<'PY'
          import json, sys
          p = sys.argv[1]
          data = json.load(open(p, encoding='utf-8'))
          print(p, data.get('sourceKey'), len(data.get('items') or []), 'staleFallback=', data.get('staleFallback'))
          PY
          done

      - name: Upsert feeds to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_hotdeals_to_supabase.py
